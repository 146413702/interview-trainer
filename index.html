{"s":5,"t":["theory"],"q":"Docker 的 Image 和 Container 有什么区别？","a":"Image（镜像）是只读的模板，包含应用代码、运行时、依赖、配置，是构建容器的基础，可以理解为\"类\"。\nContainer（容器）是镜像的运行实例，有独立的文件系统层（可写层）、网络、PID 空间，可以理解为\"对象\"。\n一个镜像可以启动多个容器，容器之间相互隔离。\n镜像用 `docker build` 构建，`docker images` 查看；容器用 `docker run` 启动，`docker ps` 查看。镜像类似软件安装包，容器类似正在运行的程序。\n补充 Docker 核心组件全貌：镜像（Image，只读模板）、容器（Container，运行实例）、仓库（Registry，存镜像，如 Docker Hub / Harbor）、Dockerfile（构建镜像的指令文件）、Docker Daemon（后台守护进程，管理镜像/容器/网络）、Docker Client（命令行客户端）。一句话类比：镜像=类，容器=对象，仓库=代码托管，Dockerfile=构建说明书。"},
{"s":5,"t":["project","practice"],"q":"为什么要做容器化迁移？解决了什么问题？","a":"我们当时的核心痛点是环境不一致：\"代码在我机器上能跑，在你机器上跑不了\"。容器化解决了：\n- 环境标准化：应用 + 运行时 + 依赖一起打包成镜像，开发/测试/生产环境完全一致\n- 部署简化：`docker run` 一条命令启动，替代繁琐的手工安装配置\n- 隔离性：容器之间互不影响，资源限制可控\n- 交付效率：镜像即产物，多环境复用，配合 CI/CD 实现自动化部署\n我们也踩过坑：数据持久化、时区、字符集、端口冲突，都通过 Volume 挂载、环境变量、自定义网络解决。","c":"我们做容器化迁移的背景和解决：\n背景：组里各人电脑环境不一样，出现“在我这能跑、在你那跑不了”，部署要手敲一堆命令，环境配置容易漏。\n解决的 4 个问题：\n①环境不一致 → Dockerfile 把 JDK、依赖、配置文件全部固化进镜像，一次构建、处处运行；\n②部署繁琐 → docker-compose up -d 一条命令起全套（前端 + 2 个后端 + MySQL + Redis + Nginx），从部署半小时降到 3 分钟；\n③资源隔离和利用 → 容器按服务隔离，一台机器跑多套服务不打架；\n④标准化交付 → 镜像推 Harbor 私有仓库，测试/生产拉同一个镜像，杜绝“测试 OK 生产挂”。\n踩过的坑（挑 2 个讲透）：MySQL 容器重建数据丢失（没挂 volume，补 named volume）；容器时区差 8 小时（加 TZ=Asia/Shanghai）；Web 启动时数据库没就绪（depends_on + healthcheck）。\n结果：环境一致性解决，团队再没为“环境问题”扯过皮。"},
{"s":5,"t":["practice","project"],"q":"编写一个 Spring Boot 应用的 Dockerfile，并解释关键步骤？","a":"多阶段构建示例：\n`FROM maven:3.8-jdk-8 AS build`（第一阶段：编译）\n`WORKDIR /app`\n`COPY pom.xml .`\n`RUN mvn dependency:go-offline`（先拉依赖，利用层缓存）\n`COPY src ./src`\n`RUN mvn package -DskipTests`\n`FROM openjdk:8-jre-alpine`（第二阶段：只留运行环境）\n`COPY --from=build /app/target/app.jar app.jar`\n`RUN adduser -D appuser && USER appuser`（非 root 运行）\n`EXPOSE 8080`\n`ENTRYPOINT [\"java\",\"-jar\",\"app.jar\"]`\n关键点：多阶段构建缩小镜像、分层顺序优化缓存、非 root 用户提安全。","c":"多阶段构建的 Dockerfile（我实际用的）：\nFROM maven:3.8-jdk-8 AS build\nWORKDIR /app\nCOPY pom.xml .\nRUN mvn dependency:go-offline   # 先把依赖拉下来缓存，避免每次全量下载\nCOPY src ./src\nRUN mvn clean package -DskipTests\n\nFROM openjdk:8-jre-alpine          # 运行阶段只要 JRE，不需要 JDK 和 Maven\nCOPY --from=build /app/target/app.jar app.jar\nEXPOSE 8080\nENTRYPOINT [“java”,“-jar”,“/app.jar”]\n关键点解释：\n①多阶段：构建阶段用 maven 镜像，运行阶段用 openjdk 镜像，运行镜像里没有构建工具，更小更安全；\n②依赖缓存：先 COPY pom.xml 拉依赖，源码改动不会让依赖重新下载，构建快很多；\n③用 JRE 不用 JDK：镜像从 900MB 降到 320MB；\n④可以用 COPY --chown 指定非 root 用户运行，提升安全性。\n追问应对：如果问“alpine 镜像有什么坑”，答：alpine 用 musl libc，某些依赖原生编译可能不兼容，遇到再换 slim 版本。"},
{"s":5,"t":["theory","practice"],"q":"Docker 数据卷（Volume）和 bind mount 有什么区别？为什么用 Volume？","a":"Volume：由 Docker 管理的数据目录（`/var/lib/docker/volumes/`），用 `-v volume_name:/container/path` 挂载。独立于容器生命周期，容器删了数据还在，支持备份/迁移。\nBind Mount：直接挂载宿主机任意目录，`-v /host/path:/container/path`，方便但和宿主机耦合，权限问题多。\n我倾向用 Volume：\n- 数据安全：容器重建数据不丢\n- 可管理：`docker volume ls`、`docker volume inspect`\n- 跨宿主机迁移方便（配合卷插件）\n我们项目里 MySQL 数据、应用日志、Nginx 静态资源都用 Volume 持久化，容器随便重建，数据安全。"},
{"s":4,"t":["theory"],"q":"Docker 的镜像分层机制是什么？","a":"Docker 镜像由多个只读层（Layer）叠加而成，每层对应 Dockerfile 的一条指令。构建时若有层未变化，直接复用缓存。\n分层好处：①共享复用——多个镜像共享底层（如基础镜像层），节省磁盘；②增量传输——只推送变更的层；③构建缓存——层未变跳过执行，加快构建。\n因为分层，Dockerfile 的指令顺序很重要：把不常变化的指令（拷贝依赖）放前面，频繁变化的（拷源码）放后面，最大化缓存命中。"},
{"s":4,"t":["practice"],"q":"Dockerfile 中 COPY 和 ADD 有什么区别？","a":"COPY：仅把文件/目录从宿主机复制到镜像中。\nADD：在 COPY 基础上多了两个能力——支持 URL 下载文件，支持自动解压本地 tar 包。\n官方建议：优先用 COPY，语义明确；只有当确实需要 URL 下载或解压 tar 包时才用 ADD。\n另外注意：URL 下载的文件不会自动解压，也不会设置权限，而且用 ADD 拉远程资源不利于镜像安全审计，生产环境很少用。"},
{"s":4,"t":["project","practice"],"q":"如何给容器设置环境变量？SPRING_PROFILES_ACTIVE 是怎么用的？","a":"设置方式：①docker run 时 `-e KEY=VALUE`；②docker-compose.yml 里 `environment:` 字段；③Dockerfile 里 `ENV`（构建期固化）；④用 `env_file` 从 .env 文件读取（敏感信息推荐）。\n`SPRING_PROFILES_ACTIVE` 是 Spring Boot 用来激活 Profiles 的环境变量，比如：\n`docker run -e SPRING_PROFILES_ACTIVE=prod -p 8080:8080 app-image`\n应用会加载 `application-prod.yml`。这样就实现了\"一次构建，多环境运行\"——镜像只打一个，通过环境变量切换开发/测试/生产配置，避免了为每个环境打不同镜像。","c":"给容器设置环境变量两种方式：\n①docker run -e KEY=VALUE；\n②Compose 的 environment 字段（推荐，声明式）：\nservices:\n  app:\n    image: app:latest\n    environment:\n      - SPRING_PROFILES_ACTIVE=prod\n      - DB_HOST=mysql\n      - REDIS_HOST=redis\n\nSPRING_PROFILES_ACTIVE 的作用：Spring Boot 按 profile 加载 application-prod.yml，我们一套镜像，通过这个变量切换开发/测试/生产配置（数据源地址、Redis 地址、日志级别）。\n为什么用环境变量而不是写死在配置文件：\n①敏感信息（密码）不进镜像、不进代码仓库；\n②一套镜像多环境复用，镜像不用为每个环境单独构建；\n③运维部署时只需改 Compose 文件，不用改代码。\n补充：密码类敏感配置我们用 .env 文件 + Compose env_file，.env 不进 Git；要求再高就用 Docker Secret/K8s Secret 管理。"},
{"s":4,"t":["theory","project"],"q":"Docker Compose 中 depends_on 能保证服务就绪吗？","a":"不能完全保证。`depends_on` 只控制容器的启动顺序，保证依赖服务\"已启动\"（进程起来了），但不能保证\"已就绪\"（比如 MySQL 还在初始化、端口还没监听）。\n解决方式：搭配 `healthcheck`。给依赖服务（如 MySQL）配置健康检查：\n`healthcheck:\n  test: [\"CMD\", \"mysqladmin\", \"ping\", \"-h\", \"localhost\"]\n  interval: 5s\n  timeout: 3s\n  retries: 5`\n新版 compose 支持在 depends_on 里写 `condition: service_healthy`，确保依赖服务健康后再启动 Web 应用。我们项目就是用 depends_on + healthcheck 精确控制启动顺序，避免 Web 启动时数据库还没就绪导致连接失败。","c":"不能完全保证。depends_on 只保证容器启动的先后顺序，不保证“服务就绪”——比如 MySQL 容器启动了（进程起来了），但 3306 端口还没监听、还没初始化完，此时 Web 去连就失败。\n我们踩过：Web 启动连不上数据库，报 Connection refused，重试几次才好。\n解法（Compose 3.x）：\n①depends_on + healthcheck：\nservices:\n  mysql:\n    image: mysql:5.7\n    healthcheck:\n      test: [“CMD”, “mysqladmin”, “ping”, “-h”, “localhost”]\n      interval: 5s\n      timeout: 3s\n      retries: 10\n  app:\n    depends_on:\n      mysql:\n        condition: service_healthy\n这样 MySQL 健康后才启动 app；\n②应用侧兜底：连接池配置重试/等待，比如 Spring Boot 的 HikariCP 设置 connection-timeout 和初始化重试；\n③Nginx 层：upstream 后端没就绪时返回 502，配合 proxy_next_upstream 自动跳过故障实例。\n三层都做才算稳：编排层等就绪、应用层能重试、入口层能容错。"},
{"s":4,"t":["practice"],"q":"多容器编排：docker run 和 docker-compose 有什么区别？","a":"docker run：单容器启动命令，参数多而散，多容器时逐个管理，容易漏配、难以复用。\ndocker-compose：用 YAML 文件声明式编排多容器（服务、网络、卷、环境变量、依赖关系），一条 `docker-compose up -d` 启动整套服务。\nCompose 优势：配置可版本控制、环境可复制、服务依赖清晰、一键启停（`docker-compose up/down/restart/logs`）。\n我们项目用 docker-compose.yml 管理 Nginx + Web 应用 + MySQL + Redis 四个服务，一套文件对应一套环境。"},
{"s":3,"t":["troubleshoot"],"q":"如何排查容器启动失败的常见原因？","a":"排查三步：①`docker ps -a` 看容器状态（Exited 带退出码）；②`docker logs 容器ID` 看应用日志，这是最主要的信息来源；③`docker inspect 容器ID` 看配置、挂载、网络、环境变量是否正确。\n常见原因：\n- 端口冲突：`docker run -p 8080:8080` 端口被占 → `ss -tlnp | grep 8080`\n- 挂载路径不存在/权限不足：先建目录、调权限\n- 环境变量缺失：应用启动报配置错误\n- 内存不足 OOM：`dmesg | grep -i oom`\n- 健康检查失败被自动重启：看 healthcheck 配置\n再结合应用日志一步步定位。"},
{"s":3,"t":["theory"],"q":"Docker 自定义网络：bridge 和 host 有什么区别？","a":"bridge（默认）：容器通过虚拟网桥 NAT 通信，容器有独立 IP，容器间可用容器名互相访问。隔离性好，适合多容器应用互联（compose 默认创建 bridge 网络，服务名即域名）。\nhost：容器直接使用宿主机网络栈，无独立 IP，端口直接暴露，性能好但隔离性差、端口冲突风险高。\n实际用法：微服务之间用自定义 bridge 网络 + 容器名通信，避免依赖变化无常的 IP；需要高性能网络或大量端口映射时才考虑 host。\n另外两种网络模式也常被问到：none（容器无网络，完全隔离，适合安全敏感场景）、container（与指定容器共享网络命名空间，如 sidecar 代理模式）。完整答案把四种模式都说出来更稳。"},
{"s":3,"t":["practice"],"q":"如何进入一个正在运行的容器查看日志/执行命令？","a":"进入容器执行命令：`docker exec -it 容器名 /bin/bash`（或 sh，Alpine 镜像只有 sh）。\n查看日志：`docker logs -f --tail 100 容器名`（-f 实时跟踪，--tail 只显示最近100行）。\n查看进程：`docker top 容器名`；查看端口映射：`docker port 容器名`。\n注意：生产环境尽量少用 exec 进容器改东西（容器重建就丢），临时排查可以，持久化修改应该改镜像或挂载配置。"},
{"s":3,"t":["practice"],"q":"镜像瘦身怎么做？","a":"①多阶段构建：编译阶段用完整 JDK/Maven 镜像，运行阶段只保留 JRE 和产物。\n②基础镜像选小的：Alpine（5MB 级）、slim 版本，代替 ubuntu/centos 全量镜像。\n③清理构建缓存：apt/yum 安装后 `rm -rf /var/lib/apt/lists/*`，mvn 用 `-Dmaven.repo.local` 等。\n④减少层级：合并 RUN 指令（`RUN a && b && c`）。\n⑤. dockerignore：构建上下文排除 target/、.git、日志等无关文件。\n我们项目 Spring Boot 镜像从 400MB+ 优化到 100MB 左右，传输和启动都快了。"},
{"s":2,"t":["theory"],"q":"Docker 的 CMD 和 ENTRYPOINT 有什么区别？","a":"CMD：定义容器默认启动命令，可以被 `docker run` 后面的命令覆盖。\nENTRYPOINT：定义容器主命令，`docker run` 追加的参数会作为它的参数传入，而不是覆盖它。\n最佳实践：ENTRYPOINT 固定主程序，CMD 提供默认参数（可被覆盖）。比如：\n`ENTRYPOINT [\"java\",\"-jar\",\"app.jar\"]` + `CMD [\"--spring.profiles.active=prod\"]`，运行时 `docker run img --spring.profiles.active=dev` 可覆盖环境。"},
{"s":2,"t":["practice"],"q":"容器重启策略 restart 有哪些？怎么选？","a":"重启策略：\n- no：不自动重启（默认）\n- always：容器退出（包括手动 stop 后）都自动重启\n- on-failure[:max-retries]：非正常退出（退出码非0）时重启，可限次数\n- unless-stopped：退出时自动重启，但手动 stop 的不重启\n选择建议：业务服务用 `unless-stopped` 或 `always`；批处理/一次性任务用 `no` 或 `on-failure`；数据库等关键服务建议 `unless-stopped`。配合 healthcheck 才能真正保证服务可用性。"},
{"s":2,"t":["practice"],"q":"Docker Compose 常用命令有哪些？","a":"`docker-compose up -d`：构建并启动所有服务（-d 后台）；`docker-compose down`：停止并删除容器和默认网络；\n`docker-compose ps`：查看服务状态；`docker-compose logs -f 服务名`：跟踪日志；\n`docker-compose restart 服务名`：重启单个服务；`docker-compose build 服务名`：重新构建镜像；\n`docker-compose exec 服务名 bash`：进入服务容器；`docker-compose config`：校验并显示最终配置。\n升级镜像后常用 `docker-compose up -d --build 服务名` 重建并滚动更新。"},
{"s":3,"t":["practice"],"q":"容器日志怎么管理？docker logs 和日志驱动？","a":"`docker logs 容器名` 查看 stdout/stderr 日志，但默认是 json-file 驱动，日志会一直增长占用磁盘。\n日志驱动（logging driver）：\n- json-file（默认）：配 max-size 和 max-file 做轮转：`--log-opt max-size=10m --log-opt max-file=3`\n- journald：交给 systemd journal 统一管理\n- gelf/syslog：集中到日志系统\n- loki/fluentd：对接 ELK/Loki 日志平台\n生产建议：JSON 日志输出到 stdout 由平台采集，或者挂载 Volume + logrotate 管理文件日志，避免容器无限写日志撑爆磁盘。"},
{"s":3,"t":["practice"],"q":"如何给容器设置资源限制（CPU/内存）？为什么？","a":"`docker run` 限制：`-m 512m`（内存上限）、`--cpus 1.5`（CPU 核数）、`-m 512m --memory-swap 512m`（禁止 swap）。\nCompose 中配置：\n`deploy:\n  resources:\n    limits:\n      cpus: \"1.5\"\n      memory: 512M`\n原因：①防止单容器耗尽宿主机资源影响其他服务（特别是没设限制时内存泄漏会拖垮整机）；②为容量规划提供依据。\nJava 应用注意设置 JVM 堆上限（-Xmx），否则容器限制和 JVM 感知不一致，可能被 OOM Kill。"},
{"s":3,"t":["practice"],"q":"私有镜像仓库（Registry/Harbor）怎么搭？怎么推送拉取镜像？","a":"简单场景用官方 Registry：`docker run -d -p 5000:5000 --restart=always --name registry registry:2`。\n企业场景推荐 Harbor：自带 Web UI、权限管理（项目级）、镜像复制、漏洞扫描，安装方式：下载 Harbor 离线包 → 改 harbor.yml（hostname/端口/密码）→ `./install.sh`。\n推送流程：`docker tag app:v1 registry-host:5000/project/app:v1` → `docker login registry-host` → `docker push registry-host:5000/project/app:v1`。\n注意：HTTP 仓库需要在客户端配置 insecure-registries 信任，生产建议配 HTTPS。"},
{"s":3,"t":["theory","security"],"q":"Docker 容器安全加固有哪些手段？","a":"①最小权限：非 root 用户运行（Dockerfile 里 `USER`），容器内用 `--cap-drop ALL --cap-add` 最小化内核能力。\n②镜像安全：用官方基础镜像、及时更新补丁、扫描漏洞（Trivy/Clair）、多阶段构建减少攻击面。\n③网络隔离：自定义网络，只暴露必要端口，不把宿主机端口全映射。\n④资源限制：限制 CPU/内存，防 DoS。\n⑤只读文件系统：`--read-only` 挂载可写目录到数据卷。\n⑥密钥管理：敏感信息走环境变量/Secret/密钥管理平台，不写进镜像。\n⑦运行时监控：Docker 审计日志 + 运行时安全工具。\n我们项目最基本的两条就是：非 root 运行 + 敏感信息不进镜像。"},
{"s":5,"t":["theory"],"q":"Docker 和虚拟机有什么区别？","a":"对比表：\n| 维度 | Docker 容器 | 虚拟机 |\n| 虚拟化层级 | 操作系统级（共享内核） | 硬件级（虚拟硬件 + 独立内核） |\n| 体积 | MB 级 | GB 级 |\n| 启动速度 | 秒级 | 分钟级 |\n| 性能 | 接近原生 | 有损耗 |\n| 隔离性 | 进程级隔离（共享内核） | 完全隔离 |\n一句话：虚拟机模拟了一整台电脑，Docker 只是模拟了一个运行环境，更轻量、更快。\n取舍：容器隔离性弱于虚拟机，安全要求高的场景（多租户）用虚拟机，应用交付部署用容器更合适。","c":"一句话：虚拟机是模拟一台完整的电脑（虚拟硬件 + 独立内核），Docker 只是模拟一个运行环境（共享宿主机内核）。\n我项目里的切身体会：容器化迁移时，同样一套环境，虚拟机镜像 900MB、启动要 1-2 分钟；Docker 镜像经过多阶段构建瘦身到 320MB、启动秒级。资源占用也更低，同样的服务器能多跑几套环境。\n取舍我也会说：容器共享内核，隔离性弱于虚拟机；安全要求高的多租户场景用虚拟机，应用交付部署用容器更合适。"},
{"s":1,"t":["theory"],"q":"容器底层的 OverlayFS 是什么？写时复制（Copy-on-Write）怎么工作？","a":"超纲加分题（应届答不出正常，答出是亮点）。\nOverlayFS 是 Linux 的联合文件系统，是 Docker 镜像分层的底层实现：\n- 镜像层是只读的 lowerdir，容器层是可写的 upperdir，两层叠加成一个视图（merged）。\n- 写时复制：读文件优先从上层找，找不到再读下层；首次修改下层文件时，把文件复制到上层再改（copy_up），下层不变——所以多个容器共享底层镜像层，互不影响，且节省磁盘。\n- 删除是\"白化\"（whiteout）：在上层放一个标记文件盖住下层的同名文件，而不是真删。\n- 相关命令：docker inspect 可看挂载信息；/var/lib/docker/overlay2 就是层数据目录。"},
{"s":1,"t":["theory"],"q":"runc、containerd、Docker 之间是什么关系？","a":"超纲加分题（答不出正常，答出是亮点）。\n- runc：容器运行时（runtime），真正负责创建/运行容器的底层工具，实现了 OCI 规范，直接跟 Linux 内核打交道（namespace/cgroup）。\n- containerd：容器运行时管理器（runtime manager），负责镜像管理、容器生命周期、网络、存储等，内部调用 runc 跑容器。\n- Docker：最上层用户工具（docker CLI + dockerd），把镜像构建、编排、命令封装给用户；Docker 调 containerd，containerd 调 runc。\n- 演进背景：K8s 用 CRI 标准接口对接 containerd，不依赖 Docker，所以现在生产环境普遍\"Docker 管镜像、containerd 管运行\"，理解这条链路能体现对容器生态底层的认知。"}

QDATA["nginx"] = [
{"s":5,"t":["theory"],"q":"Nginx 反向代理和正向代理有什么区别？","a":"正向代理：代理的是客户端。客户端把请求发给代理，代理替客户端访问目标服务器，目标服务器看到的是代理的 IP。典型场景：翻墙、访问控制、缓存。\n反向代理：代理的是服务器。客户端请求发给反向代理，反向代理根据规则转发到后端的某台真实服务器，客户端不知道后端是谁。典型场景：负载均衡、隐藏后端、SSL 终结、统一入口。\n简单记：正向代理隐藏客户端，反向代理隐藏服务器。Nginx 主要是反向代理角色。"},
{"s":5,"t":["project","practice"],"q":"Nginx 负载均衡有哪些策略？你的项目怎么配置的？","a":"常用策略：\n- 轮询（默认）：请求依次分发到各后端\n- 权重：`server 192.168.1.10 weight=3;` 按比例分发，适合机器性能不均\n- ip_hash：按客户端 IP 哈希固定后端，解决会话保持\n- least_conn：转发给连接数最少的后端\n- url_hash / fair：按 URL 哈希或响应时间（第三方模块）\n我们项目部署了两个应用节点，配置了轮询+权重策略：新机器权重高一些，等稳定后再调平。同时在后端配置了 `proxy_set_header X-Real-IP` 透传真实 IP，方便日志分析。","c":"Nginx 负载均衡策略：轮询（默认）、权重（weight）、ip_hash（同一 IP 固定到同一台）、fair（按响应时间）、url_hash（按 URL 哈希）。\n我们项目配置：两个后端服务实例，轮询 + 权重：\nupstream backend {\n    server 172.20.0.2:8080 weight=1 max_fails=2 fail_timeout=30s;\n    server 172.20.0.3:8080 weight=1 max_fails=2 fail_timeout=30s;\n}\nserver {\n    listen 80;\n    location / {\n        proxy_pass http://backend;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    }\n}\n说明：\n①weight=1 权重相同就是轮询；以后某实例配置高可以调 weight；\n②max_fails=2 fail_timeout=30s 是健康检查：30 秒内失败 2 次就摘掉，实现故障自动剔除；\n③动态扩容：新起一个后端实例，往 upstream 加一行，reload Nginx 生效（不用重启）。\n追问应对：问“Nginx reload 和 restart 区别”，答：reload 平滑重载配置、不中断连接（worker 进程热更新），restart 会中断，所以加实例/改配置都用 reload。"},
{"s":5,"t":["project","practice"],"q":"什么是动静分离？你的 Nginx 怎么配置的？","a":"动静分离：把动态请求（后端接口）和静态资源（图片/CSS/JS）分开处理，静态资源由 Nginx 直接响应（不走后端应用），减轻应用服务器压力、加快加载速度。\n核心配置：\n`location ~* \\.(jpg|png|css|js|gif|ico)$ {`\n`    root /data/static;`\n`    expires 30d;`\n`}`\n`location /api/ { proxy_pass http://backend; }`\n我们项目把前端构建产物和图片放 Nginx 静态目录，接口走反向代理，静态资源并发压力完全由 Nginx 扛住。","c":"动静分离：静态资源（html/css/js/图片）由 Nginx 直接返回，动态请求（接口）转发给后端，各司其职。\n我们配置（关键片段）：\n# 静态资源：直接找文件，找不到再走前端路由\nlocation /static/ {\n    alias /opt/frontend/static/;\n    expires 7d;             # 静态资源缓存 7 天\n    gzip on;                # 压缩\n    gzip_types text/css application/javascript image/svg+xml;\n}\n# 动态接口：反代到后端集群\nlocation /api/ {\n    proxy_pass http://backend;\n}\n# 前端单页应用：非静态非接口的请求都回 index.html\nlocation / {\n    root /opt/frontend;\n    try_files $uri $uri/ /index.html;\n}\n好处：\n①静态资源不经过 Java 应用，减轻后端压力，QPS 高很多；\n②浏览器缓存 + gzip 后页面加载明显变快；\n③后端只处理业务接口，日志也干净。\n踩坑：expires 设太大，前端改版后用户拿到旧缓存，后来发版时对 index.html 不缓存（no-cache），带 hash 的静态文件才长缓存。"},
{"s":4,"t":["theory","practice"],"q":"Nginx 静态资源缓存：expires 和 proxy_cache 有什么区别？","a":"expires：设置浏览器端缓存。响应头返回 `Cache-Control: max-age=...`，浏览器本地缓存资源，下次访问不再请求服务器。适合不常变的静态资源（图片、CSS、JS），设 `expires 30d`。\nproxy_cache：Nginx 服务端缓存。Nginx 缓存后端返回的内容，后续相同请求由 Nginx 直接返回，后端无感知。需要配置 `proxy_cache_path`、缓存 key、缓存有效时间，适合高频且可缓存的动态接口或大文件。\n两者可以配合：expires 管浏览器端，proxy_cache 管服务端，双层减少后端压力。"},
{"s":4,"t":["practice"],"q":"编写一个 Nginx 反向代理 + 负载均衡的核心配置？","a":"`upstream backend {`\n`    server 192.168.1.10:8080 weight=2;`\n`    server 192.168.1.11:8080 weight=1;`\n`}`\n`server {`\n`    listen 80;`\n`    server_name www.example.com;`\n`    location / {`\n`        proxy_pass http://backend;`\n`        proxy_set_header Host $host;`\n`        proxy_set_header X-Real-IP $remote_addr;`\n`        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;`\n`        proxy_connect_timeout 5s;`\n`        proxy_read_timeout 60s;`\n`    }`\n`}`\n关键点：upstream 定义后端池，proxy_pass 转发，透传真实 IP 和 Host，设置合理的超时时间防止上游慢拖垮连接。"},
{"s":4,"t":["theory"],"q":"Nginx 的进程模型：master 和 worker 是什么？","a":"Nginx 采用 master-worker 多进程模型：\n- master 进程：负责读取/校验配置、管理 worker 进程生命周期、接收信号（reload/quit），不处理业务请求\n- worker 进程：真正处理客户端请求，每个 worker 是单线程事件驱动（epoll），可异步处理海量并发连接\n`worker_processes auto;` 一般设为 CPU 核心数。\n优势：worker 之间无锁竞争、互相隔离（一个崩溃不影响其他），事件驱动支撑高并发。这也是 Nginx 能扛住十万级并发的原因。"},
{"s":4,"t":["troubleshoot"],"q":"Nginx 返回 502/504 是什么原因？怎么排查？","a":"502 Bad Gateway：Nginx 连不上后端（后端没启动、端口错、后端崩溃、防火墙拦截）。\n排查：`systemctl status 后端服务` 看是否在运行 → `curl 后端地址` 直接测 → `ss -tlnp` 看端口 → 看后端应用日志 → `nginx -t` 和 Nginx error.log。\n504 Gateway Timeout：Nginx 等待后端响应超时（默认 proxy_read_timeout 60s），通常是后端接口慢或卡死。\n排查：看后端接口耗时（慢查询/死锁/线程池耗尽）、适当调大 proxy_read_timeout、优化后端性能。\n另外 worker_connections 打满也会导致连接失败报 502，要检查连接数。"},
{"s":3,"t":["troubleshoot"],"q":"Nginx 配置了不生效，怎么排查？","a":"①先校验语法：`nginx -t`，报错会指出配置文件和行号。\n②重新加载：改完配置必须 `nginx -s reload`（平滑重载）才生效，很多人只改了文件没 reload。\n③检查生效的配置文件：`nginx -T` 打印完整生效配置，看 include 的配置是否正确加载。\n④确认改对位置：http / server / location 三个层级，location 优先级规则要理解。\n⑤浏览器缓存：改静态资源相关配置时，浏览器有缓存，用无痕窗口或加版本号验证。\n⑥看 error.log：`tail -f /var/log/nginx/error.log`。"},
{"s":3,"t":["practice"],"q":"upstream 配置多个后端节点，权重怎么设置？","a":"`upstream backend {`\n`    server 192.168.1.10:8080 weight=3;`\n`    server 192.168.1.11:8080 weight=1;`\n`    server 192.168.1.12:8080 backup;`\n`}`\nweight 表示权重比例：上面 3:1，大约 75% 流量到 10，25% 到 11，适合机器性能不同的场景。\n`backup` 表示备用节点：平时不参与，其他节点全部不可用时才启用。\n还可以配 `max_fails=3 fail_timeout=30s`：30 秒内失败 3 次则标记为不可用，让 Nginx 把请求转发到健康节点，实现基础的健康检测。"},
{"s":2,"t":["theory"],"q":"Nginx 连接超时配置（proxy_connect_timeout 等）怎么理解？","a":"三个常用超时：\n- `proxy_connect_timeout`：Nginx 和后端建立 TCP 连接的超时，默认 60s，一般调小（5s）快速失败\n- `proxy_read_timeout`：两次读操作之间的间隔超时（不是总时间），默认 60s，后端处理慢时调大\n- `proxy_send_timeout`：两次写操作之间的间隔超时，默认 60s\n另外 `client_header_timeout`、`client_body_timeout` 控制客户端侧的读写超时；`keepalive_timeout` 控制连接复用。\n生产常见调优：connect_timeout 调小防雪崩，read_timeout 按业务接口耗时调大，防止误杀慢接口。"},
{"s":3,"t":["theory"],"q":"Nginx location 匹配规则（=、~、^~）怎么理解？","a":"匹配优先级从高到低：\n- `=` 精确匹配：`location = /login {}`，完全一致才命中\n- `^~` 前缀匹配：`location ^~ /static/ {}`，命中后不再做正则匹配\n- `~` / `~*` 正则匹配：`location ~ \\.(php|jsp)$ {}`，~ 区分大小写，~* 不区分\n- `/` 通用前缀匹配：最宽松，兜底\n规则：先匹配普通前缀（取最长），若命中了 `^~` 则直接使用；否则再看正则（按顺序，第一个命中的生效）；都没有则用最长前缀。\n简单记：= 最严格，^~ 次之，正则再次，/ 兜底。"},
{"s":3,"t":["practice"],"q":"Nginx 怎么做限流（限制请求速率）？","a":"基于漏桶/令牌桶算法，用 `limit_req` 模块：\n`http {`\n`    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=10r/s;`\n`}`\n`location /api/ {`\n`    limit_req zone=req_zone burst=20 nodelay;`\n`    proxy_pass http://backend;`\n`}`\n含义：每个 IP 每秒最多 10 个请求，burst=20 允许突发 20 个（排队/直接处理），nodelay 表示突发立即处理不排队。\n按并发数限制用 `limit_conn_zone`。\n用途：防刷接口、保护后端不被瞬间高流量打垮。"},
{"s":2,"t":["practice"],"q":"Nginx 的日志格式和日志分析怎么做？","a":"日志格式在 http 块配置：\n`log_format main '$remote_addr - $remote_user [$time_local] \"$request\" $status $body_bytes_sent \"$http_referer\" \"$http_user_agent\"';`\n`access_log /var/log/nginx/access.log main;`\n分析常用命令：\n- 实时监控：`tail -f access.log`\n- 统计 IP 访问量：`awk '{print $1}' access.log | sort | uniq -c | sort -rn | head`\n- 统计状态码：`awk '{print $9}' access.log | sort | uniq -c | sort -rn`\n- 统计热门 URL：`awk '{print $7}' access.log | sort | uniq -c | sort -rn | head -20`\n- 分析慢请求、5xx 错误比例，配合定时脚本输出日报。"},
{"s":3,"t":["practice"],"q":"Nginx 怎么配置 HTTPS？证书怎么来？","a":"证书来源：①商业证书（DigiCert、GlobalSign 等，从 CA 购买）；②免费证书：Let's Encrypt（`certbot` 自动签发续期）、阿里云/腾讯云免费证书。\n配置：\n`server {`\n`    listen 443 ssl;`\n`    server_name www.example.com;`\n`    ssl_certificate /etc/nginx/ssl/example.crt;`\n`    ssl_certificate_key /etc/nginx/ssl/example.key;`\n`    ssl_protocols TLSv1.2 TLSv1.3;`\n`    ssl_ciphers HIGH:!aNULL:!MD5;`\n`}`\n`server { listen 80; server_name www.example.com; return 301 https://$host$request_uri; }`（HTTP 跳转 HTTPS）\n注意：证书私钥文件权限要 600，证书到期前要续期（Let's Encrypt 90 天自动续）。"}

{"s":5,"t":["project","practice"],"q":"MySQL 主从复制的原理是什么？（三个线程）","a":"三个核心线程：\n- 主库 dump 线程：主库开启 binlog 后，dump 线程把 binlog 变更推送给从库的 IO 线程\n- 从库 IO 线程：接收主库 binlog 并写入从库的 relay log（中继日志）\n- 从库 SQL 线程：读取 relay log 并重放，把变更应用到从库数据\n完整流程：主库写操作记录 binlog → dump 线程推送 → IO 线程写入 relay log → SQL 线程重放。\n主库配置：开启 `log-bin`、设置唯一的 `server-id`、创建复制账户（`GRANT REPLICATION SLAVE`）。\n从库配置：`CHANGE MASTER TO MASTER_HOST=..., MASTER_LOG_FILE=..., MASTER_LOG_POS=...` → `START SLAVE` → `SHOW SLAVE STATUS` 看 `Slave_IO_Running` 和 `Slave_SQL_Running` 是否都为 Yes。","c":"MySQL 主从复制三个线程（基于我们一主两从 GTID 环境）：\n①主库的 Binlog Dump 线程：主库 binlog 有变更时，把 binlog 事件推送给从库；\n②从库的 IO 线程：连接主库拉取 binlog 事件，写到从库本地的 relay log（中继日志）；\n③从库的 SQL 线程：读取 relay log 并重放执行，让从库数据和主库一致。\n整个链路：主库写 binlog → dump 线程推送 → 从库 IO 线程拉取写 relay log → SQL 线程重放。\n我们用的 GTID 模式 + 半同步复制：\n- GTID 让每个事务有全局唯一 ID，从库通过 MASTER_AUTO_POSITION=1 自动定位，不需要手动记 binlog 文件名和位置；\n- 半同步（Semisync）：主库提交前等至少一个从库确认收到 binlog，减少数据丢失窗口；配置了超时自动降级异步，防止从库故障拖垮主库写入。\n验证命令：SHOW SLAVE STATUS\\G，看 Slave_IO_Running 和 Slave_SQL_Running 都是 Yes 才正常。"},
{"s":5,"t":["theory","project"],"q":"什么是 GTID？为什么用它做主从？","a":"GTID（Global Transaction Identifier）是每个事务的全局唯一标识，由服务器 UUID + 事务序号组成（如 `3f8a1c2d-1234-11ec-8d3d-0242ac120002:1`）。\n和传统 binlog 位点方式对比：传统方式需要手动指定 `MASTER_LOG_FILE` 和 `MASTER_LOG_POS`，位置错一点就同步错乱；GTID 方式只需 `CHANGE MASTER TO MASTER_AUTO_POSITION=1`，自动定位事务，无需手工找位点。\n优点：\n- 配置简单，无需记录文件/位置\n- 复制更可靠，自动跳过已执行事务\n- 便于故障切换和新从库添加（Clone 或备份后自动对齐）\n我们搭建一主两从用的就是 GTID 模式，配置 `gtid_mode=ON` 和 `enforce_gtid_consistency=ON`。","c":"GTID（Global Transaction Identifier）= server_uuid:transaction_id，每个事务在全局范围内有唯一 ID。\n我们为什么用它做主从：\n①定位简单：不用记 binlog 文件名+Position，SHOW SLAVE STATUS 看 Executed_Gtid_Set 就能判断两边差多少；\n②切换方便：从库提升为主库时，其他从库用 MASTER_AUTO_POSITION=1 自动追平，不用手动找位点，故障切换快很多；\n③一致性判断：通过对比 GTID 集合能确认主从数据是否一致；\n④运维友好：新增从库、重建从库都简单——备份恢复到从库，起复制后自动从 GTID 位置续传。\n配置（我搭集群时开的）：\ngtid_mode=ON\nenforce_gtid_consistency=ON\n主从 CHANGE MASTER TO ... MASTER_AUTO_POSITION=1;\n注意：开启 GTID 后，不支持 GTID 的语句（比如 CREATE TABLE ... SELECT）会被禁止，开发要按规范写 SQL——这点我们踩过，开发同学写过这种语句报错，后面规范里加了说明。"},
{"s":5,"t":["project","practice"],"q":"你搭建一主两从集群的完整步骤？","a":"①环境准备：三个容器/主机装好 MySQL，设置唯一 `server-id`（1/2/3）、主库开启 `log-bin`、所有节点开启 `gtid_mode=ON enforce_gtid_consistency=ON`。\n②主库创建复制账户：`CREATE USER 'repl'@'%' IDENTIFIED BY 'xxx'; GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';`\n③从库建立主从关系：\n`CHANGE MASTER TO MASTER_HOST='主库IP', MASTER_USER='repl', MASTER_PASSWORD='xxx', MASTER_AUTO_POSITION=1;`\n`START SLAVE;`\n④验证：`SHOW SLAVE STATUS\\G` 看两个线程都为 Yes，`SHOW MASTER STATUS` 看主库位点。\n⑤写入测试数据验证同步，模拟主库故障验证从库可提升。\n我还写了个 Shell 脚本，通过 `docker exec` 自动在主库建账户、在从库执行 CHANGE MASTER，一键建立主从关系。","c":"一主两从搭建步骤（GTID + 半同步，我完整搭过）：\n①准备：3 台机器装 MySQL 5.7（我们用的 Docker 容器，数据挂 volume）；\n②主库配置（my.cnf）：\nserver-id=1\nlog-bin=mysql-bin\ngtid_mode=ON\nenforce_gtid_consistency=ON\n半同步：INSTALL PLUGIN rpl_semi_sync_master SONAME 'semisync_master.so';\nSET GLOBAL rpl_semi_sync_master_enabled=1;\n③建复制账号：GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%' IDENTIFIED BY 'xxx';\n④从库配置：server-id=2/3、log-bin、gtid_mode、enforce_gtid_consistency、装 semisync_slave 插件；\n⑤从库执行：\nCHANGE MASTER TO MASTER_HOST='主库IP', MASTER_PORT=3306, MASTER_USER='repl', MASTER_PASSWORD='xxx', MASTER_AUTO_POSITION=1;\nSTART SLAVE;\n⑥验证：SHOW SLAVE STATUS\\G，Slave_IO_Running: Yes、Slave_SQL_Running: Yes；\n⑦初始化数据一致性：先 mysqldump 主库（--single-transaction --master-data=2），从库导入后再起复制。\n踩坑：①server-id 没区分（默认 1 会冲突）；②防火墙 3306 没放行；③没先同步数据就起复制导致位点错乱；④半同步主库等不到从库确认会阻塞——设了 rpl_semi_sync_master_timeout=1000 超时降级异步。"},
{"s":5,"t":["troubleshoot"],"q":"主从延迟怎么排查和解决？","a":"看延迟：`SHOW SLAVE STATUS` 里的 `Seconds_Behind_Master`。\n延迟原因与解决：\n①从库单线程 SQL 重放追不上主库并发写入 → 开启多线程复制（`slave_parallel_workers`，5.7+ 支持 MTS 并行复制）\n②大事务（大批量 UPDATE/DELETE）→ 拆小事务，分批提交\n③从库上有查询/备份占用资源 → 错峰执行，优化从库硬件\n④主从机器性能差异 → 从库磁盘用 SSD、参数调优\n⑤网络延迟 → 同机房部署\n⑥长事务导致 relay log 堆积 → 监控 binlog 量，及时清理\n关键原则：先看是不是 SQL 重放慢（`SHOW PROCESSLIST` 看 SQL 线程在执行的 SQL），还是 IO 拉取慢（网络/主库压力）。"},
{"s":4,"t":["theory"],"q":"什么是 binlog？有哪几种格式？","a":"binlog（二进制日志）记录所有数据变更操作（增删改），用于主从复制、数据恢复、审计。\n三种格式：\n- STATEMENT：记录 SQL 语句。日志小，但某些函数（NOW()、UUID()）在主从执行结果可能不一致\n- ROW：记录实际变更的行数据。最安全、复制一致，但日志量大\n- MIXED：默认，根据语句自动选择。多数用 STATEMENT，不确定的函数用 ROW\n生产建议：5.7 以下常用 MIXED 或 ROW；MySQL 8.0 默认 ROW。\n注意 binlog 不等于慢查询日志（slow log）和错误日志（error log），三个日志职责不同。"},
{"s":4,"t":["practice","troubleshoot"],"q":"慢查询日志怎么开启和分析？","a":"开启配置（my.cnf）：\n`slow_query_log = ON`\n`slow_query_log_file = /var/log/mysql/slow.log`\n`long_query_time = 2`（超过2秒记录）\n`log_queries_not_using_indexes = ON`（记录没用索引的查询）\n分析工具：\n- `mysqldumpslow -s at /var/log/mysql/slow.log`：按平均耗时排序汇总\n- pt-query-digest：更强大的分析工具，输出 TOP N 慢 SQL、频率、耗时分布\n拿到慢 SQL 后用 `EXPLAIN` 分析执行计划，看是否走索引、扫描行数，针对性优化 SQL 或加索引。"},
{"s":4,"t":["theory"],"q":"MySQL 的索引为什么用 B+ 树？","a":"B+ 树特点：\n- 非叶子节点只存索引键，不存数据，单节点能容纳更多键 → 树更矮，IO 次数少（3-4 层可支撑千万级数据）\n- 叶子节点存数据且用链表串联 → 范围查询高效（顺序扫描叶子即可）\n- 查询性能稳定（都到叶子层）\n对比其他结构：\n- 哈希索引：单条等值查询 O(1)，但不支持范围查询和排序\n- 二叉树/AVL：树高随数据量增长，IO 次数多\n- B 树：叶子和非叶子都存数据，单节点容纳键少，树更高\n所以 B+ 树是磁盘 IO 场景下等值+范围查询的综合最优解。"},
{"s":4,"t":["theory"],"q":"联合索引的最左前缀原则？","a":"联合索引 (a, b, c) 相当于建了 a、(a,b)、(a,b,c) 三个索引。查询必须从最左列开始连续匹配才能走索引：\n- `WHERE a=1` ✓\n- `WHERE a=1 AND b=2` ✓\n- `WHERE a=1 AND b=2 AND c=3` ✓\n- `WHERE b=2` ✗（跳过 a，无法使用该索引）\n- `WHERE a=1 AND c=3` 部分走索引（只用 a，c 无法用）\n设计原则：区分度高的列放前面；把范围查询的列放最后（范围列后面的列用不上索引）。\n面试可以补一句：8.0 支持索引跳跃扫描（Skip Scan），部分跳过最左列的场景也能用到索引，但有限制。"},
{"s":4,"t":["theory"],"q":"事务的 ACID 特性是什么？","a":"A 原子性（Atomicity）：事务内操作要么全部成功要么全部回滚，通过 undo log 实现回滚。\nC 一致性（Consistency）：事务执行前后数据完整性约束不被破坏，是 AID 共同保证的结果。\nI 隔离性（Isolation）：并发事务之间互不干扰，通过锁和 MVCC 实现。\nD 持久性（Durability）：事务提交后数据永久保存，通过 redo log 实现崩溃恢复。\n面试可深入：redo log（物理日志，保证持久性）+ undo log（逻辑日志，保证原子性）+ MVCC/锁（隔离性）。"},
{"s":4,"t":["theory"],"q":"什么是 MVCC？","a":"MVCC（多版本并发控制）是 InnoDB 实现读-写并发不互斥的核心机制。\n原理：每行数据维护多个版本（通过 undo log 串联），事务读取时根据可见性规则选择合适版本，实现：\n- 快照读（普通 SELECT）不加锁，读到事务开始前的一致性快照\n- 当前读（UPDATE/DELETE/加锁读）读取最新版本并加锁\n核心数据结构：隐藏列 `trx_id`（最后修改事务ID）、`roll_pointer`（指向 undo 版本链）+ 每事务的 read view（活跃事务数组）。\n作用：支撑 RR/RC 隔离级别下的非阻塞读，同时保证可重复读。"},
{"s":4,"t":["theory"],"q":"MySQL 的隔离级别有哪些？","a":"四个隔离级别（从低到高）：\n- READ UNCOMMITTED（读未提交）：能读到未提交数据，有脏读，基本不用\n- READ COMMITTED（读已提交）：只能读到已提交数据，解决脏读，但有不可重复读（同事务两次读结果不同），Oracle 默认\n- REPEATABLE READ（可重复读）：同一事务多次读结果一致，解决不可重复读，但有幻读。InnoDB 默认，且通过间隙锁（Next-Key Lock）基本解决了幻读\n- SERIALIZABLE（串行化）：事务完全串行，无并发问题，性能最差\nInnoDB 的 RR 级别通过 Next-Key Lock 避免幻读，所以生产常用 RR；如果业务要求低锁竞争也可用 RC。"},
{"s":3,"t":["theory"],"q":"什么情况下索引会失效？","a":"常见失效场景：\n①对索引列使用函数或表达式：`WHERE YEAR(create_time)=2026`\n②隐式类型转换：`WHERE phone=138...`（phone 是 varchar，传数字）\n③左模糊：`LIKE '%abc'`（前导通配符），`LIKE 'abc%'` 可以走\n④联合索引不满足最左前缀\n⑤OR 连接非索引列：`WHERE a=1 OR b=2`（b 无索引则 a 的索引也可能不用）\n⑥对索引列做运算：`WHERE id+1=5`\n⑦优化器判断全表扫描更快（数据量小、区分度低时）\n排查方法：`EXPLAIN` 看 key 列和 rows 列。"},
{"s":3,"t":["practice"],"q":"MySQL 备份怎么做？mysqldump 和物理备份？","a":"逻辑备份：`mysqldump -u root -p --single-transaction --master-data=2 --all-databases > backup.sql`\n- `--single-transaction`：InnoDB 下用一致快照备份，不锁表\n- `--master-data=2`：记录 binlog 位点，方便备份后建从库\n恢复：`mysql -u root -p < backup.sql`\n物理备份：直接复制数据文件，工具如 Percona XtraBackup（xtrabackup），支持热备（不锁库）、增量备份，恢复快，适合大库。\n备份策略：每天全量 + binlog 增量，保留 N 天；每周做一次恢复演练（备份能不能恢复才是关键）。\n定时：crontab 凌晨执行，配合日志和告警。"},
{"s":2,"t":["troubleshoot"],"q":"主从复制中断了怎么恢复？","a":"①`SHOW SLAVE STATUS\\G` 看 `Slave_IO_Running` 和 `Slave_SQL_Running` 状态，以及 `Last_Error` 定位原因。\n②IO 线程断：网络问题或主库重启，直接 `START SLAVE` 重连；持续断查网络和主库 dump 线程。\n③SQL 线程断（常见）：从库执行 SQL 出错，如主键冲突、表结构不一致、误改从库数据。\n处理：\n- 小问题：`STOP SLAVE; SET GLOBAL SQL_SLAVE_SKIP_COUNTER=1; START SLAVE;` 跳过错误（谨慎，确认可跳过）\n- 数据不一致：用 pt-table-checksum 校验 + pt-table-sync 修复，或重新拉齐（从主库备份恢复到从库再重配主从）\n- GTID 模式下错误事务可用空事务补位\n原则：先看报错再动手，跳过错误要有依据，否则数据一致性会出问题。"},
{"s":3,"t":["theory"],"q":"InnoDB 和 MyISAM 的区别？","a":"InnoDB（MySQL 默认）：\n- 支持事务（ACID）、外键\n- 行级锁，支持高并发\n- 支持崩溃恢复（redo log）\n- 聚簇索引：数据和索引存在一起，主键查询快\nMyISAM：\n- 不支持事务和外键\n- 表级锁，并发差\n- 不支持崩溃恢复\n- 非聚簇索引，数据文件单独存\n现在基本都用 InnoDB，MyISAM 只出现在历史库或特殊只读场景。面试重点说清楚：事务 + 行锁 + 崩溃恢复是 InnoDB 的三大优势。"},
{"s":3,"t":["theory"],"q":"什么是半同步复制？和异步、同步有什么区别？","a":"异步复制（默认）：主库提交事务后立即返回客户端，不等待从库确认。性能最好，但主库宕机可能丢数据。\n半同步复制：主库提交后必须等至少一个从库收到 binlog 并写入 relay log（ACK）才返回。保证不丢数据（至少一台从库有），但增加一次往返延迟。MySQL 5.7+ 通过插件实现，配置：`INSTALL PLUGIN rpl_semi_sync_master`、`rpl_semi_sync_master_enabled=1`。\n同步复制：所有从库确认才提交，数据最安全但性能最差，一般只在强一致场景（如组复制单主模式）用。\n实践：半同步是性能和安全的平衡点，主从同机房时延迟可接受，生产常用。"},
{"s":3,"t":["theory"],"q":"读写分离和分库分表了解吗？","a":"读写分离：主库写、从库读，缓解单库压力。通过应用层路由或中间件（MyCat、ShardingSphere、ProxySQL）实现。注意主从延迟导致的读写不一致问题，读敏感数据可强制走主库或等延迟。\n分库分表：数据量大到单库单表瓶颈时，按维度拆分：\n- 垂直拆分：按业务模块分库（用户库/订单库）、按列分表\n- 水平拆分：按分片键（如 user_id % 16）把数据分布到多库多表\n- 中间件：ShardingSphere、MyCat；或应用层路由\n常见问题：跨库 join 变应用层处理、分布式事务、全局唯一 ID（雪花算法）、扩容迁移复杂。\n面试口径：能说清分片键选择、路由规则、典型问题和解决思路即可。"},
{"s":4,"t":["practice","troubleshoot"],"q":"如何分析一条慢 SQL？Explain 的关键列？","a":"先用 EXPLAIN 看执行计划，关键列：\n- type：访问类型，从好到差 system > const > eq_ref > ref > range > index > ALL。ALL（全表扫描）要重点优化\n- key：实际使用的索引；key_len：索引长度\n- rows：预估扫描行数，越大越慢\n- Extra：Using filesort（排序没走索引）、Using temporary（临时表）、Using index（覆盖索引）\n优化步骤：①看是否走索引（没走找原因：函数、隐式转换、最左前缀）；②加合适索引（联合索引注意列顺序）；③改写 SQL（避免 SELECT *、拆大查询、分页优化）；④必要时改表结构（冗余字段、拆分大表）。\n配合慢查询日志定位高频慢 SQL，优先优化调用频率高的。"},
{"s":4,"t":["theory"],"q":"MySQL 的 binlog 和 redo log 有什么区别？","a":"两者都是日志，但有本质区别：\n| 维度 | binlog（归档日志） | redo log（重做日志） |\n| 所属层级 | Server 层，所有引擎都有 | InnoDB 引擎特有 |\n| 日志类型 | 逻辑日志（记录 SQL / 行变更） | 物理日志（记录数据页修改） |\n| 作用 | 主从复制、数据恢复 | 崩溃恢复（保证持久性，ACID 的 D） |\n| 写入时机 | 事务提交时写入 | WAL 机制：先写 redo 再改数据页 |\n| 文件形式 | 多个文件按大小滚动 | 固定大小循环写（ib_logfile0/1） |\n一句话记忆：binlog 用来复制和归档，redo log 用来崩溃恢复，两者配合实现 MySQL 的数据安全和主从复制。","c":"搭一主两从时对这两个日志理解特别深：\n①binlog：主库要开 log-bin（我们用的 row 格式），从库就是靠拉主库 binlog 做复制的；它是 Server 层的逻辑日志，所有引擎都有；\n②redo log：InnoDB 引擎的物理日志，WAL 机制先写 redo 再改数据页，保证机器突然断电数据不丢（崩溃恢复靠它）；\n③面试常追问'为什么主从复制用 binlog 不用 redo log'：redo log 是循环写的物理日志、只有 InnoDB 有；binlog 是完整的逻辑日志、记录所有引擎的事务，可追溯可恢复，适合做复制和归档。\n一句话：binlog 管复制和恢复，redo log 管崩溃恢复，两者配合。"},
{"s":1,"t":["theory"],"q":"InnoDB 的自适应哈希索引（AHI）是什么？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- AHI（Adaptive Hash Index）：InnoDB 对频繁访问的索引页，在内存中自动维护一个哈希索引，让\"索引值→数据页\"的等值查询从 B+ 树多次 IO 变成 O(1) 哈希查找。\n- 自动：不需要 DBA 建，InnoDB 监控访问模式，命中条件（同一索引页被等值访问次数达到阈值）自动创建；访问模式变化会自动删除。\n- 注意：AHI 只加速等值查询（=、IN），范围查询不走；它占 InnoDB buffer pool 的一部分；默认开启（innodb_adaptive_hash_index=ON）。\n- 面试加分点：能说出\"自适应、自动建立/销毁、只对热点等值查询生效、占用 buffer pool\"就算答到位。"},
{"s":1,"t":["theory"],"q":"redo log 的组提交（Group Commit）是怎么工作的？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- 问题：每个事务提交都要刷一次 redo log 到磁盘（fsync），高并发下磁盘 IO 是瓶颈。\n- 组提交：多个事务在提交时合并成一批，只做一次 fsync，一次磁盘刷盘完成多个事务的持久化——大幅提升写入吞吐。\n- 实现：提交时事务先进入队列，由 leader 事务统一刷盘，其余事务（follower）等 leader 刷完即视为已提交。\n- 面试关联：这是\"MySQL 高并发写入性能\"的重要机制，和 binlog 的组提交、两阶段提交（redo prepare → binlog → redo commit）配合，是主从一致性的基础。"}
];

{"s":5,"t":["theory"],"q":"Redis 为什么这么快？","a":"①纯内存操作：数据都在内存，没有磁盘 IO。\n②单线程模型：避免多线程上下文切换和锁竞争（6.0 引入多线程只用于网络 IO 读写，命令执行仍单线程）。\n③IO 多路复用：基于 epoll 事件驱动，单线程可处理大量并发连接。\n④高效数据结构：简单动态字符串（SDS）、跳表、压缩列表等针对场景优化。\n⑤合理的数据结构设计：比如哈希的渐进式 rehash。\n补充：单线程也意味着要避免慢命令（KEYS、大 key 操作），会阻塞整个实例。"},
{"s":5,"t":["theory"],"q":"Redis 的持久化：RDB 和 AOF 的区别？","a":"RDB：把内存数据快照写入磁盘二进制文件（dump.rdb）。\n- 触发：SAVE（同步阻塞）、BGSAVE（fork 子进程异步）、自动 save 规则\n- 优点：文件小、恢复快、适合备份\n- 缺点：两次快照之间的数据可能丢失；fork 大实例时短暂阻塞\nAOF：记录每个写命令到 appendonly.aof，类似 binlog。\n- 刷盘策略：always（每条命令都 fsync，最安全最慢）、everysec（每秒，默认，最多丢1秒）、no（交给 OS）\n- 优点：数据丢失少\n- 缺点：文件大、恢复慢；可用 AOF rewrite 压缩\n生产实践：两种都开（RDB 做备份，AOF 保数据），或用 4.0+ 的混合持久化。Redis 7 的 AOF 基于多部分文件，重写更高效。"},
{"s":5,"t":["theory","project"],"q":"Redis 主从复制的原理？","a":"同步流程（首次全量 + 增量）：\n①从库发送 `psync ? -1` → 主库生成 RDB 快照全量同步（同时用缓冲区记录新命令）\n②从库加载 RDB，然后接收主库补发的增量命令\n③之后进入增量同步：主库把每个写命令通过传播给从库，类似 MySQL binlog 重放\n从 2.8 起支持 `psync` 断线续传（repl-backlog 缓冲区），断线重连不用重新全量。\n配置：从库 `replicaof 主库IP 6379`。\n我们搭建时验证了：主库写数据，从库同步；主库重启后从库自动重新同步。","c":"Redis 主从复制原理（我们哨兵模式下 1 主 2 从）：\n①全量同步（首次/重连后差距大）：从库发 PSYNC，主库 BGSAVE 生成 RDB 快照发给从库，同时把期间的写命令放进复制缓冲区，RDB 传完后把缓冲命令再发给从库，保证不丢；\n②增量同步（网络抖动恢复）：从库带着上次的复制偏移量发 PSYNC，主库从 repl_backlog（复制积压缓冲区）里补发缺失部分；\n③复制链路：从库 replicaof 主库，只读，主库把写命令实时推给从库（命令传播阶段）。\n哨兵模式下细节：主从关系由哨兵维护——主库挂了，哨兵提升一个从库为新主，其他从库自动重新指向新主（replicaof 新主）。\n用途：读扩展（读写分离）、数据备份（从库做 RDB 备份不打扰主库）、高可用（配合哨兵）。\n注意：主从复制默认异步，极端情况主库挂之前没推完的命令会丢；所以我们对关键数据用 AOF + 从库延迟监控兜底。"},
{"s":5,"t":["theory","project"],"q":"Redis 哨兵（Sentinel）模式的原理？","a":"Sentinel 是 Redis 的高可用方案，核心能力：\n- 监控：哨兵进程持续监控主从节点状态（每10秒 ping 主从，每1秒 ping 其他哨兵）\n- 自动故障转移：主库主观下线（单个哨兵认为不可达）→ 客观下线（多数哨兵同意）→ 选主（从库中选优先级高/数据新的）→ 把其他从库重新指向新主 → 通知客户端\n- 通知：通过 pub/sub 向客户端广播新主地址\n部署要点：\n- 至少 3 个哨兵实例（奇数，避免脑裂），独立部署\n- `sentinel monitor mymaster 主库IP 6379 2`：quorum=2 表示 2 个哨兵同意才判主库客观下线\n我们验证过：手动 kill 主库，哨兵在秒级完成切换，应用通过哨兵地址自动重连到新主。","c":"Redis 哨兵（Sentinel）原理（我们 3 个哨兵监控 1 主 2 从）：\n哨兵三大职责：监控、通知、自动故障转移。\n故障转移流程：\n①主观下线：单个哨兵通过心跳（每隔 1 秒 PING）发现主库没响应（down-after-milliseconds 超时），标记为主观下线；\n②客观下线：主观下线的哨兵向其他哨兵确认（SENTINEL is-master-down-by-addr），达到 quorum 数量（我们设 2，3 个哨兵多数派）才判定主库客观下线；\n③选举 leader 哨兵：哨兵们自己选出一个 leader 负责执行故障转移；\n④故障转移：leader 从从库中选一个提升为新主（优先选复制偏移量最新、优先级高的），通知其他从库重新指向新主，通知客户端新的主库地址（通过发布订阅）。\n我们实测：主库挂掉后自动切换大概 10-20 秒（取决于 down-after-milliseconds 和确认时间）。\n客户端接入：连接哨兵地址，用 get-master-addr-by-name 动态拿主库，主库切换后客户端自动重连新主。"},
{"s":4,"t":["theory"],"q":"什么是缓存击穿、缓存穿透、缓存雪崩？","a":"缓存穿透：查询一个不存在的 key，缓存和数据库都没有，请求直接打到数据库。攻击者可利用不存在的 ID 打垮数据库。\n解决：缓存空值（设置短 TTL）、布隆过滤器拦截。\n缓存击穿：某个热点 key 过期瞬间，大量请求同时打到数据库。\n解决：互斥锁（只让一个请求去重建缓存）、逻辑过期（后台异步续期）、热点 key 不过期。\n缓存雪崩：大量 key 同时过期，或缓存服务整体宕机，海量请求打到数据库。\n解决：TTL 加随机值（避免同时过期）、多级缓存、限流降级、高可用（哨兵/集群）。\n这三个概念面试必问，要能分别说出场景和至少两种解决方案。"},
{"s":4,"t":["theory"],"q":"Redis 的数据结构有哪些？分别什么场景？","a":"①String：缓存对象（JSON）、计数器（点赞数）、分布式锁（SETNX）、验证码。\n②Hash：存对象字段，省内存，如用户信息。\n③List：消息队列（LPUSH/BRPOP）、最新列表（时间线）。\n④Set：去重、交集并集（共同好友、标签）。\n⑤ZSet（有序集合）：排行榜、延时队列（score 存时间戳）、范围查询。\n高级结构：HyperLogLog（UV 统计，误差可接受）、Geo（地理位置）、Bitmap（签到、在线状态）。\n面试能说清每个结构适合什么场景就够了。"},
{"s":4,"t":["theory"],"q":"Redis 的过期删除策略和内存淘汰策略？","a":"过期删除策略（惰性删除 + 定期删除结合）：\n- 惰性删除：访问 key 时才检查是否过期，过期就删。省 CPU，但过期 key 会残留占内存\n- 定期删除：每隔一段时间随机抽取一批过期 key 删除\n- 注意：两个策略都不能保证过期 key 立即删除，所以还要靠内存淘汰策略兜底\n内存淘汰策略（maxmemory-policy）：\n- noeviction：不淘汰，写命令报错（默认）\n- allkeys-lru / volatile-lru：按 LRU 淘汰\n- allkeys-lfu / volatile-lfu：按 LFU（访问频率）淘汰，Redis 4.0+\n- allkeys-random / volatile-random：随机\n- volatile-ttl：淘汰剩余 TTL 最短的\n生产常用 allkeys-lru 或 allkeys-lfu。"},
{"s":4,"t":["project","practice"],"q":"Redis 哨兵的 quorum 参数怎么设置？","a":"quorum 是哨兵判定主库\"客观下线\"所需同意的哨兵数。\n公式：quorum = 哨兵总数 / 2 + 1（多数派），且建议 `quorum >= 哨兵数/2`。\n配置示例（3 个哨兵）：`sentinel monitor mymaster 主库IP 6379 2`，即 2 个哨兵同意才判下线。\n注意：quorum 只决定是否触发故障转移，真正执行切换还需要选举出 leader 哨兵（需要多数哨兵投票支持），所以：\n- 哨兵数建议 3 或 5（奇数）\n- quorum 太大：触发转移慢，可能等不到多数派\n- quorum 太小：误判后容易抖动\n另外 `sentinel down-after-milliseconds`（主观下线判定时间）、`failover-timeout` 也影响切换体验，生产要调优。\n补充概念辨析（常被追问）：主观下线（SDOWN）= 单个哨兵自己觉得主库挂了；客观下线（ODOWN）= 超过 quorum 个哨兵都认为挂了，才触发故障转移——避免单个哨兵误判导致切换。","c":"quorum 是“判定主库客观下线需要的确认数”，我们 3 个哨兵设的 quorum=2。\n设置思路：\n①quorum 要大于哨兵数的一半（多数派）：3 个哨兵设 2，5 个设 3，防止网络分区时两边各一半、各自主观下线自己当主（脑裂）；\n②quorum 不是越大越好：设大了，少数哨兵存活时可能触发不了 failover（比如 3 个哨兵 quorum=3，挂 1 个哨兵就永远无法判客观下线）——所以 quorum=2 的容错是允许挂 1 个；\n③配合参数：\ndown-after-milliseconds（多久没心跳判主观下线，我们 5000ms）\nfailover-timeout（failover 超时，我们 30000ms）\n④哨兵数量建议奇数（3/5），偶数节点意义不大，还浪费。\n踩坑：我们一开始 3 个哨兵 quorum 设的 3，模拟主库宕机时 failover 老触发不了，改成 2 后正常——理解了多数派原理就不会踩这个。"},
{"s":4,"t":["theory"],"q":"缓存和数据库一致性怎么保证？","a":"经典方案（Cache Aside）：\n- 读：先读缓存，没有则读数据库并回填缓存\n- 写：先更新数据库，再删缓存（不是更新缓存）\n为什么删缓存不更新缓存：写频繁时更新缓存成本高，且并发下容易产生旧值；删除后下次读再重建，保证最终一致。\n并发问题的处理：\n- 先删缓存再更新库的时序问题 → 改为先更新库再删缓存，或延迟双删\n- 更新库和删缓存之间的极端窗口 → 用 binlog 订阅（Canal）异步删缓存，重试兜底\n- 强一致场景：引入分布式锁串行化读写，或用 Redisson 的读写锁\n面试标准答案：Cache Aside + 延迟双删 + Canal 兜底，能说清每个方案的取舍即可。"},
{"s":3,"t":["theory"],"q":"Redis 分布式锁了解吗？","a":"基本实现：`SET key value NX EX 30`（不存在才设置 + 过期时间），释放时用 Lua 脚本比较 value（防止误删别人锁）：\n`if redis.call(\"get\",KEYS[1])==ARGV[1] then return redis.call(\"del\",KEYS[1]) else return 0 end`\n问题：主从切换时锁可能丢失（主库宕机，从库没有锁信息）→ 红锁（RedLock）或 Redisson 的看门狗续期。\nRedisson 方案：\n- 自带看门狗（WatchDog）自动续期，防止业务没执行完锁就过期\n- 支持可重入、公平锁、读写锁\n面试要点：能写出 SET NX EX + Lua 释放的完整实现，并说出主从切换丢锁的缺陷和 Redisson 的解决方案。"},
{"s":3,"t":["theory"],"q":"Redis 的 key 过期了为什么内存还没释放？","a":"因为 Redis 的过期删除策略是\"惰性删除 + 定期删除\"：\n- 惰性删除：只有 key 被访问时才检查并删除\n- 定期删除：每 100ms 随机抽一批过期 key 删除，不会全量扫描\n所以过期 key 不会立刻从内存消失，而是等被访问或被抽样删到，或者等内存淘汰策略触发。\n如果大量过期 key 没被访问，会短暂占用内存，这是设计权衡（避免全量扫描阻塞单线程）。\n面试延伸：所以生产要监控 used_memory，及时清理无用的 key，避免内存浪费。"},
{"s":2,"t":["theory"],"q":"Redis 怎么部署高可用集群？哨兵 vs 集群？","a":"哨兵（Sentinel）：主从复制 + 哨兵监控，解决\"主库挂了自动切换\"，是数据量大但单实例可承受的方案。\n集群（Cluster，官方）：数据自动分片（16384 个槽），支持水平扩展，多主多从，主节点挂了自动故障转移。适合数据量大、单实例内存不够的场景。\n选择：\n- 数据量小、只求高可用 → 哨兵\n- 数据量大、需要水平扩展 → Cluster（至少 3 主 3 从）\n- 两者都要求客户端支持（Cluster 客户端要处理重定向 MOVED/ASK）\n面试补充：Cluster 的槽位分配、key 的 CRC16 哈希、mget 跨槽限制、集群不能多 key 操作等。"},
{"s":4,"t":["troubleshoot"],"q":"大 key 和热 key 问题及解决方案？","a":"大 key（value 很大，如大 List/Hash 几百万元素）：\n- 危害：删除/迁移阻塞单线程（慢命令）、内存不均、网络传输慢\n- 发现：`redis-cli --bigkeys` 扫描、MEMORY USAGE 命令\n- 解决：拆分（按字段/日期分 key）、压缩、对大结构分批删除（scan + 渐进删除）\n热 key（某 key 访问量极高）：\n- 危害：单分片/单节点成为瓶颈\n- 发现：`redis-cli --hotkeys`（需 LFU）、monitor 抓取、业务埋点\n- 解决：多级缓存（本地缓存兜底）、热点 key 加随机后缀分散到多节点、读多副本\n面试能说清危害和 2-3 个方案即可。"},
{"s":3,"t":["troubleshoot"],"q":"Redis 慢查询怎么排查？","a":"①`SLOWLOG GET 100` 查看最近的慢命令（默认超过 10ms 记录，可通过 `slowlog-log-slower-than` 调整阈值）。\n②分析慢命令类型：常见的是 KEYS、SMEMBERS、大 key 的 HGETALL/LRANGE、SORT 等 O(N) 命令。\n③处理：\n- 命令层：换用 SCAN 代替 KEYS、限制返回数量、拆分大 key\n- 参数层：调大 `slowlog-log-slower-than` 观察，或优化 `proto-max-bulk-len`\n- 架构层：热 key 分散、加本地缓存\n④预防：客户端禁止危险命令（rename-command 禁 KEYS/FLUSHALL）、监控命令耗时。\n慢查询日志不持久化，重启丢失，生产要提前收集。"},
{"s":2,"t":["theory"],"q":"Redis 缓存常见业务场景有哪些？","a":"①热点数据缓存：接口/页面数据缓存，降低 DB 压力（最常见）。\n②计数器：点赞数、访问量、限流（INCR + EXPIRE）。\n③会话共享：集群环境下 Session 存 Redis，解决多实例登录态。\n④消息队列：List + BRPOP 做简单异步队列（正式场景用 MQ）。\n⑤排行榜：ZSet 按 score 排序。\n⑥分布式锁：秒杀、防重复提交。\n⑦布隆过滤器：防缓存穿透。\n⑧延迟任务：ZSet score 存执行时间戳，轮询到期任务。\n面试举例时选 2-3 个场景讲透，结合自己的项目说最佳。"},
{"s":3,"t":["practice","troubleshoot"],"q":"Redis 内存满了会怎样？怎么监控内存？","a":"内存满了（达到 maxmemory）：触发内存淘汰策略。默认 noeviction 会拒绝写命令报 OOM 错误，读不受影响。\n监控命令：\n- `INFO memory`：used_memory、used_memory_human、maxmemory、mem_fragmentation_ratio（碎片率，>1.5 需整理）\n- `redis-cli --stat`：实时查看内存和连接\n- 配合 Prometheus 的 redis_exporter 采集指标，Grafana 做大盘，超过阈值（如 80%）告警\n处理：\n- 检查大 key、无 TTL 的 key（`INFO keyspace` 配合 SCAN 统计）\n- 设置合理 maxmemory + allkeys-lru 淘汰\n- 数据量大考虑 Cluster 扩容\n- 排查内存泄漏（客户端连接占用、monitor 开着等）"}
];

{"s":5,"t":["theory"],"q":"Spring Boot 的自动装配原理？","a":"核心：`@SpringBootApplication` = `@SpringBootConfiguration` + `@EnableAutoConfiguration` + `@ComponentScan`。\n`@EnableAutoConfiguration` 通过 `@Import(AutoConfigurationImportSelector.class)` 实现：\n①Spring Boot 启动时加载 `META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports`（2.7+）或 `spring.factories`（旧版）\n②文件里声明所有自动配置类（如 RedisAutoConfiguration、DataSourceAutoConfiguration）\n③每个自动配置类通过 `@ConditionalOnClass`、`@ConditionalOnMissingBean` 等条件注解按需生效（有对应依赖且用户没自定义 Bean 才装配）\n④最终注册成 Bean 放入容器\n一句话：启动时扫描自动配置清单 → 按条件装配需要的 Bean，实现\"依赖引入即自动可用\"。"},
{"s":4,"t":["theory"],"q":"Spring 的 IoC 和 DI 是什么？","a":"IoC（控制反转）：对象的创建和管理权从程序员手中反转给 Spring 容器。程序员不再 new 对象，而是声明依赖，由容器创建、组装、管理生命周期。\nDI（依赖注入）：IoC 的实现方式，容器把依赖对象注入到需要它的地方。注入方式：构造器注入（推荐）、Setter 注入、字段注入（@Autowired）。\n好处：解耦（类不直接依赖具体实现）、易测试（可注入 mock）、统一管理生命周期。\n举例：Service 依赖 DAO，不用 new，而是 @Autowired 让容器注入，换实现类只需改配置/注解。"},
{"s":4,"t":["theory"],"q":"Spring 的 Bean 生命周期？","a":"完整链路：实例化 → 属性填充（依赖注入）→ Aware 回调（BeanNameAware、BeanFactoryAware 等）→ BeanPostProcessor 前置处理 → 初始化方法（@PostConstruct / InitializingBean / init-method）→ BeanPostProcessor 后置处理（AOP 代理在这里生成）→ 使用 → 销毁（@PreDestroy / DisposableBean / destroy-method）。\n面试简化版口诀：\"实例化 → 注入 → Aware → 前置 → 初始化 → 后置 → 使用 → 销毁\"。\n加分点：\n- AOP 代理在 BeanPostProcessor 后置阶段生成（AbstractAutoProxyCreator）\n- 单例 Bean 默认容器启动时实例化（lazy-init 可延迟）"},
{"s":4,"t":["project","practice"],"q":"Spring Boot 多环境配置怎么做？","a":"方案一（最常用）：application.yml + application-{profile}.yml。\n- application-dev.yml：开发环境\n- application-prod.yml：生产环境\n- 激活方式：`spring.profiles.active=prod`，可通过启动参数 `--spring.profiles.active=prod` 或环境变量 `SPRING_PROFILES_ACTIVE=prod` 覆盖\n容器化场景（我项目里的做法）：镜像只打一个，Dockerfile 里 `ENV SPRING_PROFILES_ACTIVE=prod`，用 docker-compose 的 environment 按环境传值，实现\"一次构建，多环境运行\"。\n方案二：配置中心（Nacos/Consul）管理动态配置。\n注意：数据库密码等敏感配置用环境变量注入，不进代码仓库。","c":"Spring Boot 多环境配置（我们项目的做法）：\n①结构：application.yml（公共配置）+ application-dev.yml / application-test.yml / application-prod.yml（环境差异）；\n②切换：通过环境变量 SPRING_PROFILES_ACTIVE=prod 指定激活哪个 profile（部署时在 Compose 的 environment 里配，不用改代码）；\n③每环境差异：数据源地址/密码、Redis 地址、日志级别（dev 开 DEBUG，prod 用 INFO/WARN）、文件上传路径等；\n④敏感配置：密码不写死在 yml，用环境变量引用 ${DB_PASSWORD}，部署时从 .env 注入，.env 不进 Git；\n⑤兜底：application.yml 里给默认值，防止漏配导致启动失败。\n举例：同一套 jar/镜像，dev 环境 SPRING_PROFILES_ACTIVE=dev 连本地 MySQL，生产 =prod 连生产库——这就是“一套制品、多环境运行”的核心。\n追问应对：问“Spring 配置优先级”，答：命令行参数 > Java 系统属性 > 环境变量 > application-{profile}.yml > application.yml，环境变量优先级高于 yml，所以部署时注入能覆盖默认配置。"},
{"s":4,"t":["theory"],"q":"Spring 事务失效的场景有哪些？","a":"①方法不是 public：Spring 默认用 JDK 动态代理，只能代理 public 方法。\n②自调用：同类内 this 调用（如 A 方法调用同类 B 方法），不经过代理 → 用注入自身或 AopContext.currentProxy()。\n③异常被捕获：方法内 try-catch 吞掉异常，事务感知不到 → 抛出或手动回滚 TransactionAspectSupport.currentTransactionStatus().setRollbackOnly()。\n④抛出检查异常（默认不回滚）：默认只回滚 RuntimeException 和 Error → `rollbackFor = Exception.class`。\n⑤事务方法被 final/static 修饰：代理无法重写。\n⑥数据源/事务管理器没配置好（多数据源时事务管理器指定错）。\n⑦类没有被 Spring 管理（没加 @Service 等）。\n这些场景面试高频，能列出 4-5 个就算扎实。"},
{"s":3,"t":["theory"],"q":"Spring AOP 是什么？用到哪些场景？","a":"AOP（面向切面编程）：把横切关注点（日志、事务、权限、性能监控）从业务代码中抽离，通过动态代理统一织入。\n实现原理：\n- JDK 动态代理：基于接口，目标类必须实现接口\n- CGLIB 代理：基于子类继承，无接口也可（Spring 默认策略）\n核心概念：切面（@Aspect）、切点（@Pointcut）、通知（@Before/@After/@Around/@AfterReturning/@AfterThrowing）、连接点、引入。\n典型场景：\n- 声明式事务（@Transactional）\n- 日志记录（操作审计）\n- 权限校验\n- 接口耗时监控\n- 自定义注解 + AOP 做通用逻辑（如幂等、限流）"},
{"s":3,"t":["theory"],"q":"Spring Boot 和传统 Spring 的区别？","a":"传统 Spring：需要大量 XML 或 Java 配置（组件扫描、数据源、事务管理器都要手动声明），集成第三方框架要写配置，依赖版本要自己管理。\nSpring Boot 的改进：\n- 自动装配：starter 依赖 + 自动配置类，引入即用\n- 约定优于配置：默认配置 + 少量覆盖\n- 内嵌 Tomcat：打成可执行 jar 直接 java -jar 运行，无需外置容器\n- 提供 Actuator 健康检查、指标监控\n- 简化部署：一个 jar 一个命令，天然适合容器化（我们项目就是 Spring Boot jar + Docker 部署）"},
{"s":2,"t":["theory"],"q":"Spring Boot 的 starter 是什么？","a":"starter 是一组依赖的描述符（POM），把某个功能所需的所有依赖打包在一起，引入一个 starter 即可获得整套能力。\n比如 `spring-boot-starter-web` 包含 Spring MVC、内嵌 Tomcat、Jackson 等；`spring-boot-starter-data-redis` 包含 Redis 客户端和自动配置。\n原理：starter 的 POM 里声明依赖 + 自动配置类通过条件注解生效。\n自定义 starter：①写自动配置类（@Configuration + 条件注解）→ ②注册到 AutoConfiguration.imports → ③提供 spring.factories/imports 文件。面试能说清 starter 解决什么问题即可。"},
{"s":3,"t":["theory"],"q":"Spring Security 的认证和授权流程？","a":"认证（Authentication）：\n①用户提交用户名密码 → UsernamePasswordAuthenticationFilter 构建 AuthenticationToken → AuthenticationManager 交给对应 Provider 验证 → 成功则存入 SecurityContext，生成 Session/JWT。\n核心组件：SecurityFilterChain（过滤器链）、AuthenticationManager、UserDetailsService（加载用户）、PasswordEncoder（BCrypt 加密）。\n授权（Authorization）：\n- 基于注解：@PreAuthorize(\"hasRole('ADMIN')\")、@Secured\n- 基于 URL：SecurityFilterChain 里 `authorizeHttpRequests().requestMatchers(\"/admin/**\").hasRole(\"ADMIN\")`\n- JWT 场景：OncePerRequestFilter 解析 Token → 加载用户 → 设置 SecurityContext\nRuoYi 就是基于 Spring Security + JWT + 权限表达式实现 RBAC，我能说清菜单权限/按钮权限的数据结构和校验流程。\nJWT 认证完整流程（面试常被追问）：①用户登录提交用户名密码 → ②后端校验通过后生成 JWT（含用户ID/角色/过期时间，用密钥签名）→ ③返回 Token 给前端 → ④前端后续请求放 Authorization 头（Bearer <token>）→ ⑤后端 JWT 过滤器拦截解析、验签、校验有效期 → ⑥把用户信息放入 SecurityContextHolder → ⑦@PreAuthorize 权限注解生效，失败返回 401。\nRBAC 落地：数据库 5 张表（sys_user / sys_role / sys_resource / sys_user_role / sys_role_resource），登录时 UserDetailsService 加载用户权限列表，Controller 用 @PreAuthorize(\"hasAuthority('server:add')\") 做细粒度控制；需要 URL 级动态权限时自定义 FilterInvocationSecurityMetadataSource 从数据库动态加载权限映射。"},
{"s":3,"t":["practice"],"q":"MyBatis-Plus 常用功能？","a":"①CRUD 免写：BaseMapper 提供 selectById、insert、updateById 等，不用写 XML。\n②条件构造器：QueryWrapper / LambdaQueryWrapper 链式拼条件：`new LambdaQueryWrapper<User>().eq(User::getStatus, 1).orderByDesc(User::getCreateTime)`。\n③分页插件：PaginationInnerInterceptor，`Page<User> page = userMapper.selectPage(new Page<>(1,10), wrapper)`。\n④代码生成器：根据表结构生成实体、Mapper、Service、Controller。\n⑤逻辑删除：@TableLogic，delete 变 update。\n⑥自动填充：@TableField(fill = FieldFill.INSERT) 配合 MetaObjectHandler 自动填创建时间。\n⑦乐观锁：@Version。\n我在巡检平台项目里用 MyBatis-Plus 快速完成了基础 CRUD 和数据字典功能。\n代码生成器具体用法（我在巡检平台用过）：MyBatis-Plus Generator 3.5.x + FastAutoGenerator，写一个 CodeGenerator 类，配置数据库连接、作者、输出目录、包名、要生成的表名，选择策略（Entity/Service/Controller/Mapper），执行一次自动生成全套 CRUD 代码，8 张表 5 分钟搞定（手工写要 2-3 天）。"},
{"s":2,"t":["practice"],"q":"RESTful API 设计规范？","a":"①资源用名词复数：/users、/orders，不用动词。\n②HTTP 方法表达操作：GET 查询、POST 创建、PUT 全量更新、PATCH 部分更新、DELETE 删除。\n③URL 层级表达资源关系：/users/{id}/orders。\n④状态码语义化：200 成功、201 创建成功、400 参数错误、401 未认证、403 无权限、404 不存在、500 服务端错误。\n⑤统一返回结构：{ code, message, data }。\n⑥版本控制：/api/v1/users。\n⑦参数校验、分页参数（page/size）、过滤排序参数化。\n⑧幂等性：POST 不幂等，可用幂等键；DELETE/PUT 设计为幂等。"},
{"s":3,"t":["theory"],"q":"Java 线程池的核心参数？","a":"ThreadPoolExecutor 七个参数：\n①corePoolSize：核心线程数（常驻）\n②maximumPoolSize：最大线程数\n③keepAliveTime：非核心线程空闲存活时间\n④unit：时间单位\n⑤workQueue：任务队列（ArrayBlockingQueue 有界 / LinkedBlockingQueue 无界 / SynchronousQueue 直接交接）\n⑥threadFactory：线程工厂（命名、守护线程）\n⑦handler：拒绝策略（AbortPolicy 抛异常默认 / CallerRunsPolicy 调用者执行 / DiscardPolicy 丢弃 / DiscardOldestPolicy 丢最旧）\n执行流程：核心线程满 → 入队列 → 队列满 → 开非核心线程 → 到最大且队列满 → 拒绝策略。\n生产禁止用 Executors 的固定线程池（无界队列会 OOM），要自定义参数并设置线程名方便排查。"},
{"s":3,"t":["theory"],"q":"HashMap 的原理？","a":"底层：数组 + 链表 + 红黑树（JDK 1.8+）。\nput 流程：\n①对 key 计算 hash（高 16 位异或低 16 位）\n②`(n-1) & hash` 定位桶下标\n③桶为空直接放；冲突则尾插法链到链表；链表长度 ≥8 且数组长度 ≥64 时转红黑树\n④超过负载因子（默认 0.75）触发扩容（2 倍），重新分配桶\n关键点：\n- 默认容量 16，扩容 2 倍保证 `(n-1)&hash` 均匀\n- 线程不安全：JDK1.7 并发扩容可能死循环，1.8 改为尾插解决死循环但仍可能丢数据 → 并发用 ConcurrentHashMap（CAS + synchronized 锁桶）\n- key 允许 null（hash 为 0），value 允许 null"},
{"s":2,"t":["theory"],"q":"Maven 的生命周期？","a":"Maven 三大生命周期：\n- clean：清理（clean 删除 target）\n- default：核心构建，主要阶段：validate → compile（编译）→ test（测试）→ package（打包 jar/war）→ install（装到本地仓库）→ deploy（发布到远程仓库）\n- site：生成站点文档\n面试常问：`mvn package` 和 `mvn install` 的区别（package 只打包，install 打包并装到本地仓库供其他模块引用）；`mvn clean package -DskipTests` 跳过测试。\nCI 里常配合：`mvn clean package -Dmaven.test.skip=true` 构建产物，再上传部署。"},
{"s":1,"t":["theory"],"q":"Redis 7.0 的多线程 IO 是怎么实现的？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- Redis 单线程的\"快\"是指：命令执行（处理逻辑）仍是单线程，没有锁、没有上下文切换，所以原子且快。\n- 瓶颈在网络 IO：读取请求、写回响应的 read/write 系统调用很耗时。Redis 6.0+（7.0 完善）把\"网络 IO 读写\"拆到多线程，命令执行仍单线程。\n- 模型：主线程接收连接 → 多个 IO 线程并行读请求 → 主线程串行执行命令 → IO 线程并行写回响应。\n- 参数：io-threads（默认 4，建议 <8，且读线程数通常 = 写线程数）。\n- 面试加分点：\"执行单线程、IO 多线程\"这个精确表述，比笼统说\"Redis 多线程了\"高级得多。"},
{"s":1,"t":["theory"],"q":"Redis 的 RDB 与 AOF 混合持久化，底层是怎么配合的？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- RDB：把内存快照二进制 dump 到磁盘，恢复快，但两次快照之间的数据可能丢。\n- AOF：记录每条写命令，恢复慢但丢数据少（取决于 appendfsync 策略）。\n- 混合持久化（aof-use-rdb-preamble yes，Redis 4.0+）：AOF 文件开头放一段 RDB 格式的基线数据，后面追加增量写命令——兼顾 RDB 的恢复快和 AOF 的数据安全。\n- 重写（rewrite）：后台子进程生成新的混合文件，主进程继续服务并把增量命令缓存，最后合并。\n- 面试加分点：能讲出\"AOF 头是 RDB 体 + 尾部增量命令\"这个结构，就说明你真看过实现而不是背概念。"}

{"s":4,"t":["theory"],"q":"JVM 的运行时数据区有哪些？","a":"线程共享区：\n- 堆（Heap）：对象实例和数组，GC 主要区域，分新生代（Eden/S0/S1）和老年代\n- 方法区（元空间 Metaspace，JDK8+）：类信息、常量、静态变量，本地内存实现\n线程私有区：\n- 虚拟机栈：每个方法对应一个栈帧（局部变量表、操作数栈、动态链接、返回地址），StackOverflowError 常见于此\n- 本地方法栈：native 方法调用\n- 程序计数器：当前线程执行的字节码行号\n延伸：字符串常量池在堆中（JDK7+），直接内存（DirectByteBuffer）不受堆限制。"},
{"s":4,"t":["theory"],"q":"JVM 的类加载机制？（双亲委派）","a":"加载过程：加载 → 验证 → 准备 → 解析 → 初始化。\n双亲委派模型：\n- Bootstrap ClassLoader：加载 JDK 核心类（rt.jar，lib/）\n- Extension ClassLoader：加载扩展类（lib/ext）\n- Application ClassLoader：加载 classpath 下的类\n- 自定义 ClassLoader：用户扩展\n流程：类加载请求先逐级向上委托给父加载器，父加载器能加载则父加载，父加载不了才由自己加载。\n好处：\n- 避免核心类被篡改（java.lang.String 永远由 Bootstrap 加载）\n- 保证类加载一致性（同一个类只被加载一次，防止重复）\n破坏双亲委派：SPI（JDBC DriverManager 用线程上下文加载器）、Tomcat 隔离 Web 应用、热部署（OSGi）。"},
{"s":4,"t":["theory"],"q":"JVM 的垃圾回收算法有哪些？","a":"①标记-清除：标记存活对象，清除其余。有碎片、效率不稳定。\n②复制：把存活对象复制到另一块空间，清空原空间。无碎片但浪费空间（新生代用，Eden:S0:S1=8:1:1）。\n③标记-整理：标记后把存活对象向一端移动，再清理边界外。无碎片但移动成本高（老年代用）。\n④分代收集：新生代（复制算法，对象朝生夕灭）+ 老年代（标记-清除/整理）。\n延伸：三色标记法（解决并发标记时的漏标问题）、增量更新/原始快照（CMS/G1 的解决方案）。"},
{"s":4,"t":["theory"],"q":"常见的垃圾回收器？","a":"新生代：Serial（单线程）、ParNew（Serial 多线程版）、Parallel Scavenge（吞吐量优先）。\n老年代：Serial Old、Parallel Old、CMS（并发标记清除，追求低停顿，有碎片和浮动垃圾问题）。\nG1（JDK9+ 默认）：\n- 堆分 Region（2048 个左右），不再物理分代，逻辑分代\n- 可预测停顿：-XX:MaxGCPauseMillis=200\n- 适合大堆、低延迟场景，兼顾吞吐\nZGC / Shenandoah（JDK11+/15+）：超低停顿（毫秒级），适合超大堆，牺牲部分吞吐。\n选型口诀：小堆单机用 Parallel，低延迟用 G1，超大堆用 ZGC。CMS 已被废弃，重点讲 G1。"},
{"s":3,"t":["theory"],"q":"JVM 的 GC 日志怎么看？","a":"开启：`-Xlog:gc*`（JDK9+，统一日志）或 `-XX:+PrintGCDetails`（旧版）。\n关键信息：\n- GC 类型：YoungGC / FullGC，FullGC 频繁说明有问题\n- 各区域容量变化：`Eden: 100M->10M(200M)` 表示使用量->回收后(总容量)\n- 停顿时间：`Pause Young (Normal) (G1 Evacuation Pause) 0.023s`，看 user/sys/real\n- 吞吐量：总时间 / GC 总耗时，低于 95% 要优化\n分析工具：GCViewer、gceasy（上传日志出报告）。\n判断健康：YoungGC 频繁但每次很快 → 正常；FullGC 频繁或停顿长 → 堆太小、内存泄漏、大对象多。"},
{"s":2,"t":["practice"],"q":"JVM 常用参数有哪些？","a":"堆内存：`-Xms512m`（初始堆）、`-Xmx512m`（最大堆，生产建议 Xms=Xmx 避免扩容抖动）、`-Xmn256m`（新生代）。\n元空间：`-XX:MetaspaceSize`、`-XX:MaxMetaspaceSize`。\n栈：`-Xss256k`。\nGC：`-XX:+UseG1GC`、`-XX:MaxGCPauseMillis=200`。\n日志：`-Xlog:gc*:file=gc.log`、`-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/dump/`（OOM 自动转储堆）。\n其他：`-Dserver.port=8080` 系统属性、`-Dspring.profiles.active=prod`。\n容器场景：JDK 10+ 默认感知容器内存限制，老版本需 `-XX:+UseContainerSupport` 或手动设置 -Xmx 为容器限制的 75%。"},
{"s":4,"t":["troubleshoot"],"q":"什么是内存泄漏和内存溢出？怎么排查 OOM？","a":"内存溢出（OOM）：内存真不够用了，抛 OutOfMemoryError。\n内存泄漏：对象该回收却没回收，长期积累最终导致 OOM。\n排查步骤：\n①启动参数加 `-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/dump/`，OOM 自动生成堆转储文件\n②用 MAT（Memory Analyzer）或 VisualVM 分析 dump：看 Histogram 里对象占用 TOP、Dominator Tree 找 GC Roots 引用链\n③定位泄漏对象：大 List/Map 只增不减、静态集合持有对象、连接/流未关闭、ThreadLocal 未移除\n④分析 GC 日志：FullGC 后老年代持续增长说明泄漏\n⑤修复后对比 GC 曲线验证\n也可以先用 `jmap -heap PID` 看堆使用，`jstat -gcutil PID 1000` 看 GC 频率。常见 OOM：堆溢出、元空间溢出（类加载器泄漏）、直接内存溢出（Netty）、栈溢出（递归）。"},
{"s":4,"t":["troubleshoot"],"q":"jstack 和 jmap 怎么用？","a":"jstack：打印线程栈。\n- `jstack PID > thread_dump.txt`：抓线程快照，排查死锁、CPU 高、线程阻塞\n- 配合 `top -Hp PID` 拿到 CPU 高的线程 ID（转十六进制），在 dump 里搜 `nid=0x...` 定位代码位置\njmap：堆分析。\n- `jmap -heap PID`：堆配置和使用概况\n- `jmap -histo PID`：对象占用排行（找大对象、可疑泄漏）\n- `jmap -dump:format=b,file=heap.hprof PID`：导出堆转储（生产谨慎，会 STW，先 jmap -heap 看再决定）\n补充：`jstat -gcutil PID 1000` 看 GC 实时曲线；`jcmd PID GC.heap_dump` 也可。排查 CPU 100% 的完整链路：top → top -Hp → printf 转十六进制 → jstack 定位 → 看代码。"},
{"s":3,"t":["theory"],"q":"强引用、软引用、弱引用、虚引用的区别？","a":"强引用：`Object o = new Object()`，只要可达就不会被 GC，OOM 也不回收。\n软引用（SoftReference）：内存充足时不回收，内存不足（要 OOM 前）才回收。适合做缓存（图片缓存）。\n弱引用（WeakReference）：下次 GC 一定回收（不管内存是否充足）。适合做缓存（ThreadLocal 的 key 就是弱引用）或规范对象（WeakHashMap）。\n虚引用（PhantomReference）：最弱，get() 永远返回 null，主要用于跟踪对象被回收（配合 ReferenceQueue 做堆外内存回收、DirectByteBuffer 的清理）。\n面试关键：说出回收时机 + 典型应用场景即可。"},
{"s":3,"t":["theory"],"q":"什么是 Stop The World？怎么减少停顿？","a":"STW：GC 过程中需要暂停所有业务线程，只让 GC 线程工作，暂停期间应用无响应。\n为什么需要：GC 移动/清理对象时，业务线程还在改引用，不暂停会数据错乱。\n减少停顿的思路：\n- 选低停顿回收器：CMS/G1/ZGC（ZGC 停顿在毫秒级，几乎不 STW）\n- 控制堆大小：太大堆 FullGC 停顿长，G1 可分区并控制 MaxGCPauseMillis\n- 减少 FullGC：合理设置堆大小、避免大对象直接进老年代、减少内存泄漏\n- 并发标记：CMS/G1 的并发阶段不 STW（用三色标记法解决并发问题）\n- 优化代码：减少频繁创建大对象、对象池复用\n面试补充：G1 的停顿可预测，ZGC 用染色指针 + 读屏障实现几乎无停顿。"}
];

{"s":5,"t":["theory"],"q":"OSI 七层模型和 TCP/IP 四层模型？","a":"OSI 七层（自下而上）：物理层 → 数据链路层 → 网络层 → 传输层 → 会话层 → 表示层 → 应用层。\nTCP/IP 四层：网络接口层（链路+物理）→ 网际层（IP）→ 传输层（TCP/UDP）→ 应用层（HTTP/FTP/DNS）。\n对应关系：\n- 网络接口层 ↔ 物理层+链路层：网卡、交换机、ARP\n- 网际层 ↔ 网络层：IP、ICMP、路由\n- 传输层：TCP/UDP、端口\n- 应用层：HTTP、HTTPS、DNS、FTP、SSH\n面试常问：TCP 在传输层，HTTP 在应用层；四层负载均衡 LVS 工作在传输层，七层 Nginx 工作在应用层。"},
{"s":5,"t":["theory"],"q":"TCP 三次握手和四次挥手？","a":"三次握手（建立连接）：\n①客户端发 SYN（seq=x）→ ②服务端回 SYN+ACK（seq=y, ack=x+1）→ ③客户端回 ACK（ack=y+1）。\n为什么三次：防止已失效的旧连接请求到达服务端造成资源浪费（两次握手时服务端不知道客户端是否收到确认）；保证双方收发能力正常。\n四次挥手（断开连接）：\n①客户端发 FIN → ②服务端回 ACK（此时服务端可能还有数据要发）→ ③服务端发完数据发 FIN → ④客户端回 ACK，进入 TIME_WAIT（2MSL）后关闭。\n为什么四次：TCP 是全双工，两个方向要分别关闭；服务端 ACK 和 FIN 不能合并（中间可能还有数据要发）。\nTIME_WAIT 作用：保证最后一个 ACK 到达（防止服务端重发 FIN）、让旧连接报文在网络中消失。"},
{"s":4,"t":["theory"],"q":"HTTP 和 HTTPS 的区别？","a":"①加密：HTTP 明文传输，HTTPS 通过 SSL/TLS 加密，防窃听、防篡改、防冒充。\n②端口：HTTP 默认 80，HTTPS 默认 443。\n③证书：HTTPS 需要 CA 签发的证书（服务器身份验证）。\n④性能：HTTPS 多了 TLS 握手开销（可复用会话/会话票据优化）。\nTLS 握手流程（简）：客户端 hello（支持的加密套件）→ 服务端返回证书+公钥 → 客户端验证证书、生成预主密钥 → 双方计算会话密钥 → 之后对称加密通信。\n部署：Nginx 配 ssl_certificate 和 ssl_certificate_key，HTTP 301 跳转 HTTPS。"},
{"s":4,"t":["theory"],"q":"TCP 和 UDP 的区别？","a":"TCP：\n- 面向连接：三次握手建立、四次挥手断开\n- 可靠传输：确认应答、超时重传、流量控制（滑动窗口）、拥塞控制（慢启动/拥塞避免/快重传快恢复）\n- 字节流、有序\n- 适合：HTTP、FTP、SMTP、数据库连接\nUDP：\n- 无连接，不保证可靠和有序\n- 开销小、延迟低、支持广播/组播\n- 适合：DNS（快）、视频直播、游戏、语音（可容忍丢包）\n一句话：TCP 重可靠、UDP 重实时。"},
{"s":4,"t":["theory"],"q":"HTTP 常见状态码？","a":"2xx 成功：200 OK、201 Created、204 No Content。\n3xx 重定向：301 永久重定向（换域名）、302 临时重定向、304 Not Modified（缓存命中，配合 Last-Modified/ETag）。\n4xx 客户端错误：400 参数错误、401 未认证、403 无权限、404 不存在、405 方法不允许、429 请求过多。\n5xx 服务端错误：500 内部错误、502 网关错误（Nginx 连不上后端）、503 服务不可用（过载/维护）、504 网关超时（后端响应慢）。\n运维场景：502/504 是 Nginx 后端问题高频排查点，403 常是权限或防盗链配置，429 是限流触发。"},
{"s":4,"t":["theory"],"q":"浏览器输入 URL 到页面展示的过程？","a":"①DNS 解析：浏览器缓存 → 系统 hosts → 本地 DNS → 根/顶级/权威 DNS，拿到目标 IP。\n②TCP 连接：与服务器三次握手（HTTPS 再加 TLS 握手）。\n③发送 HTTP 请求：请求行、请求头（Cookie、UA）、请求体。\n④服务器处理：Nginx 反向代理 → 后端应用处理 → 返回响应（状态码、响应头、Body）。\n⑤浏览器解析渲染：HTML 解析成 DOM 树、CSS 解析成 CSSOM、合成渲染树 → 布局 → 绘制；JS 阻塞解析。\n⑥加载子资源：CSS/JS/图片并行请求。\n优化切入点（结合性能）：DNS 预解析、CDN、HTTP/2 多路复用、静态资源缓存、压缩、懒加载。"},
{"s":3,"t":["theory"],"q":"DNS 解析过程？","a":"①浏览器缓存 → ②操作系统 hosts 文件/系统缓存 → ③本地 DNS 服务器（运营商/公司）→ ④本地 DNS 递归查询：根域名服务器（.）→ 顶级域名服务器（.com）→ 权威 DNS 服务器 → 返回 IP。\n缓存层级：浏览器、操作系统、本地 DNS 都有缓存，TTL 控制缓存时长。\n常见问题排查：\n- `nslookup 域名` 或 `dig 域名` 查解析结果\n- 解析慢：换 DNS（114.114.114.114 / 8.8.8.8）、检查本地 DNS 服务器\n- 解析错误：hosts 被改、DNS 污染\n- 生效时间：修改域名解析后等 TTL 过期，或本地刷新 DNS 缓存（Windows：ipconfig /flushdns）"},
{"s":3,"t":["practice"],"q":"常见网络排查命令有哪些？","a":"ping：测连通性和延迟（ICMP），`ping -c 4 目标`。\ntelnet / nc：测端口连通性，`telnet ip 8080`、`nc -zv ip 8080`。\nss / netstat：查看端口监听和连接状态。\ncurl：测 HTTP 服务，`curl -v` 看完整交互、`-I` 只看响应头、`-o /dev/null -w \"%{http_code} %{time_total}\"` 看状态和耗时。\ntraceroute：跟踪路由路径，定位丢包/延迟在哪一跳。\ndig / nslookup：DNS 解析。\nip / ifconfig：查看网卡和 IP。\nroute：查看路由表；iptables：查看防火墙规则。\n排查思路：先 ping 通不通 → 再 telnet 端口通不通 → curl 测应用 → 结合 traceroute 分段定位。"},
{"s":3,"t":["theory"],"q":"TCP 粘包/拆包问题？","a":"TCP 是字节流协议，没有消息边界。\n粘包：多个消息被合并成一个包发送（Nagle 算法、缓冲区合并）。\n拆包：一个消息被拆成多个包发送（缓冲区不足）。\n解决方式（应用层定协议）：\n- 定长消息：每个消息固定长度，不足补位\n- 分隔符：消息末尾加 \r\n（Redis、FTP 用）\n- 长度字段：消息头存消息体长度（最常用，Netty 的 LengthFieldBasedFrameDecoder）\n- 消息类型 + 长度 + 内容\nUDP 是报文式，有边界，不会有粘包问题。"},
{"s":3,"t":["theory"],"q":"什么是长连接和短连接？HTTP Keep-Alive？","a":"短连接：每次请求建立 TCP 连接，用完就断。开销大（每次三次握手），适合请求少、低频场景（老 HTTP/1.0）。\n长连接：连接建立后复用，多次请求共用一条 TCP 连接。减少握手开销，适合高频请求。\nHTTP Keep-Alive：HTTP/1.1 默认开启，一个 TCP 连接上串行发多个请求；HTTP/2 用多路复用（一条连接并行多请求）。\n服务端配置：Nginx `keepalive_timeout 65`、`keepalive_requests` 控制单连接最大请求数；Tomcat `maxKeepAliveRequests`。\n数据库连接池、Redis 连接都是长连接思想，避免频繁建连。\n注意：长连接会占用文件描述符，连接数大的服务要调大 ulimit。"},
{"s":2,"t":["theory"],"q":"什么是半连接队列和全连接队列？","a":"TCP 三次握手过程中：\n- 半连接队列（SYN Queue）：服务端收到 SYN 但还没完成三次握手的连接，存于内核队列\n- 全连接队列（Accept Queue）：三次握手完成、等待应用 accept() 的连接\n流程：客户端 SYN → 进入半连接队列 → 服务端回 SYN+ACK → 客户端 ACK → 连接移到全连接队列 → 应用 accept。\n问题表现：\n- 半连接队列满：SYN 被丢弃，客户端一直重发 SYN（看 netstat 大量 SYN_RECV）\n- 全连接队列满：连接被丢弃或 RST，应用 accept 不过来（看 ss 的 Send-Q/Recv-Q）\n排查：`ss -lnt` 看队列长度；调优：`net.ipv4.tcp_max_syn_backlog`、`somaxconn`、应用及时 accept、增大 backlog。"},
{"s":3,"t":["theory"],"q":"负载均衡的四层和七层区别？","a":"四层（传输层，基于 IP+端口）：LVS、F5。\n- 只转发 TCP/UDP 报文，不解析应用内容\n- 性能高（内核态转发）、吞吐大\n- 缺点：无法根据 URL/Host 路由、无法做应用层协议处理（如 HTTPS 卸载、压缩）\n七层（应用层，基于 HTTP 内容）：Nginx、HAProxy。\n- 能解析 URL、Host、Header，按路径/域名分发\n- 支持 SSL 终止、缓存、压缩、限流\n- 性能低于四层（用户态处理）\n选型：纯高并发 TCP 转发用 LVS，HTTP 业务用 Nginx，可组合（LVS 前置 + Nginx 后置）。"},
{"s":1,"t":["theory"],"q":"TCP BBR 拥塞控制算法为什么能提升带宽？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- 传统算法（CUBIC 等）以\"丢包\"为拥塞信号：发现丢包就大幅降速，但网络链路中丢包可能不是拥塞（如无线、深队列 buffer），导致带宽利用率低。\n- BBR（Bottleneck Bandwidth and Round-trip propagation time）：以\"带宽和 RTT 测量\"为信号，主动探测链路瓶颈带宽，让发送速率贴近真实链路容量，而不是等丢包。\n- 效果：在长肥管道（高带宽高延迟，如跨机房/跨国链路）上，带宽利用率可从 20%-30% 提升到 90%+。\n- 运维相关：Linux 内核 4.9+ 可启用 `net.core.default_qdisc=fq` + `net.ipv4.tcp_congestion_control=bbr`；CDN、视频、大文件下载场景收益明显。"},
{"s":1,"t":["theory"],"q":"ZGC 的并发标记和染色指针（Colored Pointers）是什么？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- ZGC（Z Garbage Collector）：JDK 11+ 的低延迟垃圾收集器，目标是 STW 停顿在 10ms 以内，不管堆多大。\n- 核心是把几乎全部阶段并发化：标记、转移、重映射都不需要 Stop-The-World。\n- 染色指针：把指针的高位（64 位中的前 18 位）当作标记位（Marked0/Marked1/Remapped/Finalizable 等），通过修改指针位而不是对象头来记录 GC 状态——所以 GC 线程和应用线程可以并发读对象，用读屏障（load barrier）即时处理指针状态。\n- 面试加分点：\"指针上染色、读屏障、并发转移、Region 化内存\"这几个词能说出来，应届里就是顶尖水平。"}
];

{"s":5,"t":["theory"],"q":"Prometheus 的监控架构和工作原理？","a":"核心架构组件：\n- Prometheus Server：定时从目标拉取指标（Pull 模型），存储时序数据，执行 PromQL 查询\n- Exporter：暴露指标的代理进程（Node Exporter 采机器、mysqld_exporter 采 MySQL、redis_exporter 采 Redis、JMX Exporter 采 Java）\n- Pushgateway：支持短生命周期任务主动推送指标\n- Alertmanager：接收告警，做分组、去重、路由（发送到钉钉/邮件/企业微信）\n- Grafana：可视化展示\n工作流程：Prometheus 通过服务发现/静态配置找到目标 → 按 scrape_interval（如15s）抓取 /metrics → 存储（TSDB，内存+WAL）→ PromQL 查询 → 规则评估触发告警 → Alertmanager 通知。\n我们项目用 Node Exporter 采集 CPU/内存/磁盘/网络，Grafana 展示，配置了磁盘和内存告警。"},
{"s":4,"t":["theory"],"q":"Prometheus 的指标类型有哪些？","a":"四种核心指标类型：\n①Counter（计数器）：只增不减，如请求总数、CPU 时间。适合算速率 `rate()`。\n②Gauge（仪表盘）：可增可减，如当前内存使用、连接数、温度。\n③Histogram（直方图）：观测值分布，按桶统计，如请求延迟。可算分位数 `histogram_quantile()`。\n④Summary（摘要）：客户端直接算分位数（0.5/0.9/0.99），如延迟分位数。\n区别：Histogram 分位数在服务端算（可聚合），Summary 在客户端算（不可聚合）。\n面试举例：接口 QPS 用 Counter + rate，当前在线人数用 Gauge，接口 P99 延迟用 Histogram。"},
{"s":4,"t":["practice"],"q":"Node Exporter 采集哪些指标？怎么部署？","a":"采集指标：\n- CPU：node_cpu_seconds_total（各模式使用率）\n- 内存：node_memory_MemTotal_bytes、node_memory_MemAvailable_bytes\n- 磁盘：node_filesystem_size_bytes、node_filesystem_avail_bytes\n- 网络：node_network_receive_bytes_total、node_network_transmit_bytes_total\n- 负载：node_load1/5/15\n部署方式（容器）：\n`docker run -d --name node-exporter --net=\"host\" --pid=\"host\" -v \"/:/host:ro,rslave\" prom/node-exporter --path.rootfs=/host`\n或者二进制直接跑，默认监听 9100 端口，浏览器访问 /metrics 可看原始指标。\n然后在 prometheus.yml 加 scrape 配置：`- job_name: 'node' static_configs: - targets: ['ip:9100']`，reload 生效。"},
{"s":4,"t":["practice"],"q":"怎么写 PromQL 查询？常用表达式？","a":"PromQL 基本语法：指标名 + 标签过滤 + 函数。\n常用表达式：\n- CPU 使用率：`100 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100`\n- 内存使用率：`(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100`\n- 磁盘使用率：`100 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}) * 100`\n- QPS：`sum(rate(http_requests_total[1m]))`\n- P99 延迟：`histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))`\n- 标签过滤：`{job=\"node\", instance=~\"192.168.*\"}`（正则用 =~）\n- 聚合：sum/avg/max/min by(标签)\n- 比较：`> 80` 返回 bool 或告警表达式"},
{"s":4,"t":["practice"],"q":"怎么配置告警规则？Alertmanager 怎么工作？","a":"告警规则写在 prometheus.yml 引用的规则文件里：\n`groups:\n- name: node-alerts\n  rules:\n  - alert: HighDiskUsage\n    expr: (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}) * 100 > 85\n    for: 5m\n    labels: { severity: warning }\n    annotations: { summary: \"磁盘使用率超过85%\", description: \"{{ $labels.instance }} 磁盘使用率 {{ $value }}%\" }`\n流程：Prometheus 持续评估规则 → 表达式持续满足 `for: 5m`（防抖动）→ 状态变 pending → firing → 推送 Alertmanager。\nAlertmanager 职责：\n- 分组（group_by）：同类告警合并成一条通知\n- 抑制（inhibit_rules）：大故障抑制衍生告警\n- 静默（silence）：维护窗口静音\n- 路由（route + receiver）：按标签路由到钉钉/邮件/企业微信 webhook\n告警质量：表达式+持续时长+分组抑制，避免告警风暴。"},
{"s":3,"t":["practice"],"q":"Grafana 怎么配置数据源和大盘？","a":"配置步骤：登录 Grafana → Configuration → Data Sources → 添加 Prometheus（填 URL，如 http://prometheus:9090）→ Save & Test。\n创建大盘：Dashboards → New Dashboard → 添加 Panel → 选 Prometheus 数据源 → 写 PromQL → 配置图表类型（时间序列/柱状/仪表盘）。\n常用 Panel：\n- 时间序列：CPU/内存/网络曲线\n- Stat（数字）：当前磁盘使用率\n- Gauge（仪表盘）：内存使用率单值\n- 表格：多主机指标对比\n可以把 Node Exporter 官方大盘（ID 1860）导入再改，或用 Grafana 模板市场。\n共享：Dashboard 的变量（如 instance）做主机下拉切换，一个大盘管所有机器。"},
{"s":4,"t":["theory"],"q":"监控体系怎么设计？监控哪些维度？（USE/RED 方法论）","a":"USE 方法（资源维度，针对基础设施）：\n- U（Utilization 利用率）：CPU、内存、磁盘、带宽使用率\n- S（Saturation 饱和度）：负载、队列长度、连接数\n- E（Errors 错误）：错误计数、重传、丢包\nRED 方法（服务维度，针对应用）：\n- R（Rate 请求速率）：QPS\n- E（Errors 错误率）：5xx 比例\n- D（Duration 延迟）：P50/P95/P99\n监控分层：\n①基础设施层：CPU/内存/磁盘/网络（Node Exporter）\n②中间件层：MySQL（连接数、慢查询、主从延迟）、Redis（内存、命中率）、Nginx（QPS、5xx）\n③应用层：JVM（堆、GC、线程）、接口 QPS/延迟/错误率\n④业务层：核心指标（订单量、注册量）\n原则：先定 SLO，再定告警；告警要可行动（收到告警知道该干嘛）。"},
{"s":3,"t":["theory"],"q":"Prometheus 的拉取模型 vs Zabbix 的推送模型？","a":"Prometheus 拉取模型（Pull）：\n- Server 主动抓取目标 /metrics\n- 优点：目标无需暴露端口也能由中心调度、天然适合容器（服务发现）、可在中心侧统一配置抓取频率\n- 缺点：目标必须在网络可达；防火墙要放行\nZabbix 推送模型（Agent 主动上报）：\n- Agent 安装在主机上，主动向 Server 上报数据\n- 优点：适合防火墙隔离环境、内网穿透场景；Agent 采集能力强（支持自定义脚本）\n- 缺点：Agent 要部署维护、配置较重\n选型：云原生/K8s 环境几乎标配 Prometheus；传统虚拟机/网络设备环境 Zabbix 也常见。能说清两者差异和适用场景即可。"},
{"s":3,"t":["practice"],"q":"怎么监控 MySQL、Redis、Java 应用？","a":"MySQL：部署 mysqld_exporter，指标：\n- 连接数：mysql_global_status_threads_connected\n- 慢查询：mysql_global_status_slow_queries\n- 主从状态：mysql_slave_status_seconds_behind_master（延迟）\n- 常用表达式：可用连接比例、QPS、InnoDB 缓冲池命中率\nRedis：部署 redis_exporter，指标：\n- 内存：redis_memory_used_bytes（used_memory）\n- 命中率：redis_keyspace_hits / (hits+misses)\n- 连接：connected_clients\n- 持久化、命令执行数\nJava 应用：JMX Exporter，指标：\n- JVM 堆内存：jvm_memory_bytes_used{area=\"heap\"}\n- GC：jvm_gc_collection_seconds_count\n- 线程：jvm_threads_current\n- 配合 Actuator 暴露 /actuator/prometheus（micrometer-registry-prometheus）更现代\n告警建议：MySQL 连接数、主从延迟>阈值；Redis 内存>80%；JVM 老年代增长、FullGC 频繁。"},
{"s":3,"t":["troubleshoot"],"q":"监控告警的误报/漏报怎么处理？","a":"误报处理：\n- 增加持续时长 `for:`（如持续5分钟才告警），过滤瞬时抖动\n- 调整阈值：结合历史数据（如磁盘 85% 太敏感改 90%）\n- 告警分组/抑制：Alertmanager 按实例分组，同一故障只发一条\n- 维护窗口：例行维护用 silence 静默\n漏报处理：\n- 检查采集：目标是否挂了（Up 状态）、exporter 是否在跑\n- 补充规则：用黄金指标（RED）设计，别只盯资源\n- 告警自检：定期演练，故意触发验证规则生效\n核心原则：\n- 告警要\"可行动\"（收到就知道该干嘛）\n- 每两周复盘告警记录，调阈值、删无效告警\n- 用 SLO 反推：服务不可用必然触达某个指标"}

{"s":4,"t":["practice"],"q":".env 环境变量管理敏感信息的原则？","a":"核心原则：密钥不进代码、不进镜像、不进日志。\n做法：\n①敏感信息（数据库密码、Token、密钥）写入 .env 文件：\n`DB_PASSWORD=xxx`\n`JWT_SECRET=xxx`\n②代码里读取环境变量：`System.getenv(\"DB_PASSWORD\")` 或 Spring `@Value(\"${DB_PASSWORD}\")`\n③.gitignore 排除 .env，仓库只提交 .env.example 模板\n④Compose/K8s 通过 env_file 或 Secret 注入\n⑤不同环境不同 .env（.env.dev / .env.prod），生产密码更严格管理\n⑥密码定期轮换，日志打码\n进阶：用密钥管理平台（Vault、云厂商 KMS/凭据管理），或 CI 平台（Jenkins Credentials）注入，避免明文落盘。"},
{"s":4,"t":["theory","practice"],"q":"容器非 root 运行的最小权限原则？","a":"为什么：root 在容器内拥有宿主机能力（内核共享），容器逃逸漏洞一旦利用，root 直接控制宿主机。\n做法：\n①Dockerfile 创建低权限用户：\n`RUN adduser -D -u 10001 appuser`\n`USER appuser`\n②Spring Boot 镜像示例：`RUN addgroup -S spring && adduser -S spring -G spring && USER spring:spring`\n③最小化内核能力：`docker run --cap-drop ALL --cap-add NET_BIND_SERVICE`（只保留绑定低端口的权限）\n④只读根文件系统 + 数据卷：`--read-only --tmpfs /tmp`\n⑤K8s 层面：`securityContext: { runAsNonRoot: true, runAsUser: 10001, capabilities: { drop: [\"ALL\"] } }`\n⑥扫描镜像漏洞，用官方镜像\n面试补充：很多基础镜像默认 root，要主动降权；端口 <1024 需要 NET_BIND_SERVICE 能力。"},
{"s":3,"t":["practice"],"q":"SSH 安全加固怎么做？","a":"①禁止 root 直接登录：`PermitRootLogin no`，用普通用户 + sudo。\n②密钥认证替代密码：`PasswordAuthentication no`，生成密钥对，公钥放 authorized_keys。\n③修改默认端口（22 → 高位端口），降低扫描命中率（治标）。\n④限制来源 IP：防火墙只放行信任 IP 的 SSH 端口。\n⑤登录失败限制：Fail2ban 封禁连续失败 IP。\n⑥闲置超时：`ClientAliveInterval 300`、`ClientAliveCountMax 0`。\n⑦审计：开启 sshd 日志，登录提醒（登录后 banner）。\n⑧定期检查：`last` 看登录记录、`auth.log` 看异常尝试。\n改完配置 `sshd -t` 校验 + `systemctl reload sshd`。"},
{"s":3,"t":["troubleshoot"],"q":"服务器被暴力破解/入侵怎么排查？","a":"排查步骤：\n①看登录记录：`last`、`lastb`（失败登录）、`cat /var/log/secure | grep Failed`\n②看异常进程：`top`、`ps aux` 找陌生进程，`ss -tlnp` 看有无异常外连\n③看异常文件：/tmp 下的可执行文件、/root 下的脚本、crontab 是否被加任务（`crontab -l`）\n④看账号：`cat /etc/passwd` 有无新增账号、`/etc/sudoers` 是否被改\n⑤看网络：`ss -tnp` 找对外连接、是否被植入挖矿程序（CPU 飙高）\n处置：\n①立即隔离：断网/防火墙限制，保留现场（先取证再处置）\n②杀进程、删恶意文件、清理 crontab 和 SSH 密钥\n③改所有密码和密钥，升级漏洞软件\n④排查后加固（Fail2ban、防火墙、禁用 root 登录）\n原则：先隔离取证，再清理，最后加固复盘。"},
{"s":3,"t":["practice"],"q":"防火墙（iptables/firewalld）怎么配？","a":"firewalld（CentOS7+ 默认，推荐）：\n- `firewall-cmd --add-port=8080/tcp --permanent` 放行端口\n- `firewall-cmd --add-service=http --permanent` 放行服务\n- `firewall-cmd --reload` 重载生效\n- `firewall-cmd --list-all` 查看规则\n- 区域概念：public 默认拒绝入站，只放行声明的\niptables（底层）：\n- `iptables -A INPUT -p tcp --dport 22 -j ACCEPT` 放行\n- `iptables -A INPUT -j DROP` 默认拒绝\n- `iptables -L -n` 查看，`iptables -F` 清空（危险）\n实践原则：\n- 默认拒绝 + 白名单放行（最小暴露）\n- 生产只开放业务端口和运维端口\n- 改规则前备份，测试环境验证\n- 注意顺序：iptables 规则从上到下匹配，DROP 放最后"},
{"s":2,"t":["theory"],"q":"敏感数据脱敏和传输加密怎么做？","a":"脱敏场景：\n- 日志脱敏：密码、Token、手机号打码（logback 自定义 filter 或 JSON 脱敏）\n- 接口脱敏：返回给前端的手机号/身份证用 * 号（@Sensitive 注解 + 序列化器）\n- 数据库脱敏：明文存储 + 查询脱敏，或加密存储（AES，密钥托管）\n传输加密：\n- HTTPS 全覆盖（TLS1.2+）\n- 内部服务间：gRPC TLS / mTLS\n- 敏感参数不放在 URL（会进日志）\n存储加密：\n- 数据库密码字段 AES 加密\n- 备份文件加密\n- 磁盘加密（LUKS）/云盘加密\n实践要点：脱敏要在源头做（日志框架层面），而不是显示层；密钥和脱敏规则都要集中管理。"},
{"s":2,"t":["practice"],"q":"日志审计怎么做？","a":"目的：安全事件溯源、合规要求、故障复盘。\n做法：\n①集中收集：filebeat + ELK / Loki + Promtail，统一日志平台\n②关键日志必收：\n- 登录日志：/var/log/secure（SSH 登录成功/失败）\n- 应用操作日志：登录、增删改、权限变更\n- 数据库审计：binlog / general log / 审计插件\n- Nginx access log：访问来源、异常请求\n③留存策略：按合规要求保留（如 180 天），冷热分层存储\n④告警联动：登录失败次数异常、敏感操作触发告警\n⑤定期分析：异常 IP、批量操作、越权行为\n配合容器：应用日志输出 stdout，由采集端统一收集，容器重建不丢。"},
{"s":2,"t":["practice"],"q":"系统漏洞怎么发现和修复？","a":"发现渠道：\n- 漏洞扫描：Nessus、OpenVAS、Trivy（镜像）、云安全中心\n- 官方公告：CVE 库、发行版安全公告（Ubuntu Security Notices、CentOS 公告）\n- 自动化：定时扫描 + 告警\n修复流程：\n①评估：影响范围、严重等级（CVSS）、是否有现成利用\n②测试：先在测试环境验证补丁\n③实施：yum update / 升级版本 / 配置缓解（临时禁用端口或模块）\n④验证与记录：修复后复扫，记录到台账\n常见处理：\n- 内核漏洞：升级内核（需重启，选维护窗口）\n- 中间件漏洞：升级版本或打补丁\n- 配置类漏洞：加固配置（SSH、TLS、权限）\n容器场景：定期重建镜像拉取新版基础镜像，用 Trivy 扫描镜像层漏洞。\n原则：高危漏洞 24-72 小时内处理，修复前先确认影响面。"}

{"s":5,"t":["theory"],"q":"Kubernetes 的架构和核心组件？","a":"控制面（Master）：\n- kube-apiserver：所有组件的统一入口，REST API，认证鉴权\n- etcd：集群状态存储（键值数据库）\n- kube-scheduler：把 Pod 调度到合适的 Node\n- kube-controller-manager：控制器集合（节点、副本、端点等）\n工作节点（Node）：\n- kubelet：本节点 Pod 生命周期管理，与 API Server 通信\n- kube-proxy：实现 Service 负载均衡（iptables/IPVS）\n- 容器运行时：containerd / docker / cri-o\n核心概念：Pod（最小调度单位）、Deployment（无状态应用）、Service（服务发现+负载均衡）、Namespace（隔离）、ConfigMap/Secret（配置）。\n面试讲清楚：请求从 API Server 进入 → 控制器协调期望状态 → Scheduler 选节点 → kubelet 拉镜像起 Pod → Service 暴露。"},
{"s":4,"t":["theory"],"q":"Pod 是什么？和容器有什么关系？","a":"Pod 是 K8s 的最小调度和资源单位，一个 Pod 可以包含一个或多个容器。\n特点：\n- 同一 Pod 的容器共享网络命名空间（共享 IP、端口空间）和存储卷\n- 通常一个 Pod 一个主容器，可加 sidecar 容器（日志收集、代理）\n- Pod 是\"临时\"的：重建后 IP 会变，所以不能直接访问 Pod IP，要通过 Service\n和容器的关系：容器是运行环境，Pod 是 K8s 层面的部署单元。\n生命周期的关键概念：重启策略（Always/OnFailure/Never）、探针（存活/就绪/启动）。\n部署应用 = 定义 Deployment（描述想要的 Pod 副本）→ 控制器保证实际状态向期望状态收敛。"},
{"s":4,"t":["theory","practice"],"q":"Deployment 怎么实现滚动更新和回滚？","a":"Deployment 管理 ReplicaSet（副本控制器），滚动更新原理：\n- 更新镜像时：`kubectl set image deployment/app app=registry/app:v2` 或改 YAML 后 apply\n- 默认 RollingUpdate 策略：先起一个新 Pod（maxSurge），就绪后删一个旧 Pod（maxUnavailable），逐步替换，服务不中断\n- 更新过程可暂停/恢复：`kubectl rollout pause/resume deployment/app`\n回滚：\n- 查看历史版本：`kubectl rollout history deployment/app`\n- 回滚到上一版：`kubectl rollout undo deployment/app`\n- 回滚到指定版本：`kubectl rollout undo deployment/app --to-revision=3`\n配套：就绪探针决定新 Pod 是否算\"可用\"；`revisionHistoryLimit` 控制保留的历史版本数。"},
{"s":4,"t":["theory"],"q":"Service 是怎么做负载均衡的？（ClusterIP/NodePort）","a":"Service 是访问 Pod 的稳定入口（Pod IP 会变，Service 名不变）。\n实现原理：\n- 创建 Service 时分配 ClusterIP（虚拟 IP）\n- 控制器为每个后端 Pod 维护 Endpoints\n- kube-proxy 通过 iptables/IPVS 规则把访问 ClusterIP 的流量转发到后端 Pod\n类型：\n- ClusterIP（默认）：集群内部访问，跨节点互通\n- NodePort：每个 Node 上开一个端口，外部通过 `节点IP:NodePort` 访问，再转 ClusterIP\n- LoadBalancer：云厂商负载均衡器接入 NodePort\n- ExternalName：DNS 别名\n服务发现：同 Namespace 下通过 `服务名:端口` 访问，跨 Namespace 用 `服务名.命名空间:端口`。"},
{"s":4,"t":["practice"],"q":"探针（livenessProbe/readinessProbe）区别？","a":"三种探针（kubelet 执行）：\n- livenessProbe（存活探针）：判断容器是否存活，失败则按 restartPolicy 重启容器。用于发现死锁、内存泄漏等假死状态。\n- readinessProbe（就绪探针）：判断容器是否准备好接收流量，失败则从 Service 的 Endpoints 中摘除（不转发流量，但不重启）。用于启动慢、依赖未就绪的场景。\n- startupProbe（启动探针）：启动缓慢的应用用，避免存活探针在启动期误杀。\n配置示例：\n`livenessProbe:\n  httpGet: { path: /health, port: 8080 }\n  initialDelaySeconds: 15\n  periodSeconds: 10`\n关键区分：liveness 管\"要不要重启\"，readiness 管\"要不要接流量\"。\n可以配合 Spring Boot 的 Actuator `/actuator/health` 做探针端点。"},
{"s":3,"t":["practice"],"q":"ConfigMap 和 Secret 的区别？","a":"两者都是把配置从镜像中解耦出来：\n- ConfigMap：存普通配置（application.yml、环境变量、配置文件），明文\n- Secret：存敏感信息（密码、Token、证书），值 base64 编码（不是加密，仅混淆），支持加密存储（KMS）\n使用方式：\n- 环境变量：`envFrom: - configMapRef: { name: app-config }`\n- 挂载文件：`volumes: - configMap: { name: app-config }`，挂到 /etc/config\nSecret 类型：Opaque（自定义）、kubernetes.io/tls（证书）、dockerconfigjson（镜像仓库凭据）。\n优势：改配置不用重新打镜像，改 ConfigMap 后滚动重启 Pod 即生效；Secret 解决了\"密码写镜像里\"的安全问题，对应简历里的 .env 思想。"},
{"s":3,"t":["theory"],"q":"K8s 和 Docker Compose 的区别？","a":"定位不同：\n- Docker Compose：单机多容器编排工具，适合开发/测试环境，一台机器上管理几个容器\n- Kubernetes：分布式容器编排平台，跨多台机器管理大规模容器集群，生产级\n能力对比：\n- 调度：Compose 无调度概念；K8s 有 Scheduler 自动调度到合适节点\n- 高可用：Compose 靠 restart；K8s 有副本控制器、故障自愈（Pod 挂了自动重建）、滚动更新\n- 服务发现：Compose 用服务名，K8s 用 Service + DNS\n- 伸缩：Compose 手动 scale；K8s 支持 HPA 自动伸缩\n- 存储/网络/配置：K8s 有 PVC、CNI、ConfigMap 完整体系\n演进路径：单机 Compose → 多机自建（kubeadm）→ 托管（RKE/K3s）→ 云托管（ACK/EKS）。"},
{"s":3,"t":["theory"],"q":"HPA（水平自动伸缩）原理？","a":"HPA（Horizontal Pod Autoscaler）根据 Pod 的 CPU/内存/自定义指标自动调整副本数。\n原理：\n①HPA 控制器通过 Metrics API 获取 Pod 指标（如 CPU 使用率）\n②计算期望副本数 = ceil(当前副本数 × 当前指标 / 目标指标)\n③创建/删除 Pod 使副本数向期望值收敛\n④配合 resources.requests 生效（HPA 基于 request 计算使用率）\n配置示例：\n`apiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata: { name: app-hpa }\nspec:\n  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: app }\n  minReplicas: 2\n  maxReplicas: 10\n  metrics:\n  - type: Resource\n    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }`\n配套：HPA 只扩缩 Pod 数，节点资源不够要配合 Cluster Autoscaler 扩节点。"},
{"s":2,"t":["theory"],"q":"命名空间 Namespace 是干什么的？","a":"Namespace 是 K8s 的逻辑隔离单元，把集群资源分组管理。\n作用：\n- 环境隔离：dev/test/prod 各占一个 Namespace，资源互不干扰\n- 权限隔离：结合 RBAC，不同团队只能操作自己的 Namespace\n- 资源配额：ResourceQuota 限制每个 Namespace 的 CPU/内存总量\n- 网络策略：NetworkPolicy 按 Namespace 控制流量\n系统默认 Namespace：default（默认）、kube-system（系统组件）、kube-public。\n注意：Namespace 是逻辑隔离不是硬隔离（节点共享），真正安全隔离要靠网络策略和多集群。"},
{"s":3,"t":["practice"],"q":"kubectl 常用命令有哪些？","a":"基础查看：\n- `kubectl get pods`（-n 指定命名空间、-o wide 看 IP/节点、-w 实时）\n- `kubectl get deploy/svc/nodes/events`\n- `kubectl describe pod xxx`：查看事件和详情（排查问题第一步）\n日志与执行：\n- `kubectl logs -f pod名`（多容器加 -c 容器名）\n- `kubectl exec -it pod名 -- bash`\n发布管理：\n- `kubectl apply -f deploy.yaml`、`kubectl delete -f xxx`\n- `kubectl rollout status/restart/undo deployment/app`\n- `kubectl scale deployment/app --replicas=3`\n排查链路：get → describe → logs → exec，逐步定位。"},
{"s":2,"t":["practice"],"q":"镜像怎么拉取？私有仓库怎么配？（imagePullSecrets）","a":"拉取策略（imagePullPolicy）：\n- Always：每次都拉（适合 latest 标签）\n- IfNotPresent：本地没有才拉（默认）\n- Never：只用本地镜像\n私有仓库认证：\n①先创建 dockerconfigjson 类型的 Secret：\n`kubectl create secret docker-registry regcred --docker-server=registry.example.com --docker-username=admin --docker-password=xxx`\n②Pod 里引用：\n`imagePullSecrets: [ { name: regcred } ]`\n或把 regcred 加到 ServiceAccount 上，同 SA 的 Pod 自动使用。\n在生产 CI 里，构建镜像推到 Harbor 后，发布时通过 K8s 更新 Deployment 的镜像 tag 触发滚动更新。"},
{"s":4,"t":["theory"],"q":"K8s 和 Docker 的区别？为什么需要 K8s？","a":"Docker 解决的是\"单机容器化\"：打包应用、隔离运行。\nK8s 解决的是\"大规模容器编排\"：当容器多了、机器多了，需要解决——\n- 调度：容器该跑在哪台机器\n- 高可用：容器挂了自动重建、故障转移\n- 弹性伸缩：根据负载自动扩缩容\n- 服务发现与负载均衡：容器 IP 会变，怎么稳定访问\n- 滚动发布与回滚：服务不中断地升级\n- 配置管理、存储管理、多环境隔离\n一句话：Docker 是\"容器引擎\"，K8s 是\"容器操作系统\"。现代容器化运维岗位，Docker + K8s 是标配，企业里 90% 的生产容器都跑在 K8s 上。"},
{"s":1,"t":["theory"],"q":"Kubernetes 默认调度器是怎么给 Pod 选节点的？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- 两阶段：过滤（Predicates/Filter）→ 打分（Priorities/Score）。\n- 过滤：把不满足条件的节点剔除——资源够不够（CPU/内存/GPU 请求）、端口冲突、nodeSelector、亲和性、污点容忍（taint/toleration）、数据卷挂载约束等。\n- 打分：对剩余节点算分——资源余量（MostAllocated/LeastRequested 等策略）、Pod 亲和/反亲和、节点就近（拓扑分布）等，得分最高的节点胜出。\n- 扩展：自定义调度器（scheduler extender / 调度框架 Scheduling Framework）可以加自己的过滤和打分插件。\n- 运维视角：Node 打污点 + Pod 加容忍是生产环境控制 Pod 分布的核心手段。"},
{"s":1,"t":["theory"],"q":"etcd 的 Raft 一致性协议是怎么保证数据不丢的？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- etcd 是 K8s 的\"数据库\"，存所有集群状态，靠 Raft 协议保证多副本一致。\n- Raft 核心：Leader 选举 + 日志复制。节点分 Leader/Follower/Candidate；多数派（quorum，如 3 节点要 2 票）确认才提交。\n- 写入流程：客户端写 Leader → Leader 记日志并发给所有 Follower → 超过半数节点落盘 → Leader 提交并回复客户端。\n- 为什么 3 节点：容忍 1 台故障（多数派 2/3 还在）；5 节点容忍 2 台。这就是\"etcd 必须奇数节点\"的原因。\n- 运维相关：etcd 磁盘慢、网络分区会导致 Leader 频繁切换甚至脑裂保护（多数派原则天然防脑裂）。"},
{"s":1,"t":["theory"],"q":"eBPF 是什么？为什么 Cilium/云原生网络基于它？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- eBPF：Linux 内核里运行沙箱化用户程序的机制——不修改内核源码、不加载内核模块，就能在内核里执行安全校验过的字节码，挂到网络、追踪、安全等钩子上。\n- 能力：高性能网络数据面（XDP/TC 加速）、可观测性（追踪任意系统调用/函数）、安全（运行时检测）。\n- Cilium：K8s 的 CNI 网络插件，用 eBPF 实现数据面——相比 iptables/IPVS 的规则遍历，eBPF 在内核里直接转发，性能高一个数量级，还能做 L7 可观测和网络策略。\n- 趋势：云原生网络正在从\"iptables 模式\"走向\"eBPF 模式\"（Cilium 是主流），运维懂这个概念说明跟得上技术演进。"},
{"s":1,"t":["theory"],"q":"Prometheus 的 TSDB 底层存储格式是怎样的？","a":"超纲加分题（应届答不出正常，答出是亮点）。\n- 时序数据以\"指标 + 标签集\"为唯一序列（series），按时间戳记录样本（value）。\n- 存储结构（V2/V3 TSDB）：\n  - 按 2 小时一个 block 落盘；block 内：chunks（样本数据）、index（标签→series 的倒排索引）、meta.json、tombstones。\n  - 内存里先写 WAL + head block，数据达到阈值后 compact 成 block。\n  - 标签用倒排索引（label → series id），查询按标签快速过滤。\n  - 压缩：chunk 内部用 Gorilla 压缩（时间戳 XOR + 数值 delta），磁盘占用小。\n- 运维相关：block 会定期 compaction、retention 按时间删 block；查询慢常和标签基数过大（高基数 series 爆炸）有关。"}
