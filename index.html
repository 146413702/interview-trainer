<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运维工程师面试题库（基于简历定制）- 王毅寒</title>

<style>
:root {
  --bg: #F5F7FA; --surface: #FFFFFF; --text: #1A202C; --text-secondary: #4A5568;
  --text-muted: #718096; --border: #E2E8F0; --accent: #3182CE; --accent-light: #EBF8FF;
  --s5: #E53E3E; --s4: #DD6B20; --s3: #38A169; --s2: #3182CE; --s1: #718096;
  --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 6px rgba(0,0,0,0.05);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; font-size: 15px; }
.header { background: linear-gradient(135deg, #1A365D 0%, #2B6CB0 100%); color: #fff; padding: 24px 32px 18px; }
.header h1 { font-size: 23px; font-weight: 700; margin-bottom: 6px; }
.subtitle { font-size: 13px; opacity: .85; margin-bottom: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
.stat-item { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: var(--radius); padding: 6px 14px; text-align: center; min-width: 74px; }
.stat-num { display: block; font-size: 20px; font-weight: 700; line-height: 1.2; }
.stat-label { font-size: 11px; opacity: .85; }
.progress-wrap { flex: 1; min-width: 200px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: var(--radius); padding: 8px 14px; }
.progress-label { font-size: 12px; opacity: .9; margin-bottom: 6px; }
.progress-bar { height: 10px; background: rgba(255,255,255,.2); border-radius: 5px; overflow: hidden; }
.progress-fill { height: 100%; background: #68D391; border-radius: 5px; transition: width .3s; }
.progress-text { font-size: 12px; margin-top: 4px; opacity: .9; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 12px; }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.mode-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 24px; display: flex; flex-wrap: wrap; gap: 6px; }
.mode-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); border-radius: 8px; padding: 6px 16px; font-size: 14px; cursor: pointer; transition: all .15s; }
.mode-btn:hover { border-color: var(--accent); color: var(--accent); }
.mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); }
.filter-label { font-size: 13px; color: var(--text-secondary); }
.filter-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); border-radius: 16px; padding: 3px 12px; font-size: 13px; cursor: pointer; transition: all .15s; }
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.search-box { border: 1px solid var(--border); border-radius: 16px; padding: 5px 14px; font-size: 13px; min-width: 160px; outline: none; margin-left: auto; color: var(--text); }
.search-box:focus { border-color: var(--accent); }
.result-count { font-size: 13px; color: var(--text-muted); margin-left: 8px; }
.layout { display: flex; align-items: flex-start; max-width: 1400px; margin: 0 auto; }
.sidebar { width: 250px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px; position: sticky; top: 50px; max-height: calc(100vh - 54px); overflow-y: auto; }
.sidebar-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; padding-left: 8px; }
.nav-list { list-style: none; }
.nav-item a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--text-secondary); text-decoration: none; font-size: 14px; transition: background .15s; }
.nav-item a:hover { background: var(--accent-light); color: var(--accent); }
.nav-icon { font-size: 15px; }
.nav-count { margin-left: auto; background: var(--bg); color: var(--text-muted); border-radius: 10px; padding: 0 8px; font-size: 12px; }
.main { flex: 1; padding: 20px 24px; min-width: 0; }
.category { margin-bottom: 28px; scroll-margin-top: 60px; }
.category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
.category-icon { font-size: 22px; }
.category-title { font-size: 19px; font-weight: 700; }
.category-count { margin-left: auto; font-size: 13px; color: var(--text-muted); background: var(--bg); padding: 2px 10px; border-radius: 12px; }
.q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); position: relative; }
.q-card:hover { box-shadow: var(--shadow-md); }
.q-card.st-mastered { opacity: .62; }
.q-stars { color: #CBD5E0; font-size: 14px; letter-spacing: 1px; }
.q-stars .filled { color: #F6AD55; }
.q-text { font-size: 15px; font-weight: 600; margin: 6px 0 8px; padding-right: 72px; }
.q-tag { display: inline-block; font-size: 12px; font-weight: 400; border-radius: 4px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
.tag-practice { background: #F0FFF4; color: var(--s3); }
.tag-theory { background: var(--accent-light); color: var(--s2); }
.tag-project { background: #FFFAF0; color: var(--s4); }
.tag-troubleshoot { background: #FFF5F5; color: var(--s5); }
.tag-hr { background: #EDF2F7; color: #4A5568; }
.q-answer-toggle { display: inline-block; font-size: 13px; color: var(--accent); cursor: pointer; user-select: none; border: 1px dashed var(--accent); border-radius: 6px; padding: 3px 12px; transition: all .15s; }
.q-answer-toggle:hover { background: var(--accent-light); }
.q-answer { display: none; margin-top: 10px; padding: 12px 14px; background: #F8FAFC; border-radius: 6px; font-size: 14px; color: var(--text-secondary); border-left: 3px solid var(--accent); }
.q-answer.show { display: block; }
.qa-title { font-size: 12px; font-weight: 600; margin-bottom: 6px; display: block; }
.qa-title.custom { color: #DD6B20; }
.qa-title.generic { color: var(--text-muted); }
.qa-switch { font-size: 12px; color: var(--accent); cursor: pointer; margin-top: 8px; text-decoration: underline; user-select: none; }
.q-answer code { background: #EDF2F7; color: #C53030; border-radius: 4px; padding: 0 4px; font-size: 13px; font-family: Consolas, monospace; }
.q-answer p { margin: 4px 0; }
.q-answer ul { margin: 4px 0 4px 20px; }
.q-answer strong { color: var(--text); }
.q-priority { position: absolute; top: 14px; right: 16px; font-size: 12px; border-radius: 4px; padding: 1px 8px; }
.p5 { background: #FFF5F5; color: var(--s5); }
.p4 { background: #FFFAF0; color: var(--s4); }
.p3 { background: #F0FFF4; color: var(--s3); }
.p2 { background: var(--accent-light); color: var(--s2); }
.p1 { background: #F7FAFC; color: var(--s1); }
.q-progress { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
.p-btn { font-size: 12px; border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; cursor: pointer; color: var(--text-muted); background: var(--surface); transition: all .15s; }
.p-btn:hover { border-color: var(--accent); }
.p-btn.active { font-weight: 600; }
.p-btn[data-st="0"].active { background: #EDF2F7; color: var(--text-secondary); border-color: #CBD5E0; }
.p-btn[data-st="1"].active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.p-btn[data-st="2"].active { background: #F0FFF4; color: var(--s3); border-color: var(--s3); }
.p-status { font-size: 12px; color: var(--text-muted); margin-left: auto; }
.toolbox { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
.toolbox h2 { font-size: 17px; margin-bottom: 10px; }
.toolbox p { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); border-radius: 8px; padding: 8px 18px; font-size: 14px; cursor: pointer; transition: all .15s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #2B6CB0; color: #fff; }
.btn-success { background: var(--s3); border-color: var(--s3); color: #fff; }
.btn-success:hover { background: #2F855A; color: #fff; }
.btn-warn { background: var(--s4); border-color: var(--s4); color: #fff; }
.btn-warn:hover { background: #C05621; color: #fff; }
.quiz-q { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.quiz-q-title { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
.quiz-answer-input { width: 100%; min-height: 90px; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: inherit; resize: vertical; outline: none; }
.quiz-answer-input:focus { border-color: var(--accent); }
.quiz-ref { display: none; margin-top: 10px; padding: 10px 12px; background: #F8FAFC; border-left: 3px solid var(--s4); border-radius: 6px; font-size: 13px; color: var(--text-secondary); }
.quiz-ref.show { display: block; }
.quiz-ref code { background: #EDF2F7; color: #C53030; border-radius: 4px; padding: 0 4px; }
.quiz-grade { display: none; margin-top: 10px; gap: 12px; align-items: center; flex-wrap: wrap; }
.quiz-grade.show { display: flex; }
.grade-score { width: 70px; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 14px; text-align: center; }
.grade-label { font-size: 13px; color: var(--text-muted); }
.grade-result { font-size: 13px; font-weight: 600; }
.grade-result.pass { color: var(--s3); }
.grade-result.fail { color: var(--s5); }
.iv-question { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.iv-q-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.iv-tag { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.iv-hint { background: var(--accent-light); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
.iv-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.iv-note { flex: 1; min-width: 200px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.score-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.score-table th, .score-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
.score-table th { background: #F7FAFC; }
.history-empty { color: var(--text-muted); padding: 20px; text-align: center; font-size: 14px; }
.wrong-item { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: var(--surface); }
.wrong-item .wq { flex: 1; font-size: 14px; }
.footer { text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px; }
@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
  .nav-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .nav-item a { padding: 5px 10px; font-size: 13px; }
  .nav-count { display: none; }
  .search-box { min-width: 100px; }
}
</style>
</head>
<body>

<header class="header">
  <h1>运维工程师面试题库（基于简历定制）</h1>
  <p class="subtitle">按简历《运维工程师简历-王毅寒》技能栈定制，覆盖面试官可能问到的所有问题。支持进度打卡、随机小测、模拟面试。</p>
  <div class="stats" id="statsBox"></div>
  <div id="studyPanel"></div>
  <div class="progress-wrap">
    <div class="progress-label" id="progressLabel">学习进度</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">未刷 0 · 已刷 0 · 已掌握 0</div>
  </div>
  <div class="legend">
    <span><span class="legend-dot" style="background:#E53E3E"></span>★★★★★ 必考</span>
    <span><span class="legend-dot" style="background:#DD6B20"></span>★★★★ 高频</span>
    <span><span class="legend-dot" style="background:#38A169"></span>★★★ 中频</span>
    <span><span class="legend-dot" style="background:#3182CE"></span>★★ 了解</span>
    <span><span class="legend-dot" style="background:#718096"></span>★ 加分</span>
  </div>
</header>

<div class="mode-bar" id="modeBar">
  <button class="mode-btn active" data-mode="browse">📖 刷题</button>
  <button class="mode-btn" data-mode="quiz">📝 随机小测</button>
  <button class="mode-btn" data-mode="interview">🎤 模拟面试</button>
  <button class="mode-btn" data-mode="wrong">❌ 错题集</button>
  <button class="mode-btn" data-mode="history">📊 历史记录</button>
</div>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">星级：</span>
  <button class="filter-btn active" data-filter="all">全部</button>
  <button class="filter-btn" data-filter="5">★★★★★</button>
  <button class="filter-btn" data-filter="4">★★★★</button>
  <button class="filter-btn" data-filter="3">★★★</button>
  <button class="filter-btn" data-filter="2">★★</button>
  <button class="filter-btn" data-filter="1">★</button>
  <span class="filter-label" style="margin-left:12px">状态：</span>
  <button class="filter-btn" data-status="all">全部</button>
  <button class="filter-btn" data-status="0">未刷</button>
  <button class="filter-btn" data-status="1">已刷</button>
  <button class="filter-btn" data-status="2">已掌握</button>
  <span class="filter-label" style="margin-left:12px">标签：</span>
  <button class="filter-btn" data-tag="practice">实操</button>
  <button class="filter-btn" data-tag="theory">原理</button>
  <button class="filter-btn" data-tag="project">项目</button>
  <button class="filter-btn" data-tag="troubleshoot">排障</button>
  <button class="filter-btn" data-tag="hr">软技能</button>
  <span class="filter-label" style="margin-left:12px">来源：</span>
  <button class="filter-btn" data-src="ext">🤖 扩展题</button>
  <input type="text" class="search-box" id="searchBox" placeholder="搜索关键词...">
  <span class="result-count" id="resultCount"></span>
</div>

<div class="layout">
  <nav class="sidebar" aria-label="分类导航">
    <div class="sidebar-title">题目分类</div>
    <ul class="nav-list" id="navList"></ul>
  </nav>
  <main class="main" id="mainContent"></main>
</div>

<div class="footer">由豆包根据简历定制生成 · 学习进度/错题集/历史记录保存在本机浏览器（localStorage） · <b id="appVersion">v7.35</b> <span id="protoChk"></span></div>

<script>
/* ============ 配置一键导入：链接尾部 #qb_voice=<base64>&qb_ai=<base64> 自动写入并提示 ============ */
(function () {
  function getParam(h, key) {
    var s = (h || "").replace(/^#/, "");
    var parts = s.split("&");
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].indexOf(key + "=") === 0) return parts[i].substring(key.length + 1);
    }
    return "";
  }
  try {
    var v = getParam(location.hash, "qb_voice");
    if (v) {
      localStorage.setItem("qb_voice", decodeURIComponent(escape(atob(v))));
      setTimeout(function () { alert("✅ 语音配置已自动导入并保存！现在可以开始语音通话面试了。"); }, 300);
    }
    var a = getParam(location.hash, "qb_ai");
    if (a) {
      localStorage.setItem("qb_ai", decodeURIComponent(escape(atob(a))));
      setTimeout(function () { alert("✅ AI 配置已自动导入并保存！模拟面试将启用 AI 现场判题与追问，可一键收录新题。"); }, 600);
    }
    if (v || a) history.replaceState(null, "", location.pathname);
  } catch (e) {}
})();
function hashImportRetry() {
  try {
    var v = (function (h, key) { var s = (h || "").replace(/^#/, ""); var ps = s.split("&"); for (var i = 0; i < ps.length; i++) if (ps[i].indexOf(key + "=") === 0) return ps[i].substring(key.length + 1); return ""; })(location.hash, "qb_voice");
    if (v && !localStorage.getItem("qb_voice")) { localStorage.setItem("qb_voice", decodeURIComponent(escape(atob(v)))); setTimeout(function () { alert("✅ 语音配置已自动导入并保存！"); }, 300); }
    var a = (function (h, key) { var s = (h || "").replace(/^#/, ""); var ps = s.split("&"); for (var i = 0; i < ps.length; i++) if (ps[i].indexOf(key + "=") === 0) return ps[i].substring(key.length + 1); return ""; })(location.hash, "qb_ai");
    if (a && !localStorage.getItem("qb_ai")) { localStorage.setItem("qb_ai", decodeURIComponent(escape(atob(a)))); setTimeout(function () { alert("✅ AI 配置已自动导入并保存！"); }, 600); }
    if (v || a) history.replaceState(null, "", location.pathname);
  } catch (e) {}
}
window.addEventListener("hashchange", hashImportRetry);
var QDATA = QDATA || {};
var CATS = [
  { id: "linux", icon: "🐧", name: "Linux 与 Shell" },
  { id: "git", icon: "🔀", name: "Git 与 GitLab" },
  { id: "cicd", icon: "⚙️", name: "CI/CD 与 Jenkins" },
  { id: "docker", icon: "🐳", name: "Docker 与 Compose" },
  { id: "nginx", icon: "🌐", name: "Nginx" },
  { id: "mysql", icon: "🗄️", name: "MySQL 与高可用" },
  { id: "redis", icon: "⚡", name: "Redis 与高可用" },
  { id: "java", icon: "🍃", name: "Spring Boot / Java" },
  { id: "jvm", icon: "☕", name: "JVM" },
  { id: "network", icon: "🌍", name: "计算机网络" },
  { id: "monitor", icon: "📊", name: "监控体系" },
  { id: "security", icon: "🔒", name: "安全与规范" },
  { id: "k8s", icon: "🚢", name: "容器化 / K8s" },
  { id: "project", icon: "📋", name: "项目综合 / 场景 / HR" }
];
var TAG_NAME = { practice: "实操", theory: "原理", project: "项目", troubleshoot: "排障", hr: "软技能" };
var PRI_NAME = { 5: "必考", 4: "高频", 3: "中频", 2: "了解", 1: "加分" };
var MODE = "browse";
var state = null;
var currentQuiz = null;   // 当前小测题目列表 [{cid,idx,score,pass}]
var currentInterview = null; // 当前面试 {questions:[{cid,idx,score,note}], pos}

function loadState() {
  try {
    var s = JSON.parse(localStorage.getItem("qb_state"));
    if (s && s.progress) return s;
  } catch (e) {}
  return { progress: {}, wrong: [], quiz: [], interview: [], study: {} };
}
function saveState() { localStorage.setItem("qb_state", JSON.stringify(state)); }
function qid(cid, idx) { return cid + ":" + idx; }
function stOf(cid, idx) { return state.progress[qid(cid, idx)] || 0; }

/* ============ 扩展题库（AI 收录的新题，存 localStorage） ============ */
function loadExt() { try { return JSON.parse(localStorage.getItem("qb_ext") || "[]"); } catch (e) { return []; } }
function saveExt(list) { localStorage.setItem("qb_ext", JSON.stringify(list)); }
function extOfCid(cid) { return loadExt().filter(function (e) { return e.cid === cid; }); }
function extCountAll() { return loadExt().length; }

/* ============ 学习打卡 & 统计面板 ============ */
function todayKey() {
  var d = new Date(), m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (dd < 10 ? "0" + dd : dd);
}
function markStudy(type) {
  if (!state.study) state.study = {};
  var k = todayKey();
  if (!state.study[k]) state.study[k] = { open: 0, quiz: 0, wrong: 0, iv: 0 };
  state.study[k][type] = (state.study[k][type] || 0) + 1;
  saveState();
  var sp = document.getElementById("studyPanel");

function studyStreak() {
  var keys = Object.keys(state.study || {}).sort().reverse();
  var streak = 0;
  var cursor = new Date();
  for (var i = 0; i < keys.length; i++) {
    var want = cursor.getFullYear() + "-" + ((cursor.getMonth() + 1) < 10 ? "0" + (cursor.getMonth() + 1) : (cursor.getMonth() + 1)) + "-" + (cursor.getDate() < 10 ? "0" + cursor.getDate() : cursor.getDate());
    if (keys[i] === want) { streak++; cursor.setDate(cursor.getDate() - 1); }
    else if (keys[i] < want) break;
  }
  return streak;
}
function renderStudyPanel() {

function starHtml(s) {
  var h = '<span class="q-stars">';
  for (var i = 0; i < 5; i++) h += i < s ? '<span class="filled">★</span>' : '<span class="empty">☆</span>';
  return h + '</span>';
}
function tagHtml(tags) {
  var h = '';
  for (var i = 0; i < tags.length; i++) h += '<span class="q-tag tag-' + tags[i] + '">' + (TAG_NAME[tags[i]] || tags[i]) + '</span>';
  return h;
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function hl(text, term) {
  if (!term) return esc(text);
  var t = esc(text), tl = t.toLowerCase(), q = String(term).toLowerCase();
  var idx = tl.indexOf(q);
  if (idx < 0) return t;
  return t.slice(0, idx) + "<mark>" + t.slice(idx, idx + term.length) + "</mark>" + t.slice(idx + term.length);
}
function answerHtml(a) {
  a = String(a);
  a = a.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  a = a.replace(/`([^`]+)`/g, "<code>$1</code>");
  var paras = a.split(/\n\n+/);
  var h = '';
  for (var i = 0; i < paras.length; i++) {
    var p = paras[i];
    if (p.indexOf("- ") === 0) {
      var items = p.split(/\n(?=- )/);
      h += '<ul>';
      for (var j = 0; j < items.length; j++) h += '<li>' + items[j].replace(/^- /, "") + '</li>';
      h += '</ul>';
    } else {
      h += '<p>' + p.replace(/\n/g, "<br>") + '</p>';
    }
  }
  return h;
}
function catName(cid) {
  for (var i = 0; i < CATS.length; i++) if (CATS[i].id === cid) return CATS[i].name;
  return cid;
}

function saveFilters() {
  try {
    var f = { star: "all", status: "all", tags: [], src: "all", term: "" };
    var sf = document.querySelector(".filter-btn[data-filter].active");
    if (sf) f.star = sf.dataset.filter;
    var stf = document.querySelector(".filter-btn[data-status].active");
    if (stf) f.status = stf.dataset.status;
    Array.prototype.forEach.call(document.querySelectorAll(".filter-btn[data-tag].active"), function (b) { f.tags.push(b.dataset.tag); });
    var srf = document.querySelector(".filter-btn[data-src].active");
    if (srf) f.src = srf.dataset.src;
    var sb = document.getElementById("searchBox");
    if (sb) f.term = sb.value;
    localStorage.setItem("qb_filters", JSON.stringify(f));
  } catch (e) {}
}
function restoreFilters() {
  try {
    var f = JSON.parse(localStorage.getItem("qb_filters") || "null");
    if (!f) return;
    Array.prototype.forEach.call(document.querySelectorAll(".filter-btn"), function (b) {
      b.classList.remove("active");
      if (b.dataset.filter && b.dataset.filter === f.star) b.classList.add("active");
      if (b.dataset.status && b.dataset.status === f.status) b.classList.add("active");
      if (b.dataset.tag && f.tags && f.tags.indexOf(b.dataset.tag) >= 0) b.classList.add("active");
      if (b.dataset.src && f.src && b.dataset.src === f.src) b.classList.add("active");
    });
    var sb = document.getElementById("searchBox");
    if (sb && f.term) sb.value = f.term;
  } catch (e) {}
}
function renderCards() {
  restoreFilters();
  var starFilter = "all";
  var sf = document.querySelector(".filter-btn[data-filter].active");
  if (sf) starFilter = sf.dataset.filter;
  var statusFilter = "all";
  var stf = document.querySelector(".filter-btn[data-status].active");
  if (stf) statusFilter = stf.dataset.status;
  var activeTags = [];
  Array.prototype.forEach.call(document.querySelectorAll(".filter-btn[data-tag].active"), function (b) { activeTags.push(b.dataset.tag); });
  var srcFilter = "all";
  var srcf = document.querySelector(".filter-btn[data-src].active");
  if (srcf) srcFilter = srcf.dataset.src;
  var term = document.getElementById("searchBox").value.toLowerCase().trim();
  var main = document.getElementById("mainContent");
  var html = "", visible = 0;
  var extAll = loadExt();
  for (var i = 0; i < CATS.length; i++) {
    var cid = CATS[i].id, c = CATS[i], list = QDATA[cid] || [];
    var extList = extAll.filter(function (e) { return e.cid === cid; });
    if (!list.length && !extList.length) continue;
    var catVisible = 0, catHtml = "";
    if (srcFilter !== "ext") {
      for (var j = 0; j < list.length; j++) {
        var q = list[j], show = true, st = stOf(cid, j);
        if (starFilter !== "all" && String(q.s) !== starFilter) show = false;
        if (show && statusFilter !== "all" && String(st) !== statusFilter) show = false;
        if (show && activeTags.length) {
          var hit = false;
          for (var k = 0; k < activeTags.length; k++) if ((q.t || []).indexOf(activeTags[k]) >= 0) hit = true;
          if (!hit) show = false;
        }
        if (show && term) {
          var hay = (q.q + " " + (q.a || "") + " " + (q.c || "")).toLowerCase();
          if (hay.indexOf(term) < 0) show = false;
        }
        if (show) { catHtml += cardHtml(cid, q, j, term); catVisible++; visible++; }
      }
    }
    for (var e = 0; e < extList.length; e++) {
      var ex = extList[e], show2 = true, est = state.progress["ext:" + ex.id] || 0;
      if (starFilter !== "all" && String(ex.s) !== starFilter) show2 = false;
      if (show2 && statusFilter !== "all" && String(est) !== statusFilter) show2 = false;
      if (show2 && activeTags.length) {
        var hit2 = false;
        for (var k2 = 0; k2 < activeTags.length; k2++) if ((ex.t || []).indexOf(activeTags[k2]) >= 0) hit2 = true;
        if (!hit2) show2 = false;
      }
      if (show2 && term) {
        var hay2 = (ex.q + " " + (ex.a || "")).toLowerCase();
        if (hay2.indexOf(term) < 0) show2 = false;
      }
      if (show2) { catHtml += cardHtmlExt(ex, term); catVisible++; visible++; }
    }
    if (catVisible) {
      html += '<section class="category" id="' + cid + '">' +
        '<div class="category-header"><span class="category-icon">' + c.icon + '</span>' +
        '<h2 class="category-title">' + c.name + '</h2><span class="category-count">' + catVisible + ' 题</span></div>' +
        catHtml + '</section>';
    }
  }
  main.innerHTML = html || '<p style="padding:40px;text-align:center;color:#718096">没有匹配的题目，换个筛选条件试试</p>';
  document.getElementById("resultCount").textContent = "显示 " + visible + "/" + totalCount() + " 题";
}

function doStartQuiz(all) {

  document.getElementById("quizArea").innerHTML = html;

    qs += '<div class="quiz-q"><div class="quiz-q-title">' + (m + 1) + '. ' + esc(q.q) + ' <span style="font-size:12px;color:#718096">[' + catName(c.cid) + ']</span></div>' +
      '<textarea class="quiz-answer-input" id="qa_' + m + '" placeholder="在这里写下你的回答..."></textarea>' +
      '<div class="quiz-ref" id="qr_' + m + '">' + answerHtml(q.c || q.a) + '</div>' +
      '<div class="quiz-grade" id="qg_' + m + '">' +
        '<span class="grade-label">AI/自评得分(0-10)：</span><input type="number" class="grade-score" id="qs_' + m + '" min="0" max="10" value="5">' +
        '<button class="ai-judge-btn" id="aj_' + m + '" onclick="aiJudgeQuiz(' + m + ')">🤖 AI 判题</button>' +
        '<span class="grade-result" id="qres_' + m + '"></span>' +
        '<div class="ai-judge-out" id="ajout_' + m + '" style="display:none"></div>' +
      '</div></div>';
  }
  document.getElementById("quizQs").innerHTML = qs;
}
function aiJudgeQuiz(m) {
  var out = document.getElementById("ajout_" + m);
  var btn = document.getElementById("aj_" + m);
  if (!out || !btn) return;
  var cfg = getAiConfig();
  if (!cfg || !cfg.url) {
    out.style.display = "block";
    out.className = "ai-judge-out ai-judge-err";
    out.textContent = "尚未配置 AI 接口：去「🎤 模拟面试」页底部「⚙️ 配置 AI 接口」，填入 DeepSeek 等 OpenAI 兼容接口的地址与 Key，就能自动判题打分。";
    return;
  }
  if (!currentQuiz || !currentQuiz[m]) return;
  var ansEl = document.getElementById("qa_" + m);
  var ans = ansEl ? ansEl.value.trim() : "";
  if (!ans) {
    out.style.display = "block";
    out.className = "ai-judge-out ai-judge-err";
    out.textContent = "先在上方写下你的回答，再点 AI 判题。";
    return;
  }
  btn.disabled = true; btn.textContent = "🤖 判题中…";
  out.style.display = "block";
  out.className = "ai-judge-out";
  out.textContent = "AI 正在评分…（需几秒）";
  callAI(cfg, currentQuiz[m], ans, function (ev) {
    var sc = document.getElementById("qs_" + m);
    if (sc) sc.value = ev.score;
    out.textContent = "🤖 AI 评分：" + ev.score + "/10" + (ev.comment ? "\n" + ev.comment : "");
    btn.disabled = false; btn.textContent = "🤖 AI 判题";
  }, function () {
    out.textContent = "AI 判题失败（接口/网络问题），请重试或手动评分。";
    out.className = "ai-judge-out ai-judge-err";
    btn.disabled = false; btn.textContent = "🤖 AI 判题";
  });
}
function submitQuiz() {
  if (!currentQuiz) return;
  for (var i = 0; i < currentQuiz.length; i++) {
    document.getElementById("qr_" + i).classList.add("show");
    document.getElementById("qg_" + i).classList.add("show");
  }
  var btn = document.querySelector("#quizArea .btn-primary");
  if (btn) btn.style.display = "none";
  var saveBtn = '<div style="margin-top:14px"><button class="btn btn-success" onclick="saveQuiz()">💾 保存小测成绩（并更新进度/错题集）</button></div>';
  document.getElementById("quizArea").innerHTML += saveBtn;
}
function saveQuiz() {
  if (!currentQuiz) return;
  var items = [], total = 0, denom = 0, bonusGot = 0, bonusMiss = 0;
  var now = new Date().toLocaleString();
  for (var i = 0; i < currentQuiz.length; i++) {
    var c = currentQuiz[i], id = qid(c.cid, c.idx);
    var qq = QDATA[c.cid][c.idx];
    var isBonus = qq.s === 1;
    var scEl = document.getElementById("qs_" + i);
    var score = scEl ? Math.max(0, Math.min(10, parseInt(scEl.value, 10) || 0)) : 5;
    var pass = score >= 6;
    if (isBonus) {
      // 加分题：答好(≥7) +1 奖励；答不好不扣分（进错题集复习，标注超纲）
      if (score >= 7) { total++; bonusGot++; }
      else { bonusMiss++; }
      items.push({ id: id, cid: c.cid, idx: c.idx, q: qq.q, score: score, pass: pass, bonus: true });
      if (pass) {
        if ((state.progress[id] || 0) < 2) { state.progress[id] = 2; }
      } else {
        var dupB = false;
        for (var wb = 0; wb < state.wrong.length; wb++) if (state.wrong[wb].id === id) { dupB = true; break; }
        if (!dupB) state.wrong.push({ id: id, cid: c.cid, idx: c.idx, q: qq.q, date: now, bonus: true });
        if ((state.progress[id] || 0) < 1) { state.progress[id] = 1; }
      }
      continue;
    }
    denom++;
    total += score;
    items.push({ id: id, cid: c.cid, idx: c.idx, q: qq.q, score: score, pass: pass });
    if (pass) {
      if ((state.progress[id] || 0) < 2) { state.progress[id] = 2; }
    } else {
      var dup = false;
      for (var w = 0; w < state.wrong.length; w++) if (state.wrong[w].id === id) { dup = true; break; }
      if (!dup) state.wrong.push({ id: id, cid: c.cid, idx: c.idx, q: qq.q, date: now });
      if ((state.progress[id] || 0) < 1) { state.progress[id] = 1; }
    }
  }
  var max = denom * 10;
  state.quiz.push({ date: now, items: items, total: total, max: max, pct: max ? Math.round(total / max * 100) : 100, bonusGot: bonusGot, bonusMiss: bonusMiss });
  saveState();
  markStudy("quiz");
  var ok = 0;
  for (var j = 0; j < items.length; j++) if (items[j].pass) ok++;
  document.getElementById("quizArea").innerHTML =
    '<div class="toolbox"><h2>✅ 小测完成</h2>' +
    '<p>得分：<b>' + total + '</b> / ' + max + (max ? '（' + (Math.round(total / max * 100)) + '%）' : '') + '，合格 ' + ok + ' 题，进入错题集 ' + (items.length - ok) + ' 题' +
    (bonusGot ? '，🎁 加分题答好 +' + bonusGot + ' 分' : '') + (bonusMiss ? '，超纲题未答 ' + bonusMiss + ' 道（正常，不扣分）' : '') + '。</p>' +
    '<p style="font-size:13px;color:#718096">合格题已标记为「已掌握」，不合格题已记入错题集。🎁 加分题 = 超纲题，答出加分、答不出不扣分。你可以去「错题集」查看或重新抽测。</p>' +
    '<button class="btn btn-primary" onclick="renderQuizMain(document.getElementById(\'mainContent\'))">再测一轮</button></div>';
  currentQuiz = null;
  renderAll();
}

/* ================= 模拟面试 ================= */
function renderInterviewMain(main) {
  var html = '<div class="toolbox"><h2>🎤 模拟面试</h2>' +
    '<p><b>建议流程：</b>在豆包对话中对我说「开始模拟面试」，我会扮演面试官，按你的简历逐题提问、根据你的回答追问深挖，并在面试结束后给出每题得分和整体报告。这里提供的是「面试题单生成器」和「成绩记录表」。</p>' +
    '<button class="btn btn-primary" onclick="startInterview()">📋 生成一套模拟面试题单（10题）</button> ' +
    '<button class="btn" onclick="switchMode(\'history\')">查看历史面试报告</button></div>' +
    '<div id="ivArea"></div>';
  main.innerHTML = html;
}
function startInterview() {
  var perCat = {};
  for (var i = 0; i < CATS.length; i++) {
    var cid = CATS[i].id, list = QDATA[cid] || [], arr = [];
    for (var j = 0; j < list.length; j++) {
      var q = list[j];
      var s = q.s * 10 + ((q.t || []).indexOf("project") >= 0 ? 4 : 0) + ((q.t || []).indexOf("troubleshoot") >= 0 ? 3 : 0) + ((q.t || []).indexOf("practice") >= 0 ? 2 : 0);
      arr.push({ cid: cid, idx: j, s: s });
    }
    arr.sort(function (a, b) { return b.s - a.s; });
    perCat[cid] = arr;
  }
  var cids = Object.keys(perCat);
  var chosen = [], used = {}, round = 0;
  while (chosen.length < 10) {
    var progressed = false;
    for (var k = 0; k < cids.length; k++) {
      var cc = cids[k];
      if (perCat[cc].length <= round) continue;
      var item = perCat[cc][round], id = qid(cc, item.idx);
      if (used[id]) continue;
      used[id] = true; chosen.push({ cid: cc, idx: item.idx }); progressed = true;
      if (chosen.length >= 10) break;
    }
    if (!progressed) break;
    round++;
  }
  currentInterview = { questions: chosen.map(function (x) { return { cid: x.cid, idx: x.idx, score: 5, note: "" }; }), pos: 0 };
  renderInterviewQ();
}
function renderInterviewQ() {
  if (!currentInterview) return;
  var iv = currentInterview, idx = iv.pos;
  var item = iv.questions[idx], q = QDATA[item.cid][item.idx];
  var html = '<div class="toolbox"><h2>模拟面试 · 第 ' + (idx + 1) + ' / ' + iv.questions.length + ' 题</h2>' +
    '<p style="font-size:13px;color:#718096">分类：' + catName(item.cid) + ' · 星级：' + q.s + ' 星 · 建议在豆包中由 AI 面试官提问并追问，这里同步记录评分。</p></div>';
  html += '<div class="iv-question"><div class="iv-q-title">' + esc(q.q) + '</div>' +
    '<div class="iv-tag">' + tagHtml(q.t || []) + '</div>' +
    '<div class="iv-hint">💡 面试官可能追问的方向：<br>' + (q.a ? esc(q.a).substring(0, 160) + "…" : "") + '</div>' +
    '<div class="iv-controls">' +
      '<span class="grade-label">得分(0-10)：</span><input type="number" class="grade-score" id="iv_score" min="0" max="10" value="' + item.score + '">' +
      '<input type="text" class="iv-note" id="iv_note" placeholder="备注（AI 反馈 / 答不上的点）" value="">' +
    '</div></div>';
  html += '<div style="display:flex;gap:10px">';
  if (idx > 0) html += '<button class="btn" onclick="gotoIv(-1)">← 上一题</button>';
  if (idx < iv.questions.length - 1) html += '<button class="btn btn-primary" onclick="gotoIv(1)">保存并下一题 →</button>';
  else html += '<button class="btn btn-success" onclick="finishInterview()">🏁 完成面试并生成报告</button>';
  html += '</div>';
  document.getElementById("ivArea").innerHTML = html;
}
function gotoIv(d) {
  if (!currentInterview) return;
  var item = currentInterview.questions[currentInterview.pos];
  var sc = document.getElementById("iv_score");
  var nt = document.getElementById("iv_note");
  if (sc) item.score = Math.max(0, Math.min(10, parseInt(sc.value, 10) || 0));
  if (nt) item.note = nt.value;
  currentInterview.pos += d;
  renderInterviewQ();
}
function finishInterview() {
  if (!currentInterview) return;
  var iv = currentInterview;
  var last = iv.questions[iv.pos];
  var sc = document.getElementById("iv_score");
  var nt = document.getElementById("iv_note");
  if (sc) last.score = Math.max(0, Math.min(10, parseInt(sc.value, 10) || 0));
  if (nt) last.note = nt.value;
  var total = 0;
  for (var i = 0; i < iv.questions.length; i++) total += iv.questions[i].score;
  var avg = Math.round(total / iv.questions.length * 10) / 10;
  // 找弱项分类
  var catScores = {};
  for (var j = 0; j < iv.questions.length; j++) {
    var it = iv.questions[j];
    if (!catScores[it.cid]) catScores[it.cid] = { sum: 0, n: 0 };
    catScores[it.cid].sum += it.score; catScores[it.cid].n++;
  }
  var weak = [];
  for (var cid in catScores) if (catScores[cid].sum / catScores[cid].n < 6) weak.push(catName(cid));
  var report = { date: new Date().toLocaleString(), questions: iv.questions.map(function (x) { return { id: qid(x.cid, x.idx), q: QDATA[x.cid][x.idx].q, score: x.score }; }), total: total, max: iv.questions.length * 10, avg: avg, weak: weak };
  state.interview.push(report);
  saveState();
  markStudy("iv");
  var rows = "";
  for (var m = 0; m < report.questions.length; m++) {
    rows += '<tr><td>' + (m + 1) + '</td><td>' + esc(report.questions[m].q) + '</td><td>' + report.questions[m].score + '</td></tr>';
  }
  document.getElementById("ivArea").innerHTML =
    '<div class="toolbox"><h2>🏁 面试完成 · 报告已保存</h2>' +
    '<p>总分：<b>' + total + '</b> / ' + report.max + '（平均 ' + avg + ' 分/题）</p>' +
    '<p>待加强分类：' + (weak.length ? weak.join("、") : "无（整体表现良好）") + '</p>' +
    '<table class="score-table"><tr><th>#</th><th>题目</th><th>得分</th></tr>' + rows + '</table>' +
    '<p style="font-size:13px;color:#718096">建议：得分 <6 的题进入「刷题」模式重点复习；也可以去「历史记录」回看报告。</p>' +
    '<button class="btn btn-primary" onclick="renderInterviewMain(document.getElementById(\'mainContent\'))">再来一场</button></div>';
  currentInterview = null;
  renderAll();
}

/* ================= 错题集 ================= */
function renderWrongMain(main) {
  var html = '<div class="toolbox"><h2>❌ 错题集（' + state.wrong.length + ' 题）</h2>' +
    '<p>小测中不合格的题目会自动进入这里。可以「重测错题」或确认掌握后移除。</p>' +
    (state.wrong.length ? '<button class="btn btn-primary" onclick="retestWrong()">🎯 重测错题（抽 5 题）</button>' : '') + '</div><div id="wrongList"></div>';
  main.innerHTML = html;
  var list = document.getElementById("wrongList");
  if (!state.wrong.length) { list.innerHTML = '<p class="history-empty">暂无错题，去「随机小测」测一轮吧</p>'; return; }
  var h = "";
  for (var i = 0; i < state.wrong.length; i++) {
    var w = state.wrong[i];
    h += '<div class="wrong-item"><span class="wq">' + esc(w.q) + '</span>' +
      '<button class="btn" onclick="toggleWrongAnswer(this)">查看答案</button>' +
      '<button class="btn btn-success" onclick="masterWrong(\'' + w.cid + '\',' + w.idx + ')">已掌握，移除</button></div>' +
      '<div class="quiz-ref" style="margin-bottom:8px">' + answerHtml(QDATA[w.cid][w.idx].a) + '</div>';
  }
  list.innerHTML = h;
}
function toggleWrongAnswer(btn) {
  var ref = btn.parentElement.nextElementSibling;
  if (ref) ref.classList.toggle("show");
}
function masterWrong(cid, idx) {
  var id = qid(cid, idx);
  state.progress[id] = 2;
  state.wrong = state.wrong.filter(function (w) { return w.id !== id; });
  saveState();
  renderWrongMain(document.getElementById("mainContent"));
  renderAll();
}
function retestWrong() {
  if (!state.wrong.length) return;
  var pool = state.wrong.slice();
  for (var k = pool.length - 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)); var tmp = pool[k]; pool[k] = pool[r]; pool[r] = tmp; }
  var picked = pool.slice(0, Math.min(5, pool.length)).map(function (w) { return { cid: w.cid, idx: w.idx }; });
  currentQuiz = picked;
  var html = '<div class="toolbox"><h2>错题重测（' + picked.length + ' 题）</h2><p>逐题作答，提交后对照答案并评分。</p><button class="btn btn-primary" onclick="submitQuiz()">✅ 提交并对照答案</button></div><div id="quizQs"></div>';
  document.getElementById("mainContent").innerHTML = html;
  var qs = "";
  for (var m = 0; m < picked.length; m++) {
    var c = picked[m], q = QDATA[c.cid][c.idx];
    qs += '<div class="quiz-q"><div class="quiz-q-title">' + (m + 1) + '. ' + esc(q.q) + '</div>' +
      '<textarea class="quiz-answer-input" id="qa_' + m + '" placeholder="在这里写下你的回答..."></textarea>' +
      '<div class="quiz-ref" id="qr_' + m + '">' + answerHtml(q.c || q.a) + '</div>' +
      '<div class="quiz-grade" id="qg_' + m + '">' +
        '<span class="grade-label">AI/自评得分(0-10)：</span><input type="number" class="grade-score" id="qs_' + m + '" min="0" max="10" value="5">' +
        '<button class="ai-judge-btn" id="aj_' + m + '" onclick="aiJudgeQuiz(' + m + ')">🤖 AI 判题</button>' +
        '<span class="grade-result" id="qres_' + m + '"></span>' +
        '<div class="ai-judge-out" id="ajout_' + m + '" style="display:none"></div>' +
      '</div></div>';
  }
  document.getElementById("quizQs").innerHTML = qs;
}

/* ================= 历史记录 ================= */
function renderHistoryMain(main) {
  var html = '<div class="toolbox"><h2>📊 历史记录</h2></div>';
  html += '<h3 style="margin:14px 0 8px">小测历史（' + state.quiz.length + ' 次）</h3>';
  if (!state.quiz.length) html += '<p class="history-empty">暂无小测记录</p>';
  else {
    html += '<table class="score-table"><tr><th>时间</th><th>得分</th><th>合格/总题</th><th>详情</th></tr>';
    for (var i = state.quiz.length - 1; i >= 0; i--) {
      var z = state.quiz[i], ok = 0;
      for (var j = 0; j < z.items.length; j++) if (z.items[j].pass) ok++;
      var det = "";
      for (var m = 0; m < z.items.length; m++) det += (z.items[m].pass ? "✅" : "❌") + " " + esc(z.items[m].q).substring(0, 28) + "（" + z.items[m].score + "分）<br>";
      html += '<tr><td>' + z.date + '</td><td>' + z.total + '/' + z.max + '（' + z.pct + '%）</td><td>' + ok + '/' + z.items.length + '</td><td style="font-size:12px">' + det + '</td></tr>';
    }
    html += '</table>';
  }
  html += '<h3 style="margin:20px 0 8px">模拟面试报告（' + state.interview.length + ' 场）</h3>';
  if (!state.interview.length) html += '<p class="history-empty">暂无面试记录</p>';
  else {
    html += '<table class="score-table"><tr><th>时间</th><th>总分</th><th>平均分</th><th>待加强</th></tr>';
    for (var i = state.interview.length - 1; i >= 0; i--) {
      var iv = state.interview[i];
      html += '<tr><td>' + iv.date + '</td><td>' + iv.total + '/' + iv.max + '</td><td>' + iv.avg + '</td><td>' + (iv.weak.length ? iv.weak.join("、") : "无") + '</td></tr>';
    }
    html += '</table>';
  }
  html += '<div style="margin-top:16px"><button class="btn btn-warn" onclick="clearHistory()">🗑 清空全部历史（进度保留）</button></div>';
  main.innerHTML = html;
}
function clearHistory() {
  if (!confirm("确定清空小测历史和面试报告吗？学习进度会保留。")) return;
  state.quiz = []; state.interview = [];
  saveState();
  renderHistoryMain(document.getElementById("mainContent"));
}

/* ================= 事件绑定 ================= */
document.querySelectorAll(".filter-btn[data-filter]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".filter-btn[data-filter]").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    saveFilters();
    renderCards();
  });
});
document.querySelectorAll(".filter-btn[data-status]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".filter-btn[data-status]").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    saveFilters();
    renderCards();
  });
});
document.querySelectorAll(".filter-btn[data-tag]").forEach(function (btn) {
  btn.addEventListener("click", function () { btn.classList.toggle("active"); saveFilters(); renderCards(); });
});
document.querySelectorAll(".filter-btn[data-src]").forEach(function (btn) {
  btn.addEventListener("click", function () { btn.classList.toggle("active"); saveFilters(); renderCards(); });
});
document.getElementById("searchBox").addEventListener("input", function () { saveFilters(); renderCards(); });

state = loadState();
if (!state.study) state.study = {};
markStudy("open");
</script>
<style>

          typing(false);
          var b2 = document.getElementById("ivSend"); if (b2) b2.disabled = false;
          return;
        }
        cur.score = Math.round(Math.max.apply(null, iv.mainScores) * 2) / 2;
        addSys(cm);
        addMsg("ai", commentFor(cur.score) + " 本题得分：" + cur.score + "/10。");
        setTimeout(function () { nextMain(); }, 900);
      };
      if (cur.fu < 2 && ev.score >= 7) {
        var doFollow = function (f) {
          if (!f) return false;
          cur.fu++;
          if (f.ai) {
            iv.followQ = { cid: f.cid, idx: f.idx, qText: f.qText, ai: true };
            addSys(cm + "，答得不错，我再深入一点：");
            addMsg("ai", "追问：" + f.qText);
            appendFollowUpBtns(f.cid, f.qText);
          } else {
            iv.usedIds[qid(f.cid, f.idx)] = true;
            iv.followQ = f;
            addSys(cm + "，答得不错，我再深入一点：");
            addMsg("ai", "追问：" + QDATA[f.cid][f.idx].q);
          }
          typing(false);
          var b1 = document.getElementById("ivSend"); if (b1) b1.disabled = false;
          return true;
        };
        var curPos = iv.pos;
        var aiCfg2 = getAiConfig();
        if (aiCfg2 && aiCfg2.url) {
          askAIFollowUp(aiCfg2, cur, text, aiCfg2.style || "strict", function (qText) {
            if (!ivState || ivState.pos !== curPos) return;
            if (!doFollow({ cid: cur.cid, idx: cur.idx, qText: qText, ai: true })) finishCur();
          }, function () {
            if (!ivState || ivState.pos !== curPos) return;
            if (!doFollow(pickFollowUp(cur.cid, iv.usedIds))) finishCur();
          });
          return;
        }
        if (doFollow(pickFollowUp(cur.cid, iv.usedIds))) return;
      }
      finishCur();
    }
  };
  if (cfg && cfg.url) {

  } else {
    doEval(evalAnswer(cur, text));
  }
}
function askAIFollowUp(cfg, cur, text, style, ok, fail) {
  var q = QDATA[cur.cid][cur.idx];
  var prompt = (AI_STYLE_PROMPT[style] || AI_STYLE_PROMPT.strict) + "\n面试题：" + q.q + "\n候选人的回答：" + text + "\n请基于候选人的回答提出 1 个更深入的追问（候选人是应届运维/DevOps，追问要贴合真实运维场景、戳到他可能的薄弱点，不要问题库里现成答案的题）。只输出追问本身，不要序号、引号或多余文字。";
  fetch(cfg.url, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key }, body: JSON.stringify({ model: cfg.model || "deepseek-chat", messages: [{ role: "user", content: prompt }], temperature: 0.7, max_tokens: 200 }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var c = ((d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "").trim();
      if (c && c.length > 4) ok(c);
      else fail();
    })
    .catch(function () { fail(); });
}
function appendFollowUpBtns(cid, qText) {

  if (!msgs.length) return;
  var last = msgs[msgs.length - 1];
  var safe = String(qText).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;");
  var div = document.createElement("div");
  div.style.cssText = "margin-top:6px;text-align:right";
  div.innerHTML = '<button class="ai-judge-btn" onclick="openExtModal(\'' + cid + '\',\'' + safe + '\')">🔖 收录为新题</button>';
  last.appendChild(div);
}
function openExtModal(defCid, qText) {

  for (var s = 5; s >= 1; s--) stars += '<option value="' + s + '"' + (s === 2 ? " selected" : "") + '>' + s + ' 星' + (PRI_NAME[s] ? "（" + PRI_NAME[s] + "）" : "") + '</option>';
  var ov = document.createElement("div");

  ov.innerHTML = '<div style="background:#fff;border-radius:12px;max-width:560px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2);box-sizing:border-box">' +
    '<h3 style="margin:0 0 8px;font-size:16px">🔖 收录为新题</h3>' +
    '<p style="font-size:13px;color:#2D3748;background:#EDF2F7;border-radius:8px;padding:10px;margin:0 0 12px">' + esc(qText) + '</p>' +
    '<label style="font-size:13px;color:#4A5568">分类</label><select id="emCat" style="width:100%;margin-bottom:10px">' + opts + '</select>' +
    '<label style="font-size:13px;color:#4A5568">星级</label><select id="emStar" style="width:100%;margin-bottom:10px">' + stars + '</select>' +
    '<label style="font-size:13px;color:#4A5568">参考答案（可让 AI 生成）</label><textarea id="emAns" rows="4" placeholder="填写这题的参考答案要点..." style="width:100%;margin-bottom:6px;box-sizing:border-box"></textarea>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">' +
      '<button class="btn" onclick="emAiGen()">🤖 AI 生成答案</button>' +

      '<button class="btn" onclick="closeExtModal()">取消</button>' +
    '</div></div>';
  document.body.appendChild(ov);
  window._emQ = qText;

function closeExtModal() { var m = document.getElementById("extModal"); if (m) m.remove(); }
function emAiGen() {
  var cfg = getAiConfig();
  var ta = document.getElementById("emAns");
  if (!cfg || !cfg.url) { if (ta) ta.value = "（未配置 AI 接口，无法生成；可手动填写要点）"; return; }
  if (ta) ta.value = "AI 生成中…";
  var qText = window._emQ || "";
  var prompt = "你是资深运维工程师。请为面试题《" + qText + "》写一份简洁的参考答案要点（3-6 条，每条一句话，面向应届运维/DevOps 岗位）。只输出要点，每条以 - 开头。";
  fetch(cfg.url, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key }, body: JSON.stringify({ model: cfg.model || "deepseek-chat", messages: [{ role: "user", content: prompt }], temperature: 0.4, max_tokens: 400 }) })

function saveExtFromModal() {

  renderAll();
  if (MODE === "browse") renderCards();

function pickFollowUp(cid, usedIds) {
  var cats = REL_CAT[cid] || [cid];
  for (var i = 0; i < cats.length; i++) {
    var list = QDATA[cats[i]] || [], best = null;
    for (var j = 0; j < list.length; j++) {
      var id = qid(cats[i], j);
      if (usedIds[id]) continue;
      if (list[j].s >= 4 && (!best || list[j].s > best.q.s)) best = { cid: cats[i], idx: j, q: list[j] };
    }
    if (best) return best;
  }
  for (var c2 in QDATA) {
    for (var j2 = 0; j2 < QDATA[c2].length; j2++) {
      var id2 = qid(c2, j2);
      if (!usedIds[id2] && QDATA[c2][j2].s >= 4) return { cid: c2, idx: j2, q: QDATA[c2][j2] };
    }
  }
  return null;
}
function nextMain() {
  var iv = ivState;
  iv.pos++;
  iv.mainScores = [];
  iv.followQ = null;
  if (iv.pos >= iv.questions.length) {
    if (shouldEndInterview()) { finishInterview(); return; }
    var nx = takeNextFromPool();
    if (!nx) { finishInterview(); return; }
    iv.questions.push(nx);
  }
  var cur = iv.questions[iv.pos];
  cur.attempts = 0; cur.fu = 0;
  var q = QDATA[cur.cid][cur.idx];
  if (q.s === 1) addSys("🎁 这是道超纲加分题：答出亮点加分，答不出来也完全正常。");
  addMsg("ai", "第 " + (iv.pos + 1) + " 题：" + q.q + "（" + catName(cur.cid) + " · " + q.s + "星" + (q.s === 1 ? " · 🎁加分题" : "") + "）");
  var p = document.getElementById("ivProgress");
  if (p) p.textContent = "第 " + (iv.pos + 1) + " 题";
  var cp = document.getElementById("callProgress");
  if (cp) cp.textContent = "第 " + (iv.pos + 1) + " 题";
  typing(false);
  var btn = document.getElementById("ivSend"); if (btn) btn.disabled = false;
}
function takeNextFromPool() {
  var iv = ivState;
  if (!iv.pool || !iv.pool.length) return null;
  // 表现惊艳时优先给加分题（超纲试顶）
  if (iv.pos >= 7 && iv.bonusAsked < 2 && iv.bonusPool && iv.bonusPool.length) {
    var bi = iv.bonusPool.shift();
    iv.bonusAsked++;
    iv.usedIds[qid(bi.cid, bi.idx)] = true;
    return { cid: bi.cid, idx: bi.idx, score: null, attempts: 0, fu: 0 };
  }
  var item = iv.pool.shift();
  iv.usedIds[qid(item.cid, item.idx)] = true;
  return { cid: item.cid, idx: item.idx, score: null, attempts: 0, fu: 0 };
}
function shouldEndInterview() {
  var iv = ivState;
  // 硬下限：前 minMain 题必问（pos 从 0 数）
  if (iv.pos < iv.minMain - 1) return false;
  // 硬上限：题数 12 或通话 30 分钟
  if (iv.pos >= iv.maxMain - 1) { iv.endReason = "时长"; return true; }
  if (Call.active && Date.now() - iv.startedAt > 30 * 60 * 1000) { iv.endReason = "时间"; return true; }
  var answered = [];
  for (var i = 0; i < iv.questions.length; i++) if (typeof iv.questions[i].score === "number") answered.push(iv.questions[i]);
  if (!answered.length) return false;
  var sum = 0;
  for (var j = 0; j < answered.length; j++) sum += answered[j].score;
  var avg = sum / answered.length;
  // 表现好且题量足够 → 收尾；表现差 → 提前收尾；到 10 题自然收尾
  if (avg >= 7.5 && iv.pos >= 8) { iv.endReason = "表现好"; return true; }
  if (avg < 5 && iv.pos >= 6) { iv.endReason = "表现欠佳"; return true; }
  if (iv.pos >= 10) { iv.endReason = "常规"; return true; }
  return false;
}
function finishInterview() {
  var iv = ivState, total = 0, denom = 0, bonusGot = 0, bonusTotal = 0;
  var catScores = {};
  for (var i = 0; i < iv.questions.length; i++) {
    var it = iv.questions[i];
    var isBonus = QDATA[it.cid][it.idx].s === 1;
    var sc = it.score || 0;
    if (isBonus) {
      bonusTotal++;
      if (sc >= 7) { bonusGot++; total++; }
    } else {
      denom++;
      total += sc;
      if (!catScores[it.cid]) catScores[it.cid] = { sum: 0, n: 0 };
      catScores[it.cid].sum += sc; catScores[it.cid].n++;
    }
  }
  var weak = [];
  for (var cid in catScores) if (catScores[cid].sum / catScores[cid].n < 6) weak.push(catName(cid));
  var avg = denom ? Math.round(total / denom * 10) / 10 : 0;
  var report = { date: new Date().toLocaleString(), questions: iv.questions.map(function (x) { return { id: qid(x.cid, x.idx), q: QDATA[x.cid][x.idx].q, score: x.score, bonus: QDATA[x.cid][x.idx].s === 1 }; }), total: total, max: denom * 10, avg: avg, weak: weak, bonusGot: bonusGot, bonusTotal: bonusTotal, asked: iv.questions.length, endReason: iv.endReason || "natural" };
  state.interview.push(report);
  saveState();
  markStudy("iv");
  var bonusTxt = (bonusTotal ? "，🎁 加分题答好 +" + bonusGot + " 分（共问 " + bonusTotal + " 道超纲题，答不出正常）" : "");
  var endTxt = "面试结束！共问 " + iv.questions.length + " 题。总分 " + total + "/" + report.max + "，平均 " + avg + " 分/题。" + (weak.length ? "待加强分类：" + weak.join("、") + "。" : "整体表现良好。") + bonusTxt;
  if (Call.active) {
    Call.finishing = true;
    addMsg("ai", "我这边问题问得差不多了，今天这场就到这里。");
    addMsg("ai", endTxt);
    addMsg("ai", "报告已保存到「历史记录」。得分 <6 的题建议回到「刷题」模式重点复习。");
    ivState = null;
    return;
  }
  addMsg("ai", "我这边问题问得差不多了，今天这场就到这里。");
  addMsg("ai", endTxt);
  addMsg("ai", "报告已保存到「历史记录」。得分 <6 的题建议回到「刷题」模式重点复习。");
  var btn = document.getElementById("ivSend"); if (btn) btn.disabled = true;
  typing(false);
  var st = document.getElementById("ivStatus"); if (st) st.textContent = "面试结束 · 报告已保存";
  ivState = null;
  renderAll();
}

{"s":5,"t":["practice"],"q":"如何查看 Linux 服务器的 CPU、内存、磁盘使用情况？","a":"CPU：用 `top` 或 `htop` 看实时占用，`mpstat -P ALL 1` 看各核心分布。\n内存：`free -h` 看总量/已用/可用/buffer/cache，重点关注 available 列。\n磁盘：`df -h` 看各分区使用率，`du -sh /*` 定位大目录，`find / -type f -size +100M | xargs ls -lh` 找大文件。\n日常巡检我会写脚本定期检查这些指标，超过阈值（如磁盘 >85%）自动告警。"},
{"s":5,"t":["troubleshoot"],"q":"服务器负载过高（Load Average 很大），你怎么排查？","a":"首先看 `top` 的 Load Average（1/5/15分钟），超过 CPU 核心数×0.7 就要关注。\n其次按 `1` 展开各核心，看是 us（用户态）高还是 wa（IO等待）高。us 高就用 `ps aux --sort=-%cpu | head` 找占 CPU 最高的进程；wa 高就用 `iostat -x 1` 看哪个磁盘 IO 瓶颈。\n然后检查是否有僵尸进程（`ps aux | grep Z`）、OOM 事件（`dmesg | grep -i oom`）。\n最后看系统日志 `/var/log/messages`，结合应用日志定位根因，必要时限制进程资源或扩容。\n补充辨析：load average 三个数（1/5/15 分钟）表示运行队列中的进程总数（正在运行 + 等待 CPU + 等待 IO）。关键结论：如果负载高但 CPU 使用率低（us 不高、wa 高），说明不是计算密集而是 IO 密集——常见于磁盘 IO 瓶颈、内存不足频繁 swap、网络等待，用 iostat -x 1 或 iotop 确认。这是面试官最想听到的辨析点。"},
{"s":5,"t":["practice"],"q":"如何用 Shell 脚本实现服务的健康检查？","a":"核心思路是检测进程存活 + 端口可达 + 接口响应三层检查：\n- 进程检查：`pgrep -f java`，判断进程是否存在\n- 端口检查：`ss -tlnp | grep :8080` 或 `curl -s -o /dev/null -w \"%{http_code}\" http://localhost:8080/health`\n- 接口检查：调用健康检查接口，判断返回状态码和响应时间\n脚本配合 cron 每分钟执行，失败时通过钉钉/邮件告警，连续失败 N 次自动重启服务并记录日志。\n除了健康检查，我还写过这些自动化脚本：数据库备份脚本（每天凌晨 mysqldump 按日期备份、保留最近 7 天）、日志清理脚本（定期清理过期日志防磁盘占满）、MySQL 主从一键搭建脚本（docker exec 自动建账户 + CHANGE MASTER TO）。写脚本我一般都会加日志输出、错误判断和退出码检查，确保健壮。"},
{"s":4,"t":["practice"],"q":"grep、awk、sed 的区别和典型使用场景？","a":"grep：文本搜索过滤工具，按行匹配关键词。常用 `-r` 递归、`-i` 忽略大小写、`-v` 反向过滤、`-n` 显示行号。\nawk：列处理工具，擅长按分隔符提取字段和统计。比如 `awk '{print $1, $5}' access.log` 提取 IP 和响应大小。\nsed：行编辑工具，擅长替换、删除、插入。比如 `sed 's/old/new/g' file` 批量替换。\n实际工作中经常组合使用：grep 过滤 → awk 提取 → sort | uniq -c | sort -rn 统计排序。"},
{"s":4,"t":["practice"],"q":"如何查看某个端口被哪个进程占用？怎么杀死该进程？","a":"用 `ss -tlnp | grep :端口号` 或 `lsof -i :端口号` 查看占用进程和 PID。\n确认后 `kill PID` 优雅终止；如果无响应再 `kill -9 PID` 强制杀死。\n实际工作中要注意：先确认是不是正常业务进程，别误杀。生产环境建议先 `kill -15` 给进程一个优雅退出的机会。"},
{"s":4,"t":["practice"],"q":"Shell 脚本中 $0、$1、$?、$# 分别代表什么？","a":"`$0`：脚本名称本身；`$1 $2 ...`：第1、第2个位置参数；`$#`：参数个数；`$?`：上一条命令的退出状态码（0=成功）。\n还有 `$@`：所有参数列表；`$$`：当前 Shell 进程 PID。\n写脚本时我常用来做参数校验，比如 `if [ $# -lt 1 ]; then echo \"Usage: $0 {start|stop}\"; exit 1; fi`。"},
{"s":4,"t":["practice"],"q":"Linux 文件权限 755 代表什么？如何修改文件权限？","a":"`755` 即 `rwxr-xr-x`：文件所有者有读写执行权限，所属组和其他用户有读和执行权限。\n修改权限用 `chmod`：`chmod 755 file`（数字法）或 `chmod u+x file`（符号法）。\n修改属主用 `chown user:group file`。常见搭配：脚本/目录用 755，配置文件用 644，敏感文件用 600。"},
{"s":3,"t":["practice"],"q":"如何查看实时日志？tail -f 和 tail -F 有什么区别？","a":"`tail -f file`：实时跟踪文件末尾新增内容，文件描述符不释放。\n`tail -F file`：在 -f 基础上增加文件重建跟踪——如果文件被删除或轮转（logrotate），会自动重新打开新文件继续跟踪。\n实际排障中常用 `tail -f /var/log/messages` 或 `tail -F /opt/app/logs/app.log` 配合 grep 过滤关键字。"},
{"s":3,"t":["theory"],"q":"Linux 的进程前后台切换怎么做？nohup 和 & 有什么区别？","a":"前后台切换：`Ctrl+Z` 暂停当前前台进程，`bg` 放到后台继续运行，`fg` 拉回前台，`jobs` 查看后台任务列表。\n`&`：命令末尾加 `&` 直接在后台运行，但终端关闭后进程会被终止（收到 SIGHUP 信号）。\n`nohup`：忽略 SIGHUP 信号，终端关闭后进程继续运行。通常组合使用 `nohup command &`，输出重定向到 nohup.out。"},
{"s":2,"t":["theory"],"q":"Linux 的硬链接和软链接有什么区别？","a":"硬链接：和原文件共享同一个 inode，本质是同一个文件的多个入口。删除原文件不影响硬链接，不能跨文件系统，不能链接目录。\n软链接（符号链接）：类似 Windows 快捷方式，有独立 inode，内容是目标文件路径。可以跨文件系统、链接目录。目标删除后软链接失效（悬空链接）。\n实际中软链接用得更多，比如 `ln -s /opt/app/current /opt/app/latest` 做版本切换。"},
{"s":4,"t":["theory","troubleshoot"],"q":"top 输出里 us、sy、wa、id 分别代表什么？怎么定位 CPU 瓶颈？","a":"us：用户态 CPU 占用（应用程序）；sy：内核态 CPU 占用（系统调用、中断）；wa：IO 等待（CPU 在等磁盘/网络）；id：空闲。\n定位方法：\n- us 高：应用计算密集或死循环，用 `top -Hp PID` 看线程，`jstack` 抓 Java 线程栈定位代码\n- sy 高：系统调用/上下文切换过多，用 `vmstat 1` 看 cs（context switch）列，排查锁竞争、频繁中断\n- wa 高：磁盘 IO 瓶颈，用 `iostat -x 1` 看 %util 和 await，考虑换 SSD、加缓存、优化 SQL\n我的排查顺序：top 全局 → vmstat 看切换 → iostat 看磁盘 → ps 定位进程 → 应用层定位。"},
{"s":3,"t":["practice"],"q":"systemctl 管理服务常用的命令有哪些？服务启动失败怎么排查？","a":"常用命令：`systemctl start/stop/restart/reload 服务`、`systemctl enable/disable 服务`（开机自启）、`systemctl status 服务`、`systemctl list-units --type=service`。\n服务启动失败排查：\n1. `systemctl status 服务` 看状态和最近日志\n2. `journalctl -u 服务 -n 100 --no-pager` 看完整错误日志\n3. 检查配置文件语法（如 Nginx `nginx -t`）\n4. 检查端口是否被占用、权限是否足够\n5. `systemctl daemon-reload` 重新加载配置"},
{"s":3,"t":["practice"],"q":"crontab 定时任务怎么配置？有什么注意点？","a":"`crontab -e` 编辑当前用户的定时任务，格式为：分 时 日 月 周 命令。比如 `0 2 * * * /opt/scripts/backup.sh` 表示每天凌晨2点执行备份脚本。\n`crontab -l` 查看，`crontab -r` 删除。\n注意点：\n- 脚本里要用绝对路径，因为 cron 环境变量很少（PATH 只有 /usr/bin:/bin）\n- 脚本输出建议重定向到日志文件：`>> /var/log/backup.log 2>&1`\n- 注意时区，服务器默认 UTC 或系统时区\n- 脚本要有执行权限，且首行写 `#!/bin/bash`\n- 大量定时任务建议错开时间，避免同时执行造成资源争抢"},
{"s":3,"t":["troubleshoot"],"q":"磁盘空间还有，但报\"No space left on device\"，可能是什么原因？","a":"大概率是 inode 用完了。`df -h` 看空间，`df -i` 看 inode。\ninode 耗尽的常见原因：\n- 小文件太多（缓存目录、临时文件、日志碎片）\n- 用 `find / -xdev -type f | wc -l` 统计，`for d in /*; do echo -n \"$d \"; find $d -xdev -type f | wc -l; done` 定位目录\n- 清理：删除无用的临时文件，或对日志开启 logrotate 压缩\n另外也可能是文件被删除但进程仍占用（`lsof | grep deleted`），需要重启进程释放。"},
{"s":3,"t":["practice"],"q":"ss 和 netstat 有什么区别？怎么查看系统监听端口？","a":"ss 是 netstat 的替代品，直接读取内核 socket 信息，速度快，大连接数下优势明显，推荐优先用 ss。\n常用命令：\n- `ss -tlnp`：查看所有 TCP 监听端口及进程（t=TCP, l=监听, n=数字显示, p=进程）\n- `ss -tunap`：加 u 看 UDP\n- `netstat -tlnp`：传统命令，连接数多时慢\n排查端口占用、端口不通、服务是否监听时都靠这些命令。"},
{"s":3,"t":["theory"],"q":"僵尸进程和孤儿进程的区别？怎么处理僵尸进程？","a":"僵尸进程（Zombie）：子进程已退出但父进程没有调用 wait() 回收其状态，进程表里残留条目，不占 CPU/内存但占 PID。\n孤儿进程（Orphan）：父进程先退出，子进程被 init（PID 1）收养，不属于异常。\n处理僵尸进程：\n1. `ps aux | grep Z` 找到僵尸进程的父进程 PID\n2. 僵尸进程无法直接 kill，只能等父进程回收或杀掉父进程（由 init 收养后回收）\n3. 长期存在说明父进程代码有 bug（没 wait），反馈开发修复\n日常我用 `ps -ef | awk '$3==1 && $8 ~ /defunct/ {print}'` 快速定位。"},
{"s":3,"t":["practice"],"q":"ulimit 是什么？怎么查看和修改文件描述符限制？","a":"ulimit 用于查看/限制当前 Shell 及子进程的资源，比如最大文件描述符数（-n）、最大进程数（-u）、核心转储大小（-c）。\n查看：`ulimit -n`（当前值）、`ulimit -a`（全部）。\n修改：临时 `ulimit -n 65535`；永久在 `/etc/security/limits.conf` 写 `* soft nofile 65535` 和 `* hard nofile 65535`。\n高并发服务（Nginx/Java）都会遇到 \"too many open files\"，就是文件描述符不够，需要调大并配合 Nginx 的 `worker_rlimit_nofile`。"},
{"s":2,"t":["practice"],"q":"logrotate 是怎么实现日志轮转的？简单配置一下","a":"logrotate 按周期/大小对日志做切割、压缩、清理，防止日志无限增长占满磁盘。\n配置示例（/etc/logrotate.d/app）：\n`/opt/app/logs/*.log { daily; rotate 7; compress; missingok; notifempty; copytruncate; }`\n含义：每天轮转，保留7份，压缩旧日志，文件缺失不报错，空文件不轮转，copytruncate 用于应用不重新打开日志文件的场景（先复制再清空）。\n手工执行：`logrotate -f /etc/logrotate.d/app`。注意：Java 应用如果用 logback 自己管理滚动，就不需要 copytruncate。"},
{"s":4,"t":["practice"],"q":"你常用的 Linux 命令有哪些？","a":"按类别说，面试时这样讲最清晰：\n文件操作：ls、cd、cp、mv、rm、find（按条件找文件）\n文本处理：grep（关键字搜索）、awk（按列处理）、sed（文本替换）、vim\n系统监控：top/htop（CPU 内存）、df -h（磁盘）、free -h（内存）、ps aux（进程）\n网络：ping、curl、netstat/ss（端口）、scp（远程传文件）\n加分亮点（主动展示）：用 awk 分析 Nginx 日志统计访问量最高的 IP：awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -10","c":"常用的按类别说：\n文件：ls、cd、cp、mv、rm、find\n文本：grep、awk、sed、vim\n监控：top、df -h、free -h、ps aux\n网络：ping、curl、ss、scp\n我印象最深的一个组合：用 awk 分析 Nginx 日志，统计访问量最高的 IP——awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -10。项目上线后我用它快速看日志里有没有异常来源 IP，简单但很实用。"},
{"s":4,"t":["troubleshoot"],"q":"服务器磁盘满了怎么排查？","a":"按从大到小定位：\n①df -h 确认哪个分区满了\n②du -sh /* | sort -rh | head -10 找最大的目录\n③逐层 du 往下，定位到具体文件\n常见原因：日志没清理、大文件误存、数据库文件大、Docker 镜像/容器占用\n处理：该删的删；日志用 > file.log 清空（不要直接 rm 正在写入的日志文件，否则句柄还在、空间不释放）；Docker 用 docker system prune 清理；治本：配 logrotate 轮转 + 磁盘监控告警","c":"这是我真实处理过的故障，可以完整讲：\n项目联调阶段，前端反馈接口大面积超时。排查：\n①df -h 一看根分区 100%；\n②du -sh /var/log 定位到应用日志写了几个 G（联调期日志级别 debug，没轮转）；\n③处理：先 > 日志文件清空恢复服务（不能 rm 正在写入的日志，否则句柄还占着空间），服务立刻恢复；\n④治本：配 logrotate 按天轮转 + 压缩、保留 7 天；写磁盘巡检脚本（超过 80% 发邮件提醒）挂 crontab。\n之后磁盘再没满过，整个过程 20 分钟恢复。这个案例我每次讲故障都会提。"}
];

{"s":5,"t":["project","practice"],"q":"介绍一下你用的 Git 分支策略（Git Flow）？为什么这么定？","a":"我们采用 Git Flow 策略：main（永远可发布）、develop（开发主线）、feature/*（功能分支）、release/*（预发布）、hotfix/*（紧急修复）。\n流程：从 develop 切 feature 分支 → 开发完提 MR 到 develop → 审核通过后合并 → 达到发布节点从 develop 切 release 分支 → 测试通过后合并到 main 并打 tag。\n好处：main 始终稳定可发布，feature 之间互不干扰，release 阶段只修 bug 不混新功能，hotfix 能快速响应线上问题。","c":"我们小组（6人）在培训机构的企业实战项目里用的 Git Flow 变体，对标公司上线标准。\nmaster 受保护，只允许从 release 合并、打 tag 发布；develop 是集成分支；需求从 develop 拉 feature/需求名 分支开发；发布时从 develop 出 release 分支，测试通过后合回 master 和 develop；线上紧急问题走 hotfix 分支直接基于 master 修，修完双合。\n为什么这么定：6 人并行开发，feature 隔离互不干扰，master 永远保持可发布状态，release 层做发布前验证，出问题可随时从 tag 回滚。配套 GitLab 分支保护 + MR 审核，禁止直接 push master。\n可以补充一句：刚开始我们只有 master 一条分支，合并冲突频繁，改成 Git Flow 后冲突少了、发布也有节奏了。"},
{"s":4,"t":["practice"],"q":"Git merge 和 Git rebase 有什么区别？你推荐哪种？","a":"merge：保留完整历史，会产生一个合并提交（merge commit），能看到分支分叉和合并的完整轨迹。\nrebase：将当前分支的提交重放到目标分支之上，形成线性历史，更干净但丢失了分支信息。\n我的建议：公共分支（main/develop）用 merge，保留完整历史可追溯；个人 feature 分支用 rebase 保持提交整洁。已 push 到公共分支的提交禁止 rebase，避免覆盖他人提交。"},
{"s":4,"t":["project","practice"],"q":"什么是 Protected Branch？你在 GitLab 中怎么配置的？","a":"Protected Branch 是 GitLab 的分支保护功能，防止对关键分支的直接 push 和 force push。\n我在 GitLab 中配置：main 和 develop 设为 Protected，Allowed to merge 设为 Maintainer，Allowed to push 设为 No one。\n这样所有人必须通过 MR 合并代码，配合 Code Review 保证代码质量。还设置了 MR 至少需要 1 人 Approve 才能合并。","c":"Protected Branch（受保护分支）我们配了 master 和 develop。\n配置位置：GitLab 项目 → Settings → Repository → Protected Branches。\nmaster 设置：Allowed to merge 选 Maintainer，Allowed to push 选 Nobody，即任何人都不能直接 push，只能走 Merge Request，由维护者合并。\ndevelop 设置：允许 push 限制为 Maintainer，普通开发只能 MR。\n作用：从流程上保证主干稳定——代码必须经过审查才能进 develop，经过测试才能进 master，防止误操作直接污染主分支。\n追问应对：如果面试官问“那你自己怎么提交代码”，答：我在 feature 分支开发，push 后发起 MR，指定 1-2 个同学 review，通过后合并。"},
{"s":4,"t":["practice"],"q":"代码冲突了怎么解决？描述一下你的处理流程。","a":"首先 `git pull` 拉取最新代码，Git 会自动标记冲突文件为 `<<<<<<< HEAD` 和 `>>>>>>> branch`。\n然后打开冲突文件，手动保留需要的代码，去掉冲突标记。如果不确定该保留哪边的，找对应开发者沟通确认。\n接着 `git add` 标记冲突已解决，`git commit` 完成合并。\n关键是：养成频繁 pull、小步提交的习惯，减少冲突概率。合并前先在本地 `git pull --rebase` 预检一下。"},
{"s":4,"t":["theory"],"q":"Git 的 reset、revert、checkout 有什么区别？","a":"reset：移动 HEAD 指针到指定提交，可丢弃提交历史。--soft 保留修改在暂存区，--mixed（默认）保留在工作区，--hard 彻底丢弃。只适用于未推送的本地提交。\nrevert：生成一个新的提交来反向撤销指定提交，不改写历史，安全可用于公共分支。\ncheckout：切换分支或恢复到某个提交，不删除任何提交记录。`git checkout -- file` 可恢复工作区文件。\n简单记：reset 改历史（本地用），revert 加新提交（公共分支用），checkout 切换/恢复。"},
{"s":3,"t":["project","practice"],"q":"MR（Merge Request）的审核流程是怎样的？","a":"我们的 MR 流程：开发者从 feature 分支创建 MR → 填写变更描述和测试说明 → 指定审核者（至少1人）→ 审核者审查代码逻辑、规范、安全性 → 有问题在 MR 里评论讨论 → 修改后重新推送 → 审核通过点 Approve → 合并到 develop → 自动删除源分支。\nJenkins 会在 MR 页面自动触发构建，构建状态实时显示在 MR 上，构建不过不让合并。","c":"我们的 MR 审核流程（GitLab）：\n①开发完成 → push 到 feature 分支 → 在 GitLab 发起 MR 到 develop；\n②MR 描述里写清楚：改了什么、为什么改、影响范围、怎么自测；\n③指定 1-2 个 reviewer，reviewer 看代码 diff 提意见，有问题点 Request changes 打回；\n④MR 集成 Jenkins 构建状态：构建 pending → success/failed，failed 不允许合并（GitLab 的 Merge checks 里开了 Pipelines must succeed）；\n⑤通过后 squash 合并（保持 develop 历史干净），合并完自动删除 feature 分支；\n⑥有冲突时先在本地 rebase develop 解决再推。\n价值：6 人小组里每行代码都有人看，早期我们发现过不少低级问题（SQL 没加条件、配置写死），都被 MR 拦住了。"},
{"s":3,"t":["practice"],"q":"git stash 是干什么的？什么时候用？","a":"`git stash` 用于临时保存当前工作现场（未提交的修改），让工作区变干净，方便切换分支做其他事。\n用完后 `git stash pop` 恢复最近一次 stash 并从列表中删除；`git stash apply` 恢复但不删除。`git stash list` 查看所有暂存。\n典型场景：正在开发 feature，突然要修紧急 bug，先 `git stash` → 切 hotfix 分支修完 → 切回来 `git stash pop` 继续开发。"},
{"s":2,"t":["theory"],"q":"Git 的 cherry-pick 是做什么的？","a":"`cherry-pick` 用于将某个特定提交从一个分支摘到另一个分支上。\n比如 hotfix 提交在 main 上修复了，需要把这个修复同步到 develop，就 `git cherry-pick <commit-hash>`。\n比 merge 整个分支更精准，只挑选需要的提交。注意 cherry-pick 产生的是新提交（hash 不同），不是移动原有提交。"},
{"s":3,"t":["practice"],"q":"怎么修改最近一次提交信息？怎么把多个提交合并成一个？","a":"修改最近一次提交信息：`git commit --amend -m \"新的提交信息\"`（注意只改未推送的提交）。\n合并多个提交（交互式变基）：`git rebase -i HEAD~3`，把要合并的提交前面的 pick 改成 squash，保存后填写合并后的提交信息。\n注意：rebase 会改写历史，只对未推送的本地提交操作；已推送的提交改写历史后需要 `git push --force-with-lease`，团队场景慎用。"},
{"s":2,"t":["practice"],"q":"Git tag 和 branch 的区别？发布版本怎么打标签？","a":"branch 是分支，会随提交前进移动；tag 是某个时间点的快照，创建后固定不变，用于标记版本。\n发布流程：代码合并到 main → 测试通过 → `git tag v1.2.0` → `git push origin v1.2.0`。\n查看：`git tag -l`；删除：`git tag -d v1.2.0`。\n生产回滚时可以根据 tag 快速定位到某个发布版本，配合 `git checkout v1.2.0` 或直接基于 tag 构建镜像。"},
{"s":3,"t":["practice"],"q":".gitignore 是干什么的？一般会忽略哪些内容？","a":".gitignore 用于声明 Git 不需要跟踪的文件，避免把构建产物、依赖、本地配置等提交到仓库。\n常见忽略项：\n- 构建产物：target/、build/、dist/、*.jar、*.war\n- 依赖目录：node_modules/、vendor/（通常依赖走依赖锁文件）\n- IDE/系统文件：.idea/、.vscode/、*.iml、.DS_Store\n- 日志/临时文件：*.log、*.tmp\n- 敏感文件：.env、application-local.yml（密钥不进仓库）\n我习惯把敏感配置通过 .env 或 GitLab CI/CD 变量管理，仓库里只保留模板。"},
{"s":3,"t":["theory","project"],"q":"GitLab 和 GitHub 有什么区别？在 CI/CD 中 GitLab 怎么和 Jenkins 配合？","a":"GitHub 偏开源社区生态，托管公开仓库为主，自带 GitHub Actions；GitLab 更偏企业内部 DevOps 平台，内置 CI/CD（GitLab CI）、容器仓库、Issue/Epic 管理，自托管部署方便。\nGitLab 与 Jenkins 的配合：GitLab 托管代码并配置 Webhook → push 或 MR 事件触发 Jenkins 构建 → Jenkins 拉代码、编译、部署 → 通过 Commit Status API 把构建状态回写到 GitLab MR 页面。\n现在 GitLab CI 本身也很成熟，如果公司用 GitLab，也可以直接用它替代 Jenkins，少维护一个系统。","c":"区别（结合我们场景说）：\n①部署方式：GitLab 可自托管到公司内网，代码不出内网，GitHub 是 SaaS 云端（企业版才能私有部署）；\n②CI/CD：GitLab 内置 GitLab CI（.gitlab-ci.yml），GitHub 用 GitHub Actions，两者都能做流水线；我们组当时 Jenkins 更熟所以用了 Jenkins + GitLab 组合；\n③权限管理：GitLab 的组/角色/分支保护权限更细，适合企业内部管理；\n④MR/PR 流程类似，GitLab 的 MR 集成外部 CI 状态（比如 Jenkins）体验好。\n总结：对公司和团队来说，内网自托管 + 权限可控 + 和 Jenkins 配合顺畅，是我们选 GitLab 的原因。"}

{"s":5,"t":["project","practice"],"q":"描述一下你做的 CI/CD 完整流程？从代码提交到部署上线。","a":"完整流程：开发 push 代码到 GitLab → Webhook 触发 Jenkins → Jenkins 拉取最新代码 → Maven 编译打包 → Publish Over SSH 将 jar 包传到目标服务器 → 执行远程部署脚本（备份旧包 → 停服务 → 替换新包 → 启服务 → 健康检查）。\n开发环境通过 Webhook 自动触发部署；生产环境 Jenkins 任务设为参数化构建，手动选择版本确认后触发。\n部署失败自动回滚到上一个版本，同时通过钉钉通知开发团队构建结果。","c":"完整流程（我们组的落地）：\n①开发 push 代码到 GitLab 的 feature 分支，发起 MR 合并到 develop；\n②GitLab Webhook 触发 Jenkins（只监听 merge 到 develop/master 的事件）；\n③Jenkins Pipeline 拉取代码 → Maven 打包（mvn clean package -DskipTests）→ Docker 构建镜像（多阶段 Dockerfile）→ 推送到私有仓库 Harbor；\n④测试环境：自动部署，docker compose 拉新镜像滚动更新；\n⑤测试通过 → 生产发布走参数化构建手动触发：选版本号 → 部署脚本执行（备份旧包 → 停服务 → 替换 → 启动 → curl 健康检查 60 秒 → 失败自动回滚）；\n⑥构建结果回写 GitLab MR，失败邮件 + 企微机器人通知。\n量化：原来手动发布一次约 15 分钟，自动化后约 3 分钟，支持一键回滚；发布频率从每周 1-2 次提升到每天 2-3 次。\n我负责的部分：Jenkins 流水线、部署脚本、Webhook 配置、Harbor 搭建。"},
{"s":5,"t":["project","practice"],"q":"GitLab Webhook 的工作原理是什么？怎么配置的？","a":"Webhook 本质是 GitLab 的事件回调机制：当 GitLab 发生 push/merge 等事件时，向预设的 URL 发送 HTTP POST 请求，携带事件详情（分支、提交者、commit 信息等）。\n配置流程：GitLab 项目 → Settings → Webhooks → 填入 Jenkins 的触发 URL（如 http://jenkins:8080/project/app-name）→ 选择触发事件（Push events）→ 设置 Secret Token 验证 → 保存后点 Test 验证连通性。\nJenkins 端需安装 GitLab Plugin，配置相同的 Token，并勾选 Build when a change is pushed to GitLab。","c":"GitLab Webhook 原理：GitLab 在指定事件发生时（push、MR、tag）向配置的 URL 发 HTTP POST 请求，请求体带事件类型和仓库信息，Jenkins 收到后触发对应 Job。\n配置步骤：\n①GitLab 项目 → Settings → Webhooks → 填 Jenkins 的触发地址（http://jenkins:8080/project/任务名，或 GitLab 插件生成的地址）+ Secret Token；\n②选触发事件：Push events、Merge Request events；\n③Jenkins 侧装 GitLab Plugin，在 Job 里配置 GitLab Connection，Token 和 GitLab 保持一致，勾选触发条件（push 到指定分支/MR 事件）；\n④配好后 git push 一次验证：GitLab Webhooks 页面有 Recent Deliveries，能看到请求是否发出、响应码，排查很方便。\n踩坑：我们配好后一直不触发，查 Recent Deliveries 发现回调被拒（503），排查是 Jenkins 服务器 IP 没在 GitLab 出站白名单里，加上就好了。"},
{"s":5,"t":["project","practice"],"q":"为什么开发环境自动部署，生产环境要手动触发？","a":"开发环境自动部署：追求效率，开发提交后立刻部署验证，快速反馈问题。开发环境容错成本低，自动部署能极大提升迭代速度。\n生产环境手动触发：追求稳定可控。生产部署涉及业务影响，需要人工确认版本号、发布内容、回滚方案等。手动触发前通常要求：MR 已审核、构建已通过、测试已通过、有回滚方案。\n这体现了运维的核心原则：开发环境要效率，生产环境要安全。","c":"核心原因：风险控制。\n开发环境自动部署：代码合入就构建部署，让问题尽快暴露，反馈快、迭代快，部署错了影响也小。\n生产环境手动触发：\n①生产是用户环境，误触发代价大（一个手滑 push 可能把半成品推上线）；\n②发布要带决策：这次发哪个版本？回滚到哪个版本？什么时间窗口发？需要人确认；\n③留审计：手动触发有操作记录，出问题能追溯是谁、什么时候、发的哪个版本。\n实现方式：生产 Job 用参数化构建（版本号、目标环境），不在 Webhook 自动触发列表里，只有配置了权限的人能点。\n延伸：这也符合发布流程规范——测试环境随便试，生产环境必须有审批和回滚预案。"},
{"s":4,"t":["project","practice"],"q":"Jenkins Freestyle 和 Pipeline 有什么区别？","a":"Freestyle：界面化配置，拖拽式操作，上手快。但配置不可版本控制，复杂流程维护困难，难以复用。\nPipeline：用 Jenkinsfile 定义流水线，代码化管理，可以纳入 Git 版本控制。支持声明式和脚本式语法，stage 清晰、可复用、可参数化。\n我们项目用 Pipeline，Jenkinsfile 放在代码仓库根目录，流程变更和代码变更一起审核，实现了基础设施即代码的理念。","c":"区别：\nFreestyle（自由风格项目）：全部在 Jenkins 网页上配置（源码管理、构建步骤、后置操作），上手简单，适合简单构建；缺点：配置不落库、不可版本化、复杂流程难表达、分支间不好复用。\nPipeline（流水线）：用 Jenkinsfile 写在代码仓库里，构建流程即代码：\n①Jenkinsfile 随项目走，可以 review、可以版本化，不同分支用不同 Jenkinsfile；\n②stage 可视化，每步成功失败一目了然；\n③参数化、并行、条件执行都方便；\n④复用：共享库可以沉淀公共步骤（比如打镜像、部署）。\n我们前期用 Freestyle，后期把部署流程改造成 Pipeline，理由就是流程要版本化、要能 review、要能复用——这也符合“代码即配置”的规范。"},
{"s":4,"t":["project","practice"],"q":"Publish Over SSH 插件的工作流程是什么？","a":"工作流：①配置 SSH Server（在 Jenkins 系统配置中添加目标服务器 IP、用户名、SSH 密钥/密码）→ ②构建后操作：选择 Send build artifacts over SSH → ③传输文件：将构建产物（如 jar 包）通过 SCP 传到目标服务器指定目录 → ④执行远程命令：Exec command 中写部署脚本（停服务、替换包、启服务）。\n支持传输多个文件、目标多个服务器，配合通配符灵活匹配产物路径。","c":"Publish Over SSH 插件流程（我们前期用的分发方案）：\n①Jenkins 全局配置：Manage Jenkins → Configure System → Publish over SSH，添加 SSH Server（主机、端口、凭据、远程工作目录）；\n②构建产物在 Jenkins 端生成（比如 mvn package 出的 jar）；\n③构建后操作里配置 SSH Publisher：把本地文件（jar、部署脚本）传输到目标服务器的远程目录；\n④传输完可以再执行 Exec command，在目标机上跑远程部署命令（比如 sh deploy.sh）；\n关键点：\n- 凭据用 SSH 密钥（我们在凭据库里管私钥），不用密码；\n- 远程目录要规划好（/opt/app/{project}/ 放 jar，脚本统一在 /opt/scripts/）；\n- 传输+执行是分开的两步，可以灵活组合。\n后来我们迁移到 Docker + Harbor 后，部署改成拉镜像方式，Publish Over SSH 只保留在非容器化的存量服务上。"},
{"s":4,"t":["troubleshoot"],"q":"Webhook 配置了但不触发构建，怎么排查？","a":"①检查 Webhook URL：URL 是否正确、Jenkins 是否在运行、网络是否通（从 GitLab 服务器 telnet Jenkins 端口）。\n②检查 Token：GitLab 和 Jenkins 配置的 Secret Token 必须一致。\n③检查触发条件：Jenkins 任务是否勾选了 Build when a change is pushed to GitLab，分支过滤是否匹配。\n④查看日志：GitLab Webhook 页面点 Test 看返回状态码，Jenkins 系统日志看是否有触发记录。\n⑤检查防火墙：GitLab 服务器能否访问 Jenkins 端口。"},
{"s":4,"t":["troubleshoot"],"q":"Publish Over SSH 连接失败怎么排查？","a":"①检查 SSH 密钥/密码：Jenkins 配置的凭据是否正确，手动在 Jenkins 服务器 `ssh user@target` 测试连通性。\n②检查端口：目标服务器 SSH 端口是否开放（`telnet ip 22`）。\n③检查 known_hosts：首次连接需接受指纹，在 Jenkins 服务器上先手动 SSH 一次接受指纹。\n④检查用户权限：部署目录的读写权限。\n⑤检查防火墙：iptables/firewalld 是否放行 SSH 端口。\n⑥查看 Jenkins 构建日志：具体报错信息会指出是认证失败、超时还是连接拒绝。"},
{"s":4,"t":["project","practice"],"q":"构建成功后部署脚本里做了什么？（备份、停服务、启服务）","a":"部署脚本核心步骤：①备份：`cp app.jar backup/app-$(date +%Y%m%d%H%M).jar`，保留最近3个版本。\n②停服务：`kill $(cat app.pid)`，等待进程完全退出。\n③替换新包：`cp app.jar /opt/app/`。\n④启服务：`nohup java -jar app.jar > /dev/null 2>&1 &`，记录 PID。\n⑤健康检查：循环调用 `curl /health`，等待返回 200（超时60秒则判定失败）。\n⑥回滚：健康检查失败则自动从 backup 恢复并重启。","c":"部署脚本的完整闭环（我写的，核心是'能回滚'）：\n①备份：cp app.jar app.jar.$(date +%Y%m%d%H%M%S)，保留最近 3 份（超过就删最旧的），备份目录和运行目录分开；\n②停服务：systemctl stop app 或 kill 旧进程（先尝试优雅停止，等 10 秒再强杀，防止数据没落盘）；\n③替换：把新包 mv 到运行目录，注意先校验文件大小/校验和不为空，防止传了半个包；\n④启动：systemctl start app，记录启动日志；\n⑤健康检查：for 循环 curl -f http://127.0.0.1:8080/actuator/health，60 秒内返回成功才认为部署成功（不能只看端口通，要看健康接口，防止假死）；\n⑥失败回滚：健康检查超时就自动恢复备份的 jar 重启，并邮件通知。\n补充：脚本里加了 set -e 和日志输出，出问题看 /var/log/deploy.log 能定位是哪一步挂了。"},
{"s":3,"t":["project","practice"],"q":"构建失败怎么通知开发团队？","a":"我们采用多渠道通知：①钉钉机器人：Jenkins 安装钉钉插件，构建失败自动推送群消息，包含项目名、分支、失败阶段、构建链接。\n②邮件通知：配置 Email Extension Plugin，失败时发给提交者和项目负责人。\n③GitLab Commit Status：构建状态回写到 GitLab MR 页面，审核者能直接看到。\n消息内容会包含构建日志的关键报错信息，方便开发快速定位。","c":"我们做了双通道通知：\n①邮件：Jenkins 的 Editable Email Notification，配了失败模板（构建号、分支、失败步骤、日志链接），并且失败恢复（绿色）也发一条，避免“静默恢复”；\n②企微/钉钉机器人：Jenkins 企微插件，Webhook 推送到项目群，消息带 Job 名、分支、触发人、失败日志链接，点链接直接看；\n③MR 页面集成：构建状态回写 GitLab commit status，MR 页直接显示构建失败，reviewer 和开发都能看到。\n关键点：通知要“到达责任人”——按分支归属通知对应开发，而不是全组轰炸；失败要附日志链接而不是只说“构建失败”。\n补充：我们还配了失败重试（自动重试 1 次，排除偶发网络问题），重试仍失败才告警，减少噪音。"},
{"s":3,"t":["project","practice"],"q":"如何在 GitLab MR 页面集成 Jenkins 构建状态？","a":"通过 GitLab Commit Status API 实现：Jenkins 安装 GitLab Plugin，构建开始/结束自动调用 API 更新 commit 状态（pending/success/failed）。\n在 GitLab MR 页面会显示 Jenkins 构建状态标识，绿色勾表示通过，红色叉表示失败。可以设置构建必须通过才能合并的保护规则。\nJenkinsfile 中用 `updateGitlabCommitStatus name: 'jenkins', state: 'success'` 实现状态回写。","c":"实现思路：让 GitLab MR 显示 Jenkins 的构建状态。\n做法：\n①Jenkins 装 GitLab Plugin，配置 GitLab Connection（URL、Token）；\n②流水线里 Jenkins 把构建状态回写为 GitLab 的 commit status：构建开始 → pending，成功 → success，失败 → failed；\n③GitLab 项目 Settings → Merge Requests → Merge checks 里开启 “Pipelines must succeed”（或配置外部状态检查）；\n④这样 MR 页面会出现 Jenkins 构建状态小图标，failed 时无法点合并。\n效果：质量门禁前置——代码没构建通过就合不了，开发被迫及时看到构建问题。\n踩坑：回写不成功大多是 Token 权限问题（Token 要有 api 权限且属于有权限的用户），排查 GitLab 的 commit status API 能否访问。"},
{"s":2,"t":["project","practice"],"q":"Jenkins 如何实现多节点构建（Master-Slave）？","a":"Jenkins Master-Slave 架构：Master 负责任务调度、UI 展示、配置管理；Slave（Agent/Node）负责实际执行构建任务。\n配置方式：Jenkins 管理界面 → Manage Nodes → New Node → 配置 Slave 的 SSH 连接信息（IP、用户名、密钥、工作目录）→ 选择启动方式（Launch via SSH）。\n可以按标签分配任务到不同节点，比如 Java 构建节点装 JDK，前端节点装 Node.js，实现构建环境隔离和负载分担。","c":"Jenkins Master-Slave（主从）原理：Master 负责调度和 Web 界面，构建任务分配到 Slave（代理节点）上执行，构建不占主节点资源。\n配置步骤：\n①Manage Jenkins → Nodes → New Node，起名如 build-node；\n②填远程工作目录、标签（label，比如 build/deploy 区分用途）；\n③启动方式：Java Web Start 或 SSH（我们用 SSH：填 slave 地址和凭据，Jenkins 把 agent.jar 推过去启动）；\n④Job 里用 Restrict where this project can be run 指定 label，让任务跑到对应节点。\n好处：\n- 构建和部署环境隔离（build 节点只做编译，deploy 节点贴近测试环境）；\n- 多个节点并行构建，排队时间下降；\n- 主节点挂了不影响已构建任务。\n我们规模不大用了 1 个 build 节点 + 主节点，主要是为了环境隔离而不是性能。"},
{"s":2,"t":["project","practice"],"q":"Jenkins 凭据（Credentials）是怎么管理的？","a":"Jenkins 凭据管理通过 Credentials Plugin 统一管理，支持多种类型：Username/Password、SSH Key、Secret Text、Secret File、Certificate。\n凭据按 Scope 分为 System（全局，仅系统级使用）和 Global（流水线/任务可用）。\n在 Pipeline 中通过 `credentials('credential-id')` 引用，不会在日志中暴露明文。我们常用的凭据包括：GitLab 访问 Token、服务器 SSH 密钥、数据库密码、钉钉 Webhook URL 等。","c":"Jenkins 凭据管理（Credentials）：\n①凭据库：Manage Jenkins → Credentials，支持的类型：Username/Password、SSH Key、Secret text、Secret file、证书；\n②我们存的：GitLab Token（拉代码用）、服务器 SSH 私钥（Publish Over SSH 用）、Harbor 账号密码（推镜像用）；\n③使用方式：Job 里通过凭据 ID 引用（credentialsId），不把密码明文写在脚本或 Jenkinsfile 里；Pipeline 里用 withCredentials 注入环境变量，用完即销毁；\n④权限控制：凭据按用户/角色授权，普通开发看不到生产服务器的凭据；\n⑤安全习惯：GitLab/Harbor 用令牌（Token）不用账号密码，定期轮换。\n补充：凭据本身在 Jenkins 里是加密存储的（AES），导出 Jenkinsfile 也不会泄露明文。"},
{"s":4,"t":["project","practice"],"q":"什么是参数化构建？生产发布怎么做版本选择和回滚？","a":"参数化构建是 Jenkins 任务支持在触发时传入参数，常用类型：Choice（下拉选项）、String（文本）、Boolean。\n生产发布做法：把要部署的版本号/分支/目标环境设成 Choice 参数，运维在 Jenkins 界面选择确认后执行，避免误发。\n回滚做法：\n1. 部署脚本保留最近 N 个备份包（带时间戳）\n2. 回滚时参数化任务选择\"上一版本\"或指定备份文件名，执行反向部署（用备份包替换当前包）\n3. 更规范的可以用镜像 tag 回滚（如 docker tag v1.2.0 替换 v1.2.1 重新拉起）\n关键是回滚路径要提前演练过，别等出事了再想。","c":"参数化构建（Parameterized Build）：构建时由人选择参数，而不是写死。\n我们生产发布的参数：\n①版本号：Choice 参数或从 GitLab tag 动态拉取（Extensible Choice），发布时选要发的 tag（如 v1.2.3）；\n②目标环境：Choice（prod-a/prod-b）；\n③是否跳过健康检查：布尔参数，紧急时用。\n回滚设计（关键）：\n- 部署脚本天然支持回滚：每次部署前备份旧包（保留 3 份）；\n- 回滚 = 再触发一次构建，版本号选上一个 tag 即可，走同一套部署+健康检查流程；\n- 不像手动回滚要临时写命令，一键完成，且回滚也有日志和通知。\n版本规范：Git tag 语义化（v主.次.修），Jenkins 用 tag 作为产物版本，镜像 tag 和 jar 版本一一对应，追溯方便。"},
{"s":3,"t":["theory","project"],"q":"灰度发布、蓝绿部署、滚动发布了解吗？有什么区别？","a":"灰度发布（金丝雀）：先让一小部分流量（如5%）走到新版本，验证无误后逐步放大比例，直到全量。风险最小，可用 Nginx 权重或网关分流实现。\n蓝绿部署：同时保留两套环境（蓝=旧、绿=新），新版本在绿环境验证后，通过切负载均衡把流量整体切过去，回滚就是切回来。切换快，但需要双倍资源。\n滚动发布：逐批替换实例（如 K8s 默认策略），一批就绪后再替换下一批，服务不中断，但新旧版本短暂共存。\n运维角度看：能灰度的尽量灰度，回滚方案要提前想好。","c":"三种发布策略区别：\n①蓝绿部署（Blue/Green）：准备两套完全相同的环境，新版部署到绿环境，验证通过后把流量整体切到绿，旧蓝环境保留随时切回。优点：切换快、回滚就是切回；缺点：需要双倍资源。\n②滚动发布（Rolling）：逐个/逐批替换实例，比如 Nginx upstream 下 2 个后端实例，先停一个、更新、健康检查通过后再更新另一个。优点：不需要额外资源、服务不中断；缺点：新旧版本共存期有兼容问题风险（比如数据库字段不兼容）。\n③灰度发布（Canary）：先放少量流量到新版本（比如 5%-10%），观察指标正常再逐步放大到 100%。优点：风险最小、能真实观测；缺点：需要网关/负载均衡支持按比例分流。\n我们的实践：项目里实际用的是滚动发布（Compose + Nginx 多实例逐个更新）；灰度讲的是原理，公司级灰度需要网关层（如 Spring Cloud Gateway 权重路由 / 云厂商灰度能力）支持，我们环境没到那一步，但我研究过。"},
{"s":3,"t":["practice","troubleshoot"],"q":"Jenkins 构建时间太长怎么优化？","a":"①启用 Maven 依赖缓存：在 Jenkins 上配置本地仓库（`-Dmaven.repo.local`），避免每次全量下载依赖。\n②利用增量构建：Git 插件只拉取变更提交，或使用 `git diff` 判断是否需要构建。\n③多节点并行：拆分到多个 Slave 并行执行（如前端、后端、测试并行）。\n④Pipeline 优化：缓存 node_modules、利用 Docker 层缓存。\n⑤跳过不必要的测试/静态检查（或改为异步）。\n先看构建日志里哪一步耗时最长（下载依赖？编译？测试？），对症下药。"},
{"s":2,"t":["practice"],"q":"构建产物（jar/war/镜像）怎么管理和留存？","a":"本地留存：部署脚本按时间戳备份保留最近 N 份。\n统一归档：Jenkins 配置 Archive Artifacts 把产物存档在 Master，或上传到 Nexus/Artifactory 私服统一管理版本。\n镜像场景：推到私有镜像仓库（Harbor/Registry），按 tag 管理版本，`latest` 只在开发环境用，生产必须用具体版本 tag。\n好处：可追溯、可回滚、跨环境复用，避免\"构建产物在开发本地，生产装不了\"的问题。"}
